:119,tag:`Fijo`},{label:`Almacenamiento en la nube`,amount:49,tag:`Fijo`},{label:`App de ejercicio (no la abre desde marzo)`,amount:99,tag:`Cuidado`},{label:`Pase de un videojuego`,amount:79,tag:`Deseo`}]},terms:[{term:`Suscripción`,def:`Servicio que pagas de forma automática cada cierto tiempo mientras no lo canceles.`},{term:`Cargo recurrente`,def:`Cobro que se repite en tu tarjeta o cuenta sin que lo autorices cada vez.`}]},{type:`choice`,prompt:`¿Cuánto paga Luis al mes por todas sus suscripciones?`,options:[`$485`,`$406`,`$386`],correct:0,explain:`$139 + $119 + $49 + $99 + $79 = $485 al mes.`},{type:`choice`,prompt:`¿Y cuánto suma eso en un año?`,options:[`$4,850`,`$5,820`,`$6,200`],correct:1,explain:`$485 × 12 = $5,820 al año. Ver el número anual ayuda a decidir qué vale la pena conservar.`},{type:`choice`,prompt:`Si Luis cancela solo la app de ejercicio que no usa, ¿cuánto ahorra en un año?`,options:[`$99`,`$990`,`$1,188`],correct:2,explain:`$99 × 12 = $1,188 al año, sin dejar de disfrutar lo que sí usa.`},{type:`intro`,title:`La trampa de la prueba gratis`,body:[`Muchas pruebas gratis piden tu tarjeta desde el inicio. Al terminar el periodo, empiezan a cobrar solas si no cancelas.`,`Algunas cambian de un precio de promoción a uno más alto después de unos meses. Lee cuánto costará después de la promoción.`,`Ojo: borrar la app de tu celular no cancela la suscripción. Hay que cancelarla en la cuenta, la tienda de apps o la página del servicio.`],callout:{tone:`tip`,text:`Cuando actives una prueba gratis, pon una alarma en tu celular un día antes de que termine para decidir si la conservas.`}},{type:`truefalse`,statement:`Si borras la app de tu celular, la suscripción se cancela automáticamente.`,answer:!1,explain:`Mito. El cobro sigue hasta que canceles en tu cuenta del servicio o en la tienda de apps donde te suscribiste.`},{type:`choice`,prompt:`Activaste una prueba gratis de 7 días que después cobra $129 al mes. Te das cuenta del cargo 3 meses después. ¿Cuánto pagaste sin usarla?`,options:[`$129`,`$258`,`$387`],correct:2,explain:`$129 × 3 = $387. Una alarma antes de que termine la prueba te habría ahorrado ese dinero.`},{type:`intro`,title:`Revisa y cancela a tiempo`,body:[`Una vez al mes, revisa tu estado de cuenta o los movimientos en la app de tu banco. Busca cargos que se repiten.`,`Pregúntate por cada uno: ¿lo usé este mes?, ¿lo pagaría hoy si no lo tuviera? Si la respuesta es no, cancélalo.`,`Los planes anuales pueden salir más baratos por mes, pero solo convienen si de verdad lo vas a usar todo el año.`],callout:{tone:`dato`,text:`Si un proveedor te sigue cobrando después de cancelar, guarda tu comprobante de cancelación. Puedes pedir aclaración a tu banco y quejarte en la PROFECO.`}},{type:`choice`,prompt:`Un servicio cuesta $129 al mes o $1,099 al año. ¿Cuánto ahorras con el plan anual si lo usas los 12 meses?`,options:[`$449`,`$129`,`$1,099`],correct:0,explain:`$129 × 12 = $1,548. $1,548 − $1,099 = $449 de ahorro, siempre que lo uses todo el año.`},{type:`truefalse`,statement:`Pagar un plan anual siempre es mejor que pagar cada mes.`,answer:!1,explain:`Mito. Si dejas de usarlo a los 4 meses, ya pagaste el año completo. El anual conviene solo cuando estás seguro de usarlo.`}],keyPoints:[`Suma tus suscripciones y multiplícalas por 12 para ver el costo anual.`,`Pon una alarma antes de que termine una prueba gratis.`,`Borrar la app no cancela: cancela en la cuenta o la tienda de apps.`,`Revisa tu estado de cuenta cada mes en busca de cargos repetidos.`]},{id:`m8-l4`,title:`Ofertas, publicidad y "compra ahora, paga después"`,summary:`Urgencia artificial, descuentos falsos y pagos diferidos que comprometen tu ingreso.`,minutes:7,xp:70,objectives:[`Reconocer tácticas de urgencia y escasez artificial`,`Calcular el descuento real de una promoción`,`Evaluar si un pago diferido cabe en tu ingreso futuro`],steps:[{type:`intro`,title:`Cuando la prisa decide por ti`,body:[`Relojes que cuentan hacia atrás, "solo quedan 2" o "12 personas están viendo esto": son mensajes para que compres sin pensar.`,`A veces son reales, pero muchas veces la oferta se repite la semana siguiente.`,`Una regla útil: si no lo tenías en mente antes de ver el anuncio, espera 24 horas. Si mañana lo sigues queriendo y te alcanza, adelante.`],terms:[{term:`Urgencia artificial`,def:`Presión de tiempo creada para que decidas rápido, como contadores o "última oportunidad".`},{term:`Escasez`,def:`Mensajes de que quedan pocas piezas, para que sientas que debes comprar ya.`}],callout:{tone:`tip`,text:`Deja productos en el carrito o en una lista de deseos y regresa después. Muchas compras impulsivas pierden su encanto en un día.`}},{type:`choice`,prompt:`Ves unos tenis con un contador: "La oferta termina en 9:59 minutos". No los tenías planeados. ¿Qué es lo más sensato?`,options:[`Comprar rápido para no perderla`,`Pedir prestado para alcanzar la oferta`,`Esperar y revisar si los necesitas y si te alcanza`],correct:2,explain:`El contador busca que decidas con prisa. Si no estaban en tu plan, darte tiempo te ayuda a decidir con calma.`},{type:`intro`,title:`Descuentos que no son tan descuentos`,body:[`Algunas tiendas suben el precio antes de una temporada de ofertas y luego anuncian un gran descuento. El "antes" no siempre es real.`,`Compara el precio con otras tiendas o revisa cuánto costaba semanas antes.`,`En promociones como "3x2" o "segundo al 50%", calcula cuánto pagas en total y si de verdad necesitas más de una pieza.`],example:{who:`Mariana, 19 años, prepa y ventas por catálogo`,text:`Ve una promoción de "segundo al 50%" en playeras (precio ilustrativo):`,rows:[{label:`Primera playera`,amount:400},{label:`Segunda playera (50%)`,amount:200},{label:`Total por dos`,amount:600}]}},{type:`choice`,prompt:`En el ejemplo de Mariana, sin promoción las dos playeras costarían $800. ¿Qué descuento real obtiene sobre el total?`,options:[`50%`,`25%`,`20%`],correct:1,explain:`$800 − $600 = $200 de ahorro. $200 ÷ $800 = 25%. Y solo es ahorro si necesitaba dos playeras.`},{type:`choice`,prompt:`Una chamarra anuncia "30% de descuento" sobre $1,500. ¿Cuánto pagas?`,options:[`$1,050`,`$1,200`,`$450`],correct:0,explain:`$1,500 × 30% = $450 de descuento. $1,500 − $450 = $1,050.`},{type:`truefalse`,statement:`Si un producto dice "antes $1,999, ahora $999", seguro estás ahorrando $1,000.`,answer:!1,explain:`Mito. El precio de "antes" puede estar inflado. Compara con otras tiendas para saber el ahorro real.`},{type:`intro`,title:`"Compra ahora, paga después"`,body:[`Algunas tiendas y apps te dejan pagar una compra en varias partes, por ejemplo en 4 pagos quincenales o mensuales. Es una forma de crédito.`,`Cada compra diferida ocupa una parte de tu ingreso de los próximos meses. Varias al mismo tiempo pueden apretar tu presupuesto sin que lo notes.`,`Lee las condiciones: algunas cobran intereses, comisiones por atraso o por apertura. Y pagar tarde puede afectar tu historial crediticio.`],example:{who:`Karla, 19 años, gana $5,000 al mes en una cafetería`,text:`Hizo tres compras en pagos al mismo tiempo. Esto debe cada mes:`,rows:[{label:`Tenis: 4 pagos`,amount:400,tag:`Fijo`},{label:`Audífonos: 3 pagos`,amount:300,tag:`Fijo`},{label:`Ropa: 4 pagos`,amount:300,tag:`Fijo`}]},callout:{tone:`alerta`,text:`Una comisión por atraso puede ser alta comparada con el pago. Si pagas tarde varias veces, la compra te sale mucho más cara.`},terms:[{term:`Pago diferido`,def:`Pagar una compra en partes durante varias semanas o meses en lugar de todo al momento.`},{term:`Comisión por atraso`,def:`Cargo extra que te cobran si no pagas a tiempo una parte.`}]},{type:`choice`,prompt:`¿Qué porcentaje de su ingreso mensual de $5,000 destina Karla a estos pagos?`,options:[`10%`,`15%`,`20%`],correct:2,explain:`$400 + $300 + $300 = $1,000. $1,000 ÷ $5,000 = 20% de su ingreso, comprometido antes de pagar pasajes, comida o ahorro.`},{type:`choice`,prompt:`Si Karla se atrasa en 2 pagos y la comisión ilustrativa es de $150 por atraso, ¿cuánto paga de más?`,options:[`$150`,`$300`,`$1,000`],correct:1,explain:`$150 × 2 = $300 extra. Eso equivale a un pago completo de los audífonos o de la ropa.`},{type:`truefalse`,statement:`Pagar una compra en partes no compromete tu dinero futuro porque cada pago es pequeño.`,answer:!1,explain:`Mito. Cada pago, aunque sea pequeño, ya está apartado de tus próximos ingresos. Sumados, pueden ocupar una buena parte de tu quincena.`}],keyPoints:[`Contadores y "quedan pocas" buscan que decidas con prisa: date tiempo.`,`Calcula el descuento real y compara el precio con otras tiendas.`,`Suma todos tus pagos diferidos antes de agregar uno más.`,`Pagar tarde genera comisiones y puede afectar tu historial.`]}]},{id:`m4`,title:`Crédito y deuda`,description:`Tarjetas, intereses, historial crediticio, préstamos rápidos y cómo salir de deudas sin perder la calma.`,why:`Pronto te ofrecerán tarjetas, préstamos y pagos a plazos. Entender cómo funcionan te ayuda a usarlos a tu favor, construir un buen historial y evitar trampas.`,lessons:[{id:`m4-l1`,title:`Cómo funciona una tarjeta de crédito`,summary:`Límite, fecha de corte, fecha límite de pago y la diferencia entre los pagos.`,minutes:6,xp:60,objectives:[`Distinguir la fecha de corte de la fecha límite de pago`,`Diferenciar el pago mínimo del pago para no generar intereses`,`Reconocer hábitos que hacen de la tarjeta una herramienta útil`],steps:[{type:`intro`,title:`Dinero prestado, no dinero extra`,body:[`Una tarjeta de crédito es un préstamo que el banco te da hasta un límite. Todo lo que gastas lo debes devolver.`,`Cada mes tiene dos fechas clave. En la fecha de corte se suman tus compras del periodo. La fecha límite de pago es el último día para pagar sin recargos, normalmente unos 20 días después del corte.`,`Cuando pagas, el monto vuelve a quedar disponible en tu límite.`],terms:[{term:`Límite de crédito`,def:`Lo máximo que el banco te presta en esa tarjeta. No es dinero tuyo.`},{term:`Fecha de corte`,def:`Día en que el banco cierra el periodo y suma lo que gastaste.`},{term:`Fecha límite de pago`,def:`Último día para pagar lo del periodo sin recargos ni intereses por atraso.`}]},{type:`choice`,prompt:`Tu límite de crédito es $10,000. Eso significa que…`,options:[`Tienes $10,000 extra de ingreso`,`El banco te regala $10,000`,`Puedes deber hasta $10,000`],correct:2,explain:`El límite es lo máximo que te prestan. Todo lo que uses lo tendrás que pagar.`},{type:`choice`,prompt:`Tu fecha de corte es el día 5 y tienes 20 días para pagar. ¿Cuál es tu fecha límite de pago?`,options:[`El día 25`,`El día 20`,`El día 5 del mes siguiente`],correct:0,explain:`5 + 20 = día 25. Revisa la fecha exacta en tu estado de cuenta, porque puede moverse por fines de semana o días festivos.`},{type:`intro`,title:`Los pagos de tu estado de cuenta`,body:[`Tu estado de cuenta muestra varios montos. El pago para no generar intereses cubre todo lo que usaste en el periodo.`,`El pago mínimo es lo menos que puedes pagar para no caer en atraso. Pero todo lo que no pagas empieza a generar intereses, y esos intereses también pagan IVA.`,`Pagar solo el mínimo mes tras mes hace que una deuda pequeña dure años y cueste mucho más.`],example:{who:`Diego, 21 años, uni y trabajo de medio tiempo`,text:`Su estado de cuenta de este mes dice (montos ilustrativos):`,rows:[{label:`Pago para no generar intereses`,amount:3e3,tag:`Ahorro`},{label:`Pago mínimo`,amount:300,tag:`Cuidado`}]},callout:{tone:`alerta`,text:`Si Diego paga solo $300, los $2,700 restantes empiezan a generar intereses. El mínimo evita recargos por atraso, no los intereses.`}},{type:`choice`,prompt:`¿Qué pago evita que te cobren intereses en el periodo?`,options:[`El pago mínimo`,`Cualquier pago mayor a $100`,`El pago para no generar intereses`],correct:2,explain:`Cubre todo lo que usaste en el periodo. El mínimo solo evita recargos por atraso, pero el resto genera intereses.`},{type:`truefalse`,statement:`Si pagas el mínimo a tiempo, no te cobran intereses.`,answer:!1,explain:`Mito. Pagar el mínimo evita el atraso, pero lo que no pagaste genera intereses más IVA.`},{type:`intro`,title:`Una herramienta, si la usas a tu favor`,body:[`Usada con cuidado, una tarjeta te ayuda a construir historial crediticio, que te servirá después para rentar, comprar un auto o pedir un crédito de vivienda.`,`Buenos hábitos: gasta solo lo que podrías pagar con tu dinero, paga el total antes de la fecha límite y no uses todo tu límite. Muchos especialistas sugieren usar menos de un tercio.`,`Evita sacar efectivo con la tarjeta de crédito: normalmente cobra comisión y genera intereses desde el primer día.`],callout:{tone:`tip`,text:`Activa el pago automático del total en tu fecha límite o pon una alarma unos días antes. Olvidar la fecha es el error más común.`}},{type:`choice`,prompt:`Usar la tarjeta y pagar el total cada mes puede…`,options:[`Dañar siempre tu historial`,`Ayudarte a construir un buen historial crediticio`,`Generar intereses de todas formas`],correct:1,explain:`Usada con responsabilidad, una tarjeta demuestra que pagas a tiempo. No toda deuda es mala.`},{type:`choice`,prompt:`Tienes un límite de $10,000. ¿Qué uso mensual se acerca más a la recomendación de no pasar de un tercio?`,options:[`$9,000`,`$3,000`,`$6,500`],correct:1,explain:`Un tercio de $10,000 es unos $3,300. Con $3,000 usas 30% de tu límite y te queda margen para emergencias.`},{type:`truefalse`,statement:`Tener una tarjeta de crédito significa estar endeudado.`,answer:!1,explain:`Mito. Si pagas el total cada mes, solo usas el crédito por unos días y no pagas intereses. La deuda aparece cuando dejas saldo sin pagar.`}],keyPoints:[`La tarjeta de crédito es dinero prestado hasta un límite.`,`Paga el total antes de la fecha límite para no generar intereses.`,`El pago mínimo evita el atraso, pero el resto genera intereses más IVA.`,`Usar poco de tu límite y pagar a tiempo construye buen historial.`]},{id:`m4-l2`,title:`Interés, CAT y costo total`,summary:`Cómo leer la tasa, el CAT y cuánto pagas de verdad al final de un crédito.`,minutes:6,xp:60,objectives:[`Distinguir la tasa de interés del CAT`,`Calcular el costo total de un crédito a plazos`,`Comparar créditos con herramientas como las de CONDUSEF`],steps:[{type:`intro`,title:`El precio de pedir prestado`,body:[`El interés es lo que pagas por usar dinero que no es tuyo. Se expresa como una tasa, por ejemplo anual o mensual.`,`El CAT (Costo Anual Total) suma intereses y comisiones en un solo porcentaje. Sirve para comparar créditos: a menor CAT, menor costo, en igualdad de condiciones.`,`El CAT se usa para comparar y normalmente se muestra sin IVA, así que el costo real puede ser un poco mayor.`],terms:[{term:`Tasa de interés`,def:`Porcentaje que te cobran por el dinero prestado durante un periodo.`},{term:`CAT`,def:`Costo Anual Total. Junta intereses y comisiones para comparar créditos entre sí.`},{term:`Comisión`,def:`Cobro por un servicio: apertura, anualidad, pago tardío, retiro de efectivo, etc.`}],callout:{tone:`dato`,text:`En México, los intereses de una tarjeta de crédito pagan IVA de 16%. Si te cobran $200 de interés, pagas $32 más de IVA.`}},{type:`choice`,prompt:`Dejas $5,000 sin pagar en tu tarjeta. Con una tasa ilustrativa de 4% mensual, ¿cuánto pagas de interés más IVA ese mes?`,options:[`$200`,`$232`,`$400`],correct:1,explain:`$5,000 × 4% = $200 de interés. $200 × 16% = $32 de IVA. $200 + $32 = $232 en un solo mes.`},{type:`choice`,prompt:`Dos créditos tienen la misma mensualidad. Uno tiene CAT de 90% y otro de 45%. ¿Qué te dice esto?`,options:[`Cuestan exactamente lo mismo`,`El de 90% probablemente cuesta más en total`,`El CAT no importa si la mensualidad es igual`],correct:1,explain:`La misma mensualidad puede esconder plazos más largos o más comisiones. El CAT te ayuda a ver cuál cuesta más.`},{type:`intro`,title:`Mira el costo total, no solo la mensualidad`,body:[`Una mensualidad baja se siente cómoda, pero si el plazo es largo puedes terminar pagando mucho más.`,`Para saber el costo total, multiplica el pago por el número de pagos. Luego resta el precio de contado: eso es lo que te cuesta financiarlo.`,`Así puedes decidir con datos: a veces vale la pena pagar un poco más por tener algo que necesitas ahora, y a veces conviene esperar y ahorrar.`],example:{who:`Ejemplo ilustrativo: celular de $9,000`,text:`Dos formas de pagarlo (no son ofertas reales):`,rows:[{label:`De contado`,amount:9e3},{label:`18 pagos de $720 (total)`,amount:12960,tag:`Cuidado`}]}},{type:`choice`,prompt:`En el ejemplo, ¿cuánto pagas de más con 18 pagos de $720?`,options:[`$720`,`$12,960`,`$3,960`],correct:2,explain:`$720 × 18 = $12,960. $12,960 − $9,000 = $3,960 de costo por financiarlo.`},{type:`choice`,prompt:`Préstamo de $10,000 (ilustrativo). Opción A: 12 pagos de $1,050. Opción B: 24 pagos de $600. ¿Cuál cuesta menos en total?`,options:[`La A, cuesta $2,600 de intereses`,`La B, porque la mensualidad es más baja`,`Cuestan lo mismo`],correct:0,explain:`A: $1,050 × 12 = $12,600, o sea $2,600 de costo. B: $600 × 24 = $14,400, o sea $4,400. La B paga menos al mes, pero $1,800 más en total.`},{type:`truefalse`,statement:`La opción con la mensualidad más baja siempre es la más barata.`,answer:!1,explain:`Mito. Una mensualidad baja suele venir con un plazo más largo, y eso puede subir mucho el costo total.`},{type:`intro`,title:`Compara antes de firmar`,body:[`Antes de aceptar un crédito, pide por escrito: monto, plazo, pago por periodo, CAT, comisiones y qué pasa si te atrasas.`,`Compara al menos dos o tres opciones. Revisa la letra chiquita: seguros obligatorios, comisión por apertura o por pago anticipado.`,`Si algo no te queda claro, pregunta. Tienes derecho a entender lo que firmas.`],callout:{tone:`tip`,text:`La CONDUSEF publica comparativos y simuladores gratuitos de tarjetas y créditos. Úsalos antes de decidir.`}},{type:`choice`,prompt:`¿Dónde puedes consultar y comparar productos financieros en México?`,options:[`Solo en anuncios de redes sociales`,`En ningún lado`,`En la CONDUSEF`],correct:2,explain:`La CONDUSEF publica comparativos y atiende quejas de usuarios de servicios financieros.`},{type:`choice`,prompt:`Te ofrecen un préstamo y el asesor no quiere darte el CAT ni el total a pagar por escrito. ¿Qué haces?`,options:[`Firmo, seguro es normal`,`No firmo hasta tener esos datos y comparo con otras opciones`,`Pido un monto más grande`],correct:1,explain:`Sin CAT ni total a pagar no puedes comparar. Una institución seria debe darte esa información.`}],keyPoints:[`El CAT junta intereses y comisiones para comparar créditos.`,`Costo total = pago × número de pagos. Réstale el precio de contado.`,`Una mensualidad baja puede salir más cara por un plazo largo.`,`Los intereses de tarjeta pagan IVA; compara con apoyo de CONDUSEF.`]},{id:`m4-l3`,title:`Meses sin intereses`,summary:`Cómo funcionan los MSI, cuándo convienen y cómo evitar que aprieten tu presupuesto.`,minutes:6,xp:60,objectives:[`Calcular la mensualidad de una compra a meses sin intereses`,`Reconocer cómo los MSI ocupan tu límite y tu ingreso futuro`,`Evaluar si otra compra a meses cabe en tu presupuesto`],steps:[{type:`intro`,title:`Útiles, pero comprometen tu ingreso futuro`,body:[`Con meses sin intereses (MSI) divides una compra con tarjeta de crédito en pagos iguales, sin costo extra si pagas a tiempo.`,`Pueden ser útiles para algo que necesitas y que cuesta mucho de golpe, como una laptop para la uni.`,`Pero cada compra a MSI se convierte en un pago fijo durante varios meses. Es dinero de tus próximas quincenas que ya está comprometido.`],example:{who:`Ximena, 20 años, estudia diseño y tiene beca`,text:`Compra una laptop para la uni con su tarjeta (ejemplo ilustrativo):`,rows:[{label:`Laptop a 12 MSI`,amount:12e3},{label:`Límite de su tarjeta`,amount:15e3}]},terms:[{term:`MSI`,def:`Meses sin intereses. Pagas una compra en partes iguales sin costo extra si cumples a tiempo.`},{term:`Plazo`,def:`Número de meses o pagos en los que liquidas una compra o un crédito.`}]},{type:`choice`,prompt:`Ximena compra la laptop de $12,000 a 12 MSI. ¿Cuánto paga al mes?`,options:[`$1,200`,`$12,000`,`$1,000`],correct:2,explain:`$12,000 ÷ 12 = $1,000 al mes, durante un año.`},{type:`choice`,prompt:`Justo después de la compra, ¿cuánto crédito le queda disponible a Ximena?`,options:[`$3,000`,`$14,000`,`$15,000`],correct:0,explain:`Al comprar a MSI se aparta el total de tu límite: $15,000 − $12,000 = $3,000. Se va liberando conforme pagas.`},{type:`intro`,title:`Lo que la letra chiquita no grita`,body:[`Sin intereses no siempre significa más barato. Algunas tiendas tienen un precio de contado menor que el precio a meses. Pregunta los dos.`,`Los MSI se suman a tu pago para no generar intereses. Si no cubres ese pago completo, puedes generar intereses sobre el saldo y recargos. Las condiciones cambian según el banco.`,`Antes de aceptar, revisa que los pagos quepan en tu presupuesto todos los meses del plazo, no solo este.`],callout:{tone:`alerta`,text:`Si un mes no pagas lo de tus MSI, las condiciones pueden cambiar y la compra deja de salir "sin intereses". Lee tu contrato.`}},{type:`choice`,prompt:`Unos audífonos cuestan $8,000 de contado o $8,800 a 12 MSI. ¿Cuánto pagas de más por los meses?`,options:[`Nada, son sin intereses`,`$800`,`$733`],correct:1,explain:`$8,800 − $8,000 = $800. No se llama interés, pero sí es un costo extra por pagar a plazos.`},{type:`choice`,prompt:`Si no cubres el pago para no generar intereses de tu tarjeta en un mes…`,options:[`Puedes generar intereses sobre el saldo y recargos`,`No pasa nada con tus MSI`,`El banco cancela tu compra`],correct:0,explain:`Los MSI dependen de que pagues a tiempo. Las condiciones exactas cambian según el banco, así que lee el contrato.`},{type:`intro`,title:`La bola de pagos fijos`,body:[`Una compra a MSI es fácil de pagar. Tres o cuatro al mismo tiempo pueden apretar tu presupuesto sin que te des cuenta.`,`Lleva una lista de tus compras a meses: cuánto pagas, cuántos pagos te faltan y cuándo terminan.`,`Antes de otra compra, suma lo que ya pagas cada mes y compáralo con tu ingreso.`],example:{who:`Rodrigo, 23 años, primer empleo con ingreso de $7,000 al mes`,text:`Ya tiene tres compras a MSI corriendo al mismo tiempo:`,rows:[{label:`Celular`,amount:1e3,tag:`Fijo`},{label:`Bicicleta`,amount:800,tag:`Fijo`},{label:`Colchón`,amount:600,tag:`Fijo`}]}},{type:`choice`,prompt:`Rodrigo paga $2,400 al mes en MSI y gana $7,000. ¿Qué conviene antes de otra compra?`,options:[`Comprar, porque no tiene intereses`,`Pagar solo el mínimo de la tarjeta`,`Revisar si su presupuesto aguanta otro pago fijo`],correct:2,explain:`$1,000 + $800 + $600 = $2,400, más de un tercio de su ingreso ($2,400 ÷ $7,000 ≈ 34%). Sin intereses no significa sin costo para su presupuesto.`},{type:`truefalse`,statement:`Si una compra es a meses sin intereses, no cuenta como deuda.`,answer:!1,explain:`Mito. Es dinero que debes al banco y aparece en tu historial crediticio. Solo que, si pagas a tiempo, no te cobra intereses.`}],keyPoints:[`MSI: divides el precio entre los meses, sin intereses si pagas a tiempo.`,`El total de la compra se aparta de tu límite de crédito.`,`Compara el precio de contado contra el precio a meses.`,`Suma tus pagos a meses antes de agregar uno nuevo.`]},{id:`m4-l4`,title:`Historial y Buró de Crédito`,summary:`Qué es tu historial crediticio, cómo consultarlo gratis y cómo construir uno bueno.`,minutes:6,xp:60,objectives:[`Explicar qué es un historial crediticio y quién lo registra`,`Reconocer los hábitos que mejoran o dañan tu historial`,`Saber cómo pedir tu reporte de crédito gratuito`],steps:[{type:`intro`,title:`Tu historial: cómo pagas lo que debes`,body:[`Tu historial crediticio es el registro de los créditos que has tenido y de cómo los has pagado: tarjetas, préstamos, compras a plazos y algunos servicios.`,`En México lo guardan las sociedades de información crediticia: Buró de Crédito y Círculo de Crédito. Los bancos y otras instituciones les envían tus datos de pago.`,`Cuando pides un crédito, la institución consulta tu historial para decidir si te presta, cuánto y a qué tasa.`],terms:[{term:`Historial crediticio`,def:`Registro de tus créditos y de si los pagaste a tiempo o con atraso.`},{term:`Sociedad de información crediticia`,def:`Empresa autorizada que guarda historiales. En México: Buró de Crédito y Círculo de Crédito.`},{term:`Score`,def:`Número que resume tu historial e indica qué tan probable es que pagues a tiempo.`}]},{type:`truefalse`,statement:`Estar en Buró de Crédito significa que eres mal pagador.`,answer:!1,explain:`Mito. Ahí aparece casi cualquier persona que ha tenido un crédito. Lo que importa es si tu historial muestra pagos puntuales o atrasos.`},{type:`choice`,prompt:`¿Qué guarda tu historial crediticio?`,options:[`Cuánto dinero tienes ahorrado en tu cuenta`,`Los créditos que has tenido y si los pagaste a tiempo`,`Tus compras en efectivo`],correct:1,explain:`El historial registra tus créditos y tu comportamiento de pago. No muestra tus ahorros ni lo que pagas en efectivo.`},{type:`intro`,title:`Qué sube y qué baja tu score`,body:[`Lo que más pesa es pagar a tiempo. Un atraso de varios meses afecta más que uno de pocos días.`,`También cuenta cuánto usas de tu límite, cuánto tiempo llevas con créditos y si pides muchos créditos en poco tiempo.`,`No tener historial no es malo, pero puede hacer que te ofrezcan límites bajos o tasas más altas al principio, porque no saben cómo pagas.`],example:{who:`Mariana, 23 años, primer empleo formal`,text:`Sacó su primera tarjeta y la usa así cada mes:`,rows:[{label:`Límite de su tarjeta`,amount:8e3},{label:`Gasta en súper y pasajes`,amount:1500,tag:`Variable`},{label:`Paga completo antes de la fecha límite`,amount:1500,tag:`Ahorro`}]}},{type:`choice`,prompt:`Mariana quiere usar menos de 30% de su límite de $8,000. ¿Cuál es lo máximo que debería traer de saldo?`,options:[`$2,400`,`$3,000`,`$800`],correct:0,explain:`$8,000 × 30% = $2,400. Con $1,500 usa menos de 19% ($1,500 ÷ $8,000), así que va bien.`},{type:`choice`,prompt:`¿Cuál de estos hábitos daña más tu historial?`,options:[`Pagar el total de tu tarjeta cada mes`,`Usar poco de tu límite`,`Atrasarte varios meses en un pago`],correct:2,explain:`Los atrasos son lo que más afecta tu historial. Pagar a tiempo y usar poco del límite lo mejora.`},{type:`intro`,title:`Revisa tu reporte gratis`,body:[`Puedes pedir tu reporte de crédito especial directamente a Buró de Crédito y a Círculo de Crédito. Ahí ves qué créditos aparecen a tu nombre y cómo se reportan.`,`Revisarlo te ayuda a detectar errores o créditos que no pediste, lo que puede ser señal de robo de identidad. Si encuentras un error, puedes presentar una reclamación.`,`Desconfía de quien te cobre por "borrarte del buró". Nadie puede eliminar un registro verdadero antes de tiempo.`],callout:{tone:`dato`,text:`Tienes derecho a un reporte de crédito especial gratuito una vez cada 12 meses en cada sociedad de información crediticia. El score puede consultarse aparte y a veces tiene costo.`}},{type:`choice`,prompt:`¿Cada cuánto puedes pedir gratis tu reporte de crédito especial en cada sociedad?`,options:[`Una vez cada 5 años`,`Una vez cada 12 meses`,`Nunca, siempre tiene costo`],correct:1,explain:`Es gratuito una vez cada 12 meses en Buró de Crédito y otra vez en Círculo de Crédito.`},{type:`truefalse`,statement:`Consultar tu propio reporte de crédito baja tu score.`,answer:!1,explain:`Mito. Revisar tu propio reporte no te afecta. Lo que puede pesar es pedir muchos créditos nuevos en poco tiempo.`},{type:`choice`,prompt:`En tu reporte aparece un préstamo que nunca pediste. ¿Qué haces?`,options:[`Lo ignoro, seguro se borra solo`,`Pago para que desaparezca`,`Presento una reclamación y aviso a la institución que lo reporta`],correct:2,explain:`Podría ser un error o robo de identidad. La reclamación permite corregirlo, y avisar a la institución ayuda a frenar el uso de tus datos.`}],keyPoints:[`Tu historial muestra cómo pagas tus créditos; aparecer en buró no es malo.`,`Pagar a tiempo y usar poco de tu límite mejora tu historial.`,`Pide tu reporte gratuito una vez cada 12 meses en cada sociedad.`,`Nadie puede "borrarte del buró" a cambio de dinero.`]},{id:`m4-l5`,title:`Préstamos rápidos y en apps`,summary:`Cómo verificar a un prestamista, señales de abuso y qué hacer si te extorsionan.`,minutes:7,xp:70,objectives:[`Calcular el costo real de un préstamo rápido`,`Verificar si una institución está registrada en el SIPRES`,`Reconocer cobranza abusiva y saber cómo actuar ante extorsión`],steps:[{type:`intro`,title:`Rápido no es lo mismo que barato`,body:[`Hay préstamos que se piden en minutos desde una app o con pocos requisitos. Pueden sacarte de un apuro, pero suelen tener plazos muy cortos y costos altos.`,`Fíjate en cuánto pides, cuánto regresas y en cuántos días. Un costo que parece pequeño puede ser enorme si el plazo es de una o dos semanas.`,`Antes de pedir, pregúntate si hay otra opción: ajustar tu presupuesto, usar tu fondo de emergencia o hablar con quien te cobra para pedir más tiempo.`],example:{who:`Jorge, 20 años, trabaja en un almacén y le faltó para la renta`,text:`Una app le ofrece este préstamo (ejemplo ilustrativo):`,rows:[{label:`Recibe hoy`,amount:2e3},{label:`Debe pagar en 15 días`,amount:2600,tag:`Riesgo`}]}},{type:`choice`,prompt:`¿Cuánto le cuesta a Jorge el préstamo y qué porcentaje es de lo que pidió?`,options:[`$600, que es 30% en solo 15 días`,`$260, que es 13%`,`$2,600, que es 100%`],correct:0,explain:`$2,600 − $2,000 = $600. $600 ÷ $2,000 = 30% en 15 días. Si repitiera algo así cada quincena, el costo en un año sería altísimo.`},{type:`intro`,title:`Verifica antes de dar tus datos`,body:[`Las instituciones financieras que operan legalmente están registradas ante la CONDUSEF. Puedes buscarlas en el SIPRES con su nombre o razón social.`,`Una app seria te muestra contrato, CAT, monto total a pagar y datos de contacto antes de que aceptes.`,`Señales de alerta: te cobran una comisión antes de prestarte, piden acceso a tus contactos, fotos o galería, o no tienen domicilio ni razón social.`],terms:[{term:`SIPRES`,def:`Registro de la CONDUSEF donde verificas si una institución financiera está registrada.`},{term:`Razón social`,def:`Nombre legal de una empresa. Con él puedes buscarla en registros oficiales.`},{term:`Cobranza abusiva`,def:`Amenazas, insultos, mensajes a tus contactos o llamadas a horas inapropiadas para cobrar.`}],callout:{tone:`alerta`,text:`Una app de préstamos no necesita ver tus contactos ni tus fotos. Si los pide, puede usarlos después para presionarte o extorsionarte.`}},{type:`choice`,prompt:`Antes de pedir un préstamo en una app que no conoces, ¿qué haces primero?`,options:[`Reviso cuántas descargas tiene`,`Busco su razón social en el SIPRES de la CONDUSEF`,`Le doy acceso a mis contactos para que me aprueben rápido`],correct:1,explain:`El SIPRES te dice si está registrada. Las descargas o calificaciones en la tienda de apps no garantizan que sea legal.`},{type:`truefalse`,statement:`Si una app de préstamos está en la tienda de apps de tu celular, es legal.`,answer:!1,explain:`Mito. Muchas apps fraudulentas logran publicarse por un tiempo. Verifica siempre en el SIPRES de la CONDUSEF.`},{type:`choice`,prompt:`Una app te pide pagar $350 de "seguro de aprobación" antes de depositarte el préstamo. ¿Qué es?`,options:[`Una práctica normal`,`Un requisito del gobierno`,`Una señal fuerte de fraude`],correct:2,explain:`Cobrar por adelantado para "liberar" un préstamo es una táctica común de fraude. Muchas veces el préstamo nunca llega.`},{type:`intro`,title:`Préstamos informales y extorsión`,body:[`Los préstamos "gota a gota" son informales: alguien presta en efectivo sin contrato y cobra a diario con intereses altísimos. Si te atrasas, suelen usar amenazas o violencia.`,`Algunas apps ilegales, aun después de que pagas, mandan mensajes a tus contactos o fotos editadas para exigir más dinero. Eso es extorsión, no cobranza.`,`Si te pasa: no pagues a los extorsionadores, porque casi siempre piden más. Guarda capturas, no borres nada, bloquea los números y denuncia ante la Policía Cibernética o la fiscalía. Avisa a tus contactos.`],callout:{tone:`tip`,text:`Si debes a una institución registrada, paga solo por sus canales oficiales. Si te cobran con amenazas, puedes presentar una queja ante la CONDUSEF.`}},{type:`choice`,prompt:`Ya pagaste un préstamo de app, pero te mandan mensajes amenazando con publicar tus fotos si no depositas $1,500 más. ¿Qué haces?`,options:[`Guardo evidencia, no pago, bloqueo y denuncio ante la Policía Cibernética`,`Pago rápido para que me dejen en paz`,`Borro todos los mensajes y no le digo a nadie`],correct:0,explain:`Pagar a extorsionadores no detiene el acoso. La evidencia sirve para denunciar, y avisar a tus contactos les quita poder sobre ti.`},{type:`truefalse`,statement:`Si debes dinero, el que te cobra puede mandar mensajes a tu familia y contactos.`,answer:!1,explain:`Mito. Contactar a tus conocidos para presionarte o exhibirte es cobranza abusiva. Puedes quejarte ante la CONDUSEF y denunciarlo.`}],keyPoints:[`Calcula cuánto pagas de más y en cuántos días antes de aceptar.`,`Verifica la institución en el SIPRES de la CONDUSEF.`,`Nunca des acceso a tus contactos o fotos ni pagues por adelantado.`,`Ante extorsión: no pagues, guarda evidencia y denuncia.`]},{id:`m4-l6`,title:`Cómo salir de deudas`,summary:`Haz tu lista de deudas, elige un método para pagarlas y negocia con tu acreedor.`,minutes:7,xp:70,objectives:[`Organizar tus deudas en una lista con saldo, tasa y pago`,`Comparar el método bola de nieve con el método avalancha`,`Reconocer opciones para negociar y trampas que empeoran la deuda`],steps:[{type:`intro`,title:`Primero, ver todo en un solo lugar`,body:[`Tener deudas le pasa a mucha gente y no te define. El primer paso para salir es ver todas juntas, sin miedo.`,`Haz una lista con cada deuda: a quién le debes, cuánto, qué tasa de interés tiene, cuál es el pago mínimo y su fecha límite.`,`Paga siempre al menos el mínimo de todas para no generar atrasos. El dinero extra que tengas lo usarás con un método.`],example:{who:`Fernanda, 24 años, trabaja en un despacho`,text:`Hizo su lista de deudas (tasas anuales ilustrativas):`,rows:[{label:`Tarjeta de crédito (60% anual)`,amount:6e3,tag:`Riesgo`},{label:`Préstamo personal (35% anual)`,amount:3e3},{label:`Celular a plazos (45% anual)`,amount:1500}]},terms:[{term:`Acreedor`,def:`Persona o institución a la que le debes dinero.`},{term:`Saldo`,def:`Lo que todavía debes de un crédito en este momento.`}]},{type:`choice`,prompt:`¿Cuánto debe Fernanda en total?`,options:[`$9,000`,`$10,500`,`$7,500`],correct:1,explain:`$6,000 + $3,000 + $1,500 = $10,500. Ver el total ayuda a hacer un plan realista.`},{type:`intro`,title:`Bola de nieve o avalancha`,body:[`Con ambos métodos pagas el mínimo de todas las deudas y pones tu dinero extra en una sola. Cuando la terminas, pasas ese dinero a la siguiente.`,`Bola de nieve: atacas primero la deuda más pequeña. Terminas una rápido y eso te motiva a seguir.`,`Avalancha: atacas primero la de tasa más alta. Suele ahorrarte más intereses. Los dos funcionan; lo importante es elegir uno y ser constante.`],terms:[{term:`Bola de nieve`,def:`Pagar primero la deuda de menor saldo para ganar impulso con logros rápidos.`},{term:`Avalancha`,def:`Pagar primero la deuda con la tasa de interés más alta para pagar menos intereses.`}],callout:{tone:`tip`,text:`Si te cuesta mantener la motivación, la bola de nieve ayuda. Si quieres pagar lo menos posible, la avalancha suele ganar.`}},{type:`choice`,prompt:`Si Fernanda usa el método avalancha, ¿a qué deuda le pone su dinero extra primero?`,options:[`Al celular a plazos`,`Al préstamo personal`,`A la tarjeta de crédito`],correct:2,explain:`La avalancha va por la tasa más alta: la tarjeta, con 60% anual en este ejemplo.`},{type:`choice`,prompt:`Y si usa el método bola de nieve, ¿cuál paga primero?`,options:[`El celular a plazos`,`La tarjeta de crédito`,`El préstamo personal`],correct:0,explain:`La bola de nieve va por el saldo más pequeño: el celular, con $1,500. Lo termina rápido y suma ese pago a la siguiente.`},{type:`choice`,prompt:`Sin contar IVA, ¿cuánto interés genera al mes, aproximadamente, la tarjeta de $6,000 a 60% anual?`,options:[`$60`,`$300`,`$3,600`],correct:1,explain:`$6,000 × 60% = $3,600 al año. $3,600 ÷ 12 = $300 al mes. El celular genera $1,500 × 45% ÷ 12 ≈ $56 al mes. Por eso la avalancha ataca la tarjeta.`},{type:`intro`,title:`Negocia y evita las trampas`,body:[`Si no puedes con los pagos, habla con tu acreedor antes de atrasarte mucho. Puedes pedir más plazo, un pago menor o un descuento por pagar todo. Pide el acuerdo por escrito.`,`Cuidado con pedir un préstamo caro para pagar otra deuda: solo mueves el problema y puedes terminar debiendo más. Solo conviene si el nuevo crédito cuesta menos en total.`,`Desconfía de despachos que cobran por adelantado prometiendo "limpiar tu buró" o desaparecer tus deudas.`],callout:{tone:`dato`,text:`La CONDUSEF da orientación gratuita si tienes problemas con una institución financiera y puede ayudarte a presentar una queja.`}},{type:`truefalse`,statement:`Pedir un préstamo rápido para pagar la tarjeta resuelve el problema.`,answer:!1,explain:`Mito. Si el préstamo nuevo es más caro, la deuda crece. Solo conviene un crédito que cueste menos en total que la deuda que liquida.`},{type:`choice`,prompt:`Sabes que no podrás pagar tu préstamo este mes. ¿Qué es lo más útil?`,options:[`Dejar de contestar y esperar a que se olviden`,`Llamar al acreedor, explicar tu situación y pedir un acuerdo por escrito`,`Pagar con otra tarjeta sin revisar su costo`],correct:1,explain:`Negociar antes de atrasarte mucho abre opciones como más plazo o pagos menores. Tenerlo por escrito te protege.`},{type:`truefalse`,statement:`Un acuerdo de pago con descuento puede quedar anotado en tu historial crediticio.`,answer:!0,explain:`Realidad. Liquidar con descuento es mejor que no pagar, pero puede aparecer en tu historial. Pregunta cómo se reportará antes de aceptar.`}],keyPoints:[`Haz una lista con saldo, tasa, pago mínimo y fecha de cada deuda.`,`Paga el mínimo de todas y pon el extra en una: bola de nieve o avalancha.`,`Negocia con tu acreedor pronto y pide el acuerdo por escrito.`,`No tapes una deuda con otra más cara; pide orientación a CONDUSEF.`]}]},{id:`m5`,title:`Banca y seguridad`,description:`Tu cuenta bancaria, transferencias, fraudes comunes y cómo proteger tu dinero y tus datos.`,why:`Cada vez más pagos, becas y sueldos llegan por transferencia. Saber usar tu cuenta y detectar fraudes protege el dinero que tanto te cuesta ganar.`,lessons:[{id:`m5-l1`,title:`Tu primera cuenta bancaria`,summary:`Débito vs crédito, comisiones, CLABE y cómo se protege tu dinero en el banco.`,minutes:6,xp:60,objectives:[`Distinguir una cuenta de débito de una tarjeta de crédito`,`Comparar comisiones y requisitos antes de abrir una cuenta`,`Reconocer cómo se protegen tus depósitos en México`],steps:[{type:`intro`,title:`Un lugar seguro para tu dinero`,body:[`Una cuenta de débito guarda tu dinero y te permite pagar con tarjeta, transferir y recibir pagos. Gastas lo que tienes, no dinero prestado.`,`Tener cuenta te sirve para recibir tu sueldo, tu beca o pagos de clientes, y para no andar con todo en efectivo.`,`Tu cuenta tiene varios números: el de la tarjeta (16 dígitos), el número de cuenta y la CLABE (18 dígitos) para recibir transferencias.`],terms:[{term:`Cuenta de débito`,def:`Cuenta donde guardas tu dinero y lo usas con tarjeta o transferencias. No genera deuda.`},{term:`CLABE`,def:`Clave de 18 dígitos para recibir transferencias desde otros bancos. Puedes compartirla.`},{term:`NIP`,def:`Número secreto de tu tarjeta para el cajero o pagos. Nunca lo compartas.`}]},{type:`choice`,prompt:`¿Qué diferencia una tarjeta de débito de una de crédito?`,options:[`Son iguales`,`Con débito usas tu propio dinero; con crédito usas dinero prestado`,`La de débito siempre cobra intereses`],correct:1,explain:`Con débito pagas con el saldo de tu cuenta, así que no generas deuda.`},{type:`choice`,prompt:`Una CLABE interbancaria sirve para…`,options:[`Sacar dinero del cajero`,`Entrar a tu banca en línea`,`Recibir transferencias`],correct:2,explain:`La CLABE tiene 18 dígitos y puedes compartirla para que te transfieran. No es una contraseña.`},{type:`intro`,title:`Comisiones: lo que cuesta tener la cuenta`,body:[`Algunas cuentas cobran si no mantienes un saldo mínimo, por usar cajeros de otro banco o por reponer la tarjeta.`,`Hay cuentas básicas o sencillas con pocos requisitos y sin comisiones por manejo, a cambio de límites en lo que puedes depositar al mes.`,`Para abrir una cuenta normalmente te piden identificación oficial y, en algunos casos, comprobante de domicilio. Si eres menor de edad, suele requerirse a tu mamá, papá o tutor.`],example:{who:`Valeria, 18 años, prepa y beca mensual`,text:`Compara lo que le costaría al mes una cuenta con comisiones (montos ilustrativos):`,rows:[{label:`Comisión por no tener saldo mínimo`,amount:60,tag:`Cuidado`},{label:`4 retiros en cajeros de otro banco ($30 c/u)`,amount:120,tag:`Cuidado`}]}},{type:`choice`,prompt:`Si Valeria paga esas comisiones todos los meses, ¿cuánto pierde en un año?`,options:[`$2,160`,`$180`,`$1,440`],correct:0,explain:`$60 + $120 = $180 al mes. $180 × 12 = $2,160 al año. Una cuenta sin comisiones o usar cajeros de su banco le ahorraría ese dinero.`},{type:`choice`,prompt:`¿Qué revisar antes de abrir una cuenta?`,options:[`El color de la tarjeta`,`Cuántos seguidores tiene el banco`,`Comisiones, saldo mínimo y requisitos`],correct:2,explain:`Una comisión por no mantener saldo mínimo puede costarte cada mes. Compara antes de elegir.`},{type:`intro`,title:`Cómo se protege tu dinero`,body:[`En los bancos, el IPAB protege tus depósitos si el banco quiebra. No tienes que contratar nada: es automático.`,`No todas las instituciones están cubiertas por el IPAB. Las SOFIPO autorizadas tienen su propio fondo de protección, con un tope menor.`,`Antes de depositar en una institución que no conoces, verifica que esté autorizada en el SIPRES de la CONDUSEF.`],callout:{tone:`dato`,text:`El IPAB protege hasta 400,000 UDIS por persona por banco. En SOFIPO autorizadas, el fondo de protección cubre hasta 25,000 UDIS.`}},{type:`truefalse`,statement:`Todas las instituciones que ofrecen cuentas están protegidas por el IPAB.`,answer:!1,explain:`Mito. El IPAB protege depósitos en bancos. Las SOFIPO autorizadas tienen otro fondo, y algunas empresas no tienen ninguna protección.`},{type:`choice`,prompt:`¿Cuál de estos datos SÍ puedes compartir para que te paguen?`,options:[`Tu NIP`,`Tu CLABE`,`El código que te llega por SMS`],correct:1,explain:`Con la CLABE solo pueden depositarte. El NIP y los códigos por SMS sirven para sacar o mover tu dinero.`}],keyPoints:[`Con débito gastas tu propio dinero; no generas deuda.`,`Compara comisiones y saldo mínimo antes de abrir una cuenta.`,`Comparte tu CLABE para recibir dinero; nunca tu NIP ni tus códigos.`,`El IPAB protege depósitos en bancos hasta 400,000 UDIS por persona.`]},{id:`m5-l2`,title:`Phishing y fraudes`,summary:`Mensajes, correos y llamadas falsas: cómo reconocerlos y qué hacer si caíste.`,minutes:6,xp:60,objectives:[`Reconocer las señales de un mensaje o llamada de phishing`,`Identificar los datos que tu banco nunca te pedirá`,`Actuar rápido si compartiste datos con un estafador`],steps:[{type:`intro`,title:`Si te presionan, desconfía`,body:[`El phishing son mensajes, correos o llamadas que fingen ser tu banco, una tienda o una paquetería para robar tus datos.`,`Puede llegar por SMS, correo, chat o llamada. Suelen copiar logos, colores y nombres reales para parecer oficiales.`,`Su arma principal es la prisa: "tu cuenta será bloqueada", "detectamos un cargo" o "ganaste un premio".`],terms:[{term:`Phishing`,def:`Engaño para que entregues datos personales o bancarios haciéndose pasar por alguien confiable.`},{term:`Liga acortada`,def:`Dirección web recortada que esconde a qué página te lleva en realidad.`},{term:`Suplantación`,def:`Cuando alguien se hace pasar por otra persona o institución.`}]},{type:`choice`,prompt:`Te llega un SMS: "Tu cuenta será bloqueada. Confirma tus datos aquí: [liga acortada]". ¿Qué haces?`,options:[`Entro a la liga para resolverlo rápido`,`Respondo con mi NIP`,`No abro la liga y llamo al número oficial de mi banco`],correct:2,explain:`Contacta al banco por sus canales oficiales: el número detrás de tu tarjeta o la app.`},{type:`truefalse`,statement:`Si un correo tiene el logo y los colores de tu banco, es oficial.`,answer:!1,explain:`Mito. Copiar un logo es muy fácil. Revisa el remitente, no abras ligas y entra a tu banco solo desde su app o escribiendo tú la dirección.`},{type:`intro`,title:`Lo que tu banco nunca te pedirá`,body:[`Tu banco nunca te pedirá por teléfono, SMS, correo o chat tu NIP, tu contraseña, el código de seguridad (CVV) ni el código que te llega por mensaje.`,`Tampoco te pedirá que transfieras tu dinero a una "cuenta segura" para protegerlo. Ese es un fraude muy común.`,`Si alguien te llama "del área de fraudes", cuelga y llama tú al número oficial que aparece detrás de tu tarjeta.`],example:{who:`Emiliano, 19 años, uni y trabajo en cafetería`,text:`Recibe una llamada: "Detectamos un cargo de $4,800. Para cancelarlo, díganos el código que le acaba de llegar". Si lo da, podrían vaciar su cuenta:`,rows:[{label:`Saldo de Emiliano (quincena + ahorro)`,amount:6200,tag:`Riesgo`},{label:`Cargo falso que mencionan`,amount:4800,tag:`Cuidado`}]},callout:{tone:`alerta`,text:`El código que te llega por SMS sirve para autorizar operaciones. Quien te lo pida, aunque diga ser del banco, quiere usarlo para sacar tu dinero.`}},{type:`choice`,prompt:`Alguien que dice ser del banco te pide el código que te llegó por SMS. Es…`,options:[`Normal`,`Necesario para cancelar un cargo`,`Una señal de fraude`],correct:2,explain:`Ese código autoriza operaciones. Nadie del banco debe pedírtelo.`},{type:`choice`,prompt:`Te llaman "del banco" y te piden pasar tu saldo a una "cuenta segura" porque hackearon la tuya. ¿Qué haces?`,options:[`Cuelgo y llamo al número oficial de mi banco`,`Transfiero rápido para proteger mi dinero`,`Transfiero solo la mitad`],correct:0,explain:`Ningún banco te pide mover tu dinero a otra cuenta para protegerlo. Llamar tú al número oficial confirma si hay un problema real.`},{type:`intro`,title:`Si ya caíste, actúa rápido`,body:[`Le puede pasar a cualquiera; los estafadores son muy convincentes. Lo importante es actuar pronto.`,`Llama de inmediato a tu banco para bloquear tarjetas y reportar los movimientos. Cambia tus contraseñas, empezando por tu correo y tu banca en línea.`,`Guarda evidencia: capturas, números y fechas. Si el banco no te resuelve, puedes acudir a la CONDUSEF.`],callout:{tone:`tip`,text:`Guarda en tus contactos el número oficial de tu banco desde ahora. En una emergencia no tendrás que buscarlo.`}},{type:`choice`,prompt:`Una oferta de trabajo pide que pagues $500 de "inscripción" para empezar. ¿Qué indica?`,options:[`Que es un empleo serio`,`Un trámite oficial`,`Una posible estafa`],correct:2,explain:`Los empleos legítimos no te cobran por contratarte. Investiga la empresa antes de pagar.`},{type:`truefalse`,statement:`Si caes en un fraude, ya no vale la pena reportarlo.`,answer:!1,explain:`Mito. Reportar pronto puede bloquear más cargos y es el primer paso para una aclaración. También ayuda a que otros no caigan.`}],keyPoints:[`Desconfía de mensajes con prisa, premios o ligas acortadas.`,`Tu banco nunca te pide NIP, contraseña, CVV ni códigos por SMS.`,`Ante la duda, cuelga y llama tú al número oficial de tu banco.`,`Si caíste, bloquea, cambia contraseñas y reporta de inmediato.`]},{id:`m5-l3`,title:`Protege tus datos`,summary:`Contraseñas, verificación en dos pasos, notificaciones y cuidado de tu identidad.`,minutes:6,xp:60,objectives:[`Crear contraseñas seguras y activar la verificación en dos pasos`,`Configurar alertas y límites para detectar cargos a tiempo`,`Reconocer qué datos personales cuidar para evitar robo de identidad`],steps:[{type:`intro`,title:`Contraseñas que sí te protegen`,body:[`Usa una contraseña distinta para cada servicio importante. Si roban una, no podrán entrar a todo lo demás.`,`Una frase larga es más segura y fácil de recordar que una palabra corta con símbolos. Un gestor de contraseñas te ayuda a guardarlas.`,`Activa la verificación en dos pasos en tu correo, tu banco y tus redes. Así, aunque alguien sepa tu contraseña, necesita también tu celular.`],terms:[{term:`Verificación en dos pasos`,def:`Además de tu contraseña, pides un código o confirmación en tu celular para entrar.`},{term:`Gestor de contraseñas`,def:`Programa que guarda tus contraseñas cifradas y las llena por ti.`}]},{type:`choice`,prompt:`¿Cuál es la contraseña más segura?`,options:[`123456`,`Tu fecha de nacimiento`,`Una frase larga y única para cada sitio`],correct:2,explain:`Las frases largas son difíciles de adivinar. Un gestor de contraseñas ayuda a recordarlas.`},{type:`truefalse`,statement:`Usar la misma contraseña en todo es seguro si es una contraseña difícil.`,answer:!1,explain:`Mito. Si una página sufre un robo de datos, esa misma contraseña sirve para entrar a tus otras cuentas.`},{type:`intro`,title:`Alertas y límites: tu sistema de vigilancia`,body:[`Activa notificaciones de movimientos en la app de tu banco. Te avisan al instante de cualquier cargo o transferencia.`,`Muchas apps bancarias te dejan poner límites de gasto, apagar la tarjeta cuando no la usas o desactivar compras en línea.`,`Evita entrar a tu banco desde redes Wi-Fi públicas o computadoras compartidas. Si lo necesitas, usa tus datos móviles.`],example:{who:`Iván, 19 años, uni y repartidor en bici`,text:`Configuró estos límites diarios en su app (ejemplo ilustrativo):`,rows:[{label:`Límite para compras en línea`,amount:1e3,tag:`Ahorro`},{label:`Límite para retiros en cajero`,amount:2e3,tag:`Ahorro`}]},callout:{tone:`tip`,text:`Si roban los datos de la tarjeta de Iván, en un día no podrían gastar en línea más de $1,000 y él recibiría una alerta en cuanto lo intenten.`}},{type:`choice`,prompt:`Ves un cargo que no reconoces. ¿Qué haces primero?`,options:[`Esperar al próximo mes`,`Publicarlo en redes`,`Reportarlo de inmediato a tu banco`],correct:2,explain:`Reportar pronto aumenta las posibilidades de bloquear la tarjeta y aclarar el cargo.`},{type:`choice`,prompt:`Las notificaciones de movimientos sirven para…`,options:[`Ganar puntos`,`Detectar cargos no autorizados rápido`,`Nada útil`],correct:1,explain:`Te avisan en cuanto ocurre algo y puedes actuar a tiempo.`},{type:`intro`,title:`Cuida tu identidad`,body:[`Con tu nombre, CURP, foto de tu INE y comprobante de domicilio, alguien podría intentar pedir créditos a tu nombre. Eso es robo de identidad.`,`No compartas fotos de tu INE en redes ni con desconocidos. Si te la piden para un trámite, verifica que sea una empresa real.`,`Revisa tu reporte de crédito de vez en cuando. Si aparece un crédito que no pediste, repórtalo de inmediato.`],callout:{tone:`dato`,text:`Puedes pedir tu reporte de crédito especial gratis una vez cada 12 meses en Buró de Crédito y en Círculo de Crédito.`}},{type:`choice`,prompt:`Un perfil que vende boletos para un concierto te pide foto de tu INE "para apartar". ¿Qué haces?`,options:[`No la envío; mi INE puede usarse para robar mi identidad`,`La mando, es normal`,`La mando, pero sin la parte de atrás`],correct:0,explain:`Con tu identificación pueden abrir cuentas o pedir créditos a tu nombre. Un vendedor de boletos no la necesita.`},{type:`choice`,prompt:`¿Cuál de estos hábitos te ayuda a detectar si alguien pidió un crédito a tu nombre?`,options:[`Cambiar de celular cada año`,`Revisar tu reporte de crédito`,`Borrar tus redes sociales`],correct:1,explain:`Tu reporte de crédito muestra los créditos que las instituciones reportan a tu nombre. Si ves uno que no reconoces, puedes reclamarlo.`}],keyPoints:[`Usa contraseñas largas, distintas y con verificación en dos pasos.`,`Activa alertas de movimientos y pon límites en tu app.`,`No compartas tu INE ni datos personales con desconocidos.`,`Revisa tu reporte de crédito para detectar robo de identidad.`]},{id:`m5-l4`,title:`Transferencias y pagos digitales`,summary:`SPEI, CLABE, concepto, comprobante CEP y cómo evitar errores al transferir.`,minutes:6,xp:60,objectives:[`Explicar cómo funciona una transferencia por SPEI`,`Verificar un pago con el comprobante CEP de Banxico`,`Evitar errores comunes al enviar dinero`],steps:[{type:`intro`,title:`Mover dinero en segundos`,body:[`El SPEI es el sistema del Banco de México que permite mandar dinero de un banco a otro. Funciona todos los días, a cualquier hora, y el dinero suele llegar en segundos o pocos minutos.`,`Para recibir, compartes tu CLABE (18 dígitos). Muchos bancos también aceptan transferencias al número de tarjeta de débito.`,`Algunas apps te dejan vincular tu número de celular a tu cuenta, para que te transfieran sin pedirte la CLABE. Revisa en tu app si tu banco lo ofrece.`],terms:[{term:`SPEI`,def:`Sistema de Pagos Electrónicos Interbancarios de Banxico. Mueve dinero entre bancos 24/7.`},{term:`Concepto de pago`,def:`Texto corto que acompaña la transferencia y explica para qué es.`},{term:`CEP`,def:`Comprobante Electrónico de Pago. Lo consultas en el sitio de Banxico para confirmar un SPEI.`}],callout:{tone:`dato`,text:`El SPEI funciona 24/7, incluidos fines de semana y días festivos.`}},{type:`choice`,prompt:`¿Cuántos dígitos tiene una CLABE interbancaria?`,options:[`16`,`10`,`18`],correct:2,explain:`La CLABE tiene 18 dígitos. El número de tarjeta tiene 16, así que no los confundas al capturar.`},{type:`truefalse`,statement:`Las transferencias SPEI solo funcionan en horario bancario de lunes a viernes.`,answer:!1,explain:`Mito. El SPEI opera las 24 horas, todos los días del año.`},{type:`intro`,title:`Transfiere con orden`,body:[`Escribe un concepto claro: "Renta octubre" o "Cooperación viaje". Te ayuda a ti y a quien recibe a saber de qué fue cada pago.`,`Guarda el comprobante. Con los datos de la operación puedes descargar el CEP en el sitio de Banxico, que confirma que el dinero llegó al otro banco.`,`Si vendes algo, no entregues el producto solo por una captura de pantalla. Revisa que el dinero ya esté en tu cuenta o consulta el CEP.`],example:{who:`Camila, 20 años, comparte depa con dos amigas`,text:`La renta del depa es de $7,500 al mes. Cada quien le transfiere su parte a la persona que paga al dueño:`,rows:[{label:`Renta total del depa`,amount:7500,tag:`Fijo`},{label:`Transferencia de Camila`,amount:2500,tag:`Fijo`}]}},{type:`choice`,prompt:`Si son tres personas y la renta es de $7,500, ¿por qué monto debe ser cada transferencia?`,options:[`$2,250`,`$2,500`,`$3,750`],correct:1,explain:`$7,500 ÷ 3 = $2,500 por persona. Con el concepto "Renta octubre" queda claro para todas.`},{type:`choice`,prompt:`Vendes unos tenis y el comprador te manda una captura de la transferencia. ¿Qué haces antes de entregarlos?`,options:[`Los entrego, la captura es prueba suficiente`,`Confirmo en mi app que el dinero llegó o consulto el CEP`,`Le pido que me mande otra captura`],correct:1,explain:`Las capturas se pueden falsificar. Solo tu cuenta o el CEP de Banxico confirman que el pago es real.`},{type:`intro`,title:`Errores que cuestan`,body:[`Una transferencia enviada no se puede cancelar desde tu app. Si te equivocas de cuenta, el dinero llega a otra persona.`,`Antes de enviar, revisa el nombre del beneficiario que muestra tu app, el monto y la CLABE. Guarda en tus contactos las cuentas que usas seguido.`,`Si te equivocaste, llama de inmediato a tu banco. Pueden pedir la devolución al otro banco, pero depende de que el dinero siga ahí y de la persona que lo recibió.`],callout:{tone:`alerta`,text:`Si alguien te "transfiere por error" y te pide que se lo regreses a otra cuenta, no lo hagas. Repórtalo a tu banco: puede ser un fraude.`}},{type:`choice`,prompt:`Antes de confirmar una transferencia de $2,500, ¿qué es lo MÁS importante revisar?`,options:[`Que el nombre del beneficiario, la CLABE y el monto sean correctos`,`Que el concepto tenga emojis`,`Que sea de día`],correct:0,explain:`Una vez enviada no se puede cancelar desde la app. Revisar el nombre del beneficiario es tu última oportunidad de detectar un error.`},{type:`truefalse`,statement:`Si transfieres a la cuenta equivocada, siempre puedes cancelar la operación desde tu app.`,answer:!1,explain:`Mito. Las transferencias no se cancelan desde tu app. Tu banco puede pedir la devolución, pero no está garantizada.`}],keyPoints:[`SPEI funciona 24/7; para recibir compartes tu CLABE de 18 dígitos.`,`Escribe un concepto claro y guarda el comprobante o el CEP.`,`No entregues un producto solo por una captura: confirma el pago.`,`Revisa nombre, CLABE y monto antes de enviar; no se puede deshacer.`]},{id:`m5-l5`,title:`Fraudes en redes sociales`,summary:`Ventas falsas, empleos falsos, pirámides, inversiones milagro y cuentas hackeadas.`,minutes:7,xp:70,objectives:[`Reconocer ventas y empleos falsos en redes sociales`,`Identificar promesas de inversión imposibles y esquemas piramidales`,`Saber qué hacer y dónde reportar si te defraudan`],steps:[{type:`intro`,title:`Ventas y empleos que no existen`,body:[`En redes y grupos de compraventa abundan ofertas demasiado buenas: celulares, boletos o ropa muy por debajo de su precio, con pago por adelantado.`,`También hay empleos falsos: "gana $2,000 diarios desde tu celular" o trabajos que te piden pagar un curso, un kit o una inscripción.`,`Señales de alerta: perfil nuevo o sin historial, presión para pagar ya, anticipo por transferencia y negativa a verse en un lugar público.`],example:{who:`Ana, 19 años, quiere cambiar de celular`,text:`Encuentra en un grupo de compraventa un anuncio que le piden apartar con anticipo:`,rows:[{label:`Precio normal del modelo`,amount:9e3},{label:`Precio del anuncio`,amount:3500,tag:`Riesgo`},{label:`Anticipo que le piden por transferencia`,amount:1e3,tag:`Cuidado`}]}},{type:`choice`,prompt:`¿Qué tan por debajo del precio normal está el celular del anuncio?`,options:[`Unos 20% menos`,`Unos 40% menos`,`Más de 60% menos`],correct:2,explain:`$9,000 − $3,500 = $5,500 de diferencia. $5,500 ÷ $9,000 ≈ 61%. Un descuento así, con anticipo, es una señal fuerte de fraude.`},{type:`choice`,prompt:`¿Cuál es la forma más segura de comprarle a un particular por redes?`,options:[`Mandar anticipo para que me lo aparte`,`Verse en un lugar público, revisar el producto y pagar al recibirlo`,`Pagar todo por adelantado si tiene buenas fotos`],correct:1,explain:`Ver el producto antes de pagar reduce mucho el riesgo. Quien solo acepta anticipos te deja sin forma de recuperar tu dinero.`},{type:`intro`,title:`Inversiones milagro y pirámides`,body:[`Nadie puede garantizar rendimientos altos. Si te prometen "duplicar tu dinero" o "10% mensual seguro", desconfía.`,`En un esquema piramidal no hay un negocio real: se paga a los primeros con el dinero de los que entran después. Cuando dejan de entrar personas, la mayoría pierde.`,`Antes de invertir, verifica que la institución esté autorizada en el SIPRES de la CONDUSEF o con la CNBV. Si te piden reclutar a amigos para ganar, es mala señal.`],terms:[{term:`Esquema piramidal`,def:`Fraude donde ganas por meter a más personas, no por vender algo real. Al final, casi todos pierden.`},{term:`Rendimiento garantizado`,def:`Promesa de ganancia segura. En inversiones con ganancias altas, nadie puede garantizarla.`}],callout:{tone:`alerta`,text:`Las "tandas" o "flores" en redes que prometen multiplicar tu aportación funcionan como pirámide: solo ganan los primeros.`}},{type:`choice`,prompt:`Te ofrecen "10% mensual garantizado" sobre $5,000. ¿Cuánto dicen que ganarías en un año, sin contar interés compuesto?`,options:[`$500`,`$6,000`,`$1,000`],correct:1,explain:`$5,000 × 10% = $500 al mes. $500 × 12 = $6,000 al año: más de lo que invertiste. Una promesa así, garantizada, es una señal clásica de fraude.`},{type:`truefalse`,statement:`Si un amigo ya cobró ganancias de una inversión en redes, significa que es segura.`,answer:!1,explain:`Mito. En las pirámides los primeros sí cobran, con el dinero de los nuevos. Eso las hace creíbles hasta que se caen.`},{type:`intro`,title:`Cuentas hackeadas y qué hacer`,body:[`A veces roban la cuenta de un amigo o familiar y desde ahí piden dinero: "Estoy en un apuro, ¿me prestas $1,500? Te lo regreso mañana".`,`Antes de transferir, llama a esa persona por teléfono o pregúntale algo que solo ella sabría. Si no contesta, no deposites.`,`Si te defraudaron: avisa de inmediato a tu banco, guarda capturas y datos del perfil, repórtalo en la red social y denúncialo ante la Policía Cibernética. Si el banco no te resuelve, acude a la CONDUSEF.`],callout:{tone:`tip`,text:`Si te hackean a ti, recupera la cuenta, activa la verificación en dos pasos y avisa a tus contactos que no hagan caso a mensajes pidiendo dinero.`}},{type:`choice`,prompt:`Tu primo te escribe por chat desde un número nuevo: "Cambié de número, transfiéreme $2,000 urgente". ¿Qué haces?`,options:[`Transfiero, es mi primo`,`Transfiero la mitad por si acaso`,`Le llamo a su número de siempre para confirmar antes de mandar nada`],correct:2,explain:`El cambio de número con urgencia es una táctica común de suplantación. Confirmar por otra vía toma un minuto y puede salvar tu dinero.`},{type:`choice`,prompt:`Pagaste un anticipo por una venta falsa en redes. ¿Qué haces primero?`,options:[`Aviso a mi banco y guardo capturas del perfil y la conversación`,`Borro la conversación para olvidarlo`,`Le mando más dinero para que me entregue`],correct:0,explain:`Avisar pronto al banco da más oportunidad de actuar, y la evidencia sirve para reportar ante la Policía Cibernética y la CONDUSEF.`},{type:`truefalse`,statement:`Reportar un perfil fraudulento en la red social y a la Policía Cibernética ayuda aunque no recuperes tu dinero.`,answer:!0,explain:`Realidad. Tu reporte puede ayudar a cerrar la cuenta y a que otras personas no caigan en el mismo fraude.`}],keyPoints:[`Precios demasiado bajos con anticipo son señal de fraude.`,`Nadie puede garantizar rendimientos altos; verifica en el SIPRES.`,`Confirma por llamada antes de mandar dinero a un amigo que te lo pide por chat.`,`Reporta a tu banco, a la Policía Cibernética y, si hace falta, a CONDUSEF.`]}]},{id:`m9`,title:`Seguros y protección`,description:`Cómo funcionan los seguros, qué cubre tu seguridad social y cómo leer una póliza sin perderte.`,why:`Un accidente, una enfermedad o un choque pueden costar más que años de ahorro. Saber protegerte evita que un imprevisto te endeude.`,lessons:[{id:`m9-l1`,title:`¿Qué es un seguro?`,summary:`Transferir riesgo, prima, suma asegurada, deducible, coaseguro y cuándo vale la pena.`,minutes:7,xp:70,objectives:[`Explicar cómo un seguro transfiere el riesgo`,`Distinguir prima, suma asegurada, deducible y coaseguro`,`Calcular cuánto pagas tú cuando usas un seguro`],steps:[{type:`intro`,title:`Pagar poco para no perder mucho`,body:[`Un seguro es un contrato: pagas una cantidad periódica y, si ocurre algo cubierto, la aseguradora paga parte o todo el costo.`,`Funciona porque muchas personas pagan un poco y solo algunas tienen un siniestro. Así se reparte el riesgo.`,`A esto se le llama transferir el riesgo: en lugar de cargar tú con una pérdida grande, la pasas a la aseguradora a cambio de un pago.`],terms:[{term:`Prima`,def:`Lo que pagas por el seguro, ya sea mensual, semestral o anual.`},{term:`Siniestro`,def:`El evento cubierto que ocurre: un choque, un robo, una enfermedad.`},{term:`Suma asegurada`,def:`Lo máximo que la aseguradora pagará por un siniestro o en el periodo.`}]},{type:`choice`,prompt:`¿Qué es la prima de un seguro?`,options:[`Lo que te paga la aseguradora si pasa algo`,`Lo que pagas por tener el seguro`,`El regalo que te dan al contratarlo`],correct:1,explain:`La prima es el costo del seguro. Lo pagas aunque no ocurra ningún siniestro.`},{type:`truefalse`,statement:`Si pagaste un seguro y no lo usaste, tiraste tu dinero.`,answer:!1,explain:`Pagaste por protección: durante ese tiempo, una pérdida grande no habría caído completa sobre ti. Es como un cinturón de seguridad que no usaste para un choque.`},{type:`intro`,title:`Deducible y coaseguro: lo que pagas tú`,body:[`Aunque tengas seguro, normalmente pagas una parte cuando lo usas.`,`El deducible es una cantidad fija que pagas primero. El coaseguro es un porcentaje de lo que queda después del deducible.`,`Muchas pólizas ponen un tope al coaseguro para que tu parte no crezca sin límite. Revisa si la tuya lo tiene.`],example:{who:`Mariana, 26 años, primer empleo con seguro de gastos médicos`,text:`La operan del apéndice. Su póliza tiene deducible de $15,000 y coaseguro de 10% (ejemplo).`,rows:[{label:`Cuenta del hospital`,amount:1e5},{label:`Deducible (lo paga Mariana)`,amount:15e3,tag:`Cuidado`},{label:`Coaseguro 10% de $85,000 (Mariana)`,amount:8500,tag:`Cuidado`},{label:`Lo que paga la aseguradora`,amount:76500,tag:`Ahorro`}]},terms:[{term:`Deducible`,def:`Monto fijo que pagas tú antes de que la aseguradora empiece a pagar.`},{term:`Coaseguro`,def:`Porcentaje del gasto que te toca pagar después del deducible.`}]},{type:`choice`,prompt:`En el ejemplo de Mariana, ¿cuánto pagó ella en total?`,options:[`$15,000`,`$23,500`,`$8,500`],correct:1,explain:`Deducible $15,000 + coaseguro $8,500 = $23,500. Sin seguro habría pagado los $100,000.`},{type:`choice`,prompt:`Tu seguro de celular tiene deducible de $1,200. Te lo roban y reponerlo cuesta $6,000. ¿Cuánto paga la aseguradora (sin coaseguro)?`,options:[`$6,000`,`$1,200`,`$4,800`],correct:2,explain:`$6,000 − $1,200 = $4,800. Tú pagas el deducible y la aseguradora el resto.`},{type:`intro`,title:`¿Cuándo vale la pena?`,body:[`Un seguro tiene más sentido cuando la pérdida posible es grande y no podrías pagarla con tus ahorros: un hospital, un accidente de auto, un daño a otra persona.`,`Para pérdidas pequeñas que podrías cubrir con tu fondo de emergencia, a veces conviene más ahorrar que pagar primas.`,`Compara siempre: prima, deducible, coaseguro, suma asegurada y exclusiones. El seguro más barato no siempre es el que más te protege.`],callout:{tone:`tip`,text:`Pregúntate: "¿Si esto pasa mañana, podría pagarlo sin endeudarme?". Si la respuesta es no, vale la pena considerar un seguro.`}},{type:`choice`,prompt:`¿En cuál situación suele tener más sentido un seguro?`,options:[`Que se te pierda un paraguas de $150`,`Una hospitalización que podría costar cientos de miles de pesos`,`Que se raye tu mochila`],correct:1,explain:`Los seguros son más útiles para pérdidas grandes que no podrías cubrir solo con tus ahorros.`},{type:`truefalse`,statement:`Un deducible más alto suele hacer que la prima sea más baja.`,answer:!0,explain:`Si tú aceptas pagar más cuando ocurre algo, la aseguradora asume menos y normalmente te cobra menos prima. Elige un deducible que sí podrías pagar.`},{type:`choice`,prompt:`Dos seguros cuestan casi lo mismo. ¿Qué conviene comparar además del precio?`,options:[`Solo el color de la póliza`,`Cuál anuncio viste primero`,`Deducible, coaseguro, suma asegurada y exclusiones`],correct:2,explain:`Dos primas parecidas pueden proteger muy distinto. Lo que pagas tú y lo que no cubren hace la diferencia.`}],keyPoints:[`Un seguro transfiere a la aseguradora el riesgo de una pérdida grande a cambio de una prima.`,`Al usarlo, normalmente pagas deducible y, a veces, coaseguro.`,`Vale más la pena para pérdidas que no podrías pagar con tus ahorros.`,`Compara coberturas completas, no solo el precio.`]},{id:`m9-l2`,title:`Salud: IMSS, seguro facultativo y privados`,summary:`Qué cubre la seguridad social, el seguro para estudiantes y los gastos médicos mayores.`,minutes:7,xp:70,objectives:[`Reconocer qué cubre el IMSS si trabajas formalmente`,`Identificar si puedes tener el seguro facultativo como estudiante`,`Comparar coberturas de un seguro de gastos médicos mayores`],steps:[{type:`intro`,title:`Si trabajas formalmente: IMSS`,body:[`Cuando trabajas con contrato formal en una empresa privada, tu patrón debe inscribirte en el IMSS. Esto te da seguridad social.`,`Incluye atención médica, medicinas, hospitalización, incapacidades por enfermedad o accidente, maternidad y una cuenta para el retiro, entre otras prestaciones.`,`El costo se reparte entre tu patrón, tú (con un descuento en tu nómina) y el gobierno.`],callout:{tone:`tip`,text:`Revisa en tu recibo de nómina que aparezca tu Número de Seguridad Social (NSS) y la retención del IMSS. Si no, pregunta en recursos humanos.`},terms:[{term:`Seguridad social`,def:`Protección que da el Estado a trabajadores formales: salud, incapacidades, retiro y más.`},{term:`NSS`,def:`Número de Seguridad Social. Te identifica en el IMSS toda tu vida.`},{term:`Incapacidad`,def:`Permiso médico por enfermedad o accidente durante el cual puedes recibir un pago.`}]},{type:`choice`,prompt:`Entras a trabajar formalmente en una empresa privada. ¿Quién debe inscribirte al IMSS?`,options:[`Tú, cuando te enfermes`,`Tu patrón`,`Nadie, es opcional`],correct:1,explain:`Es obligación del patrón inscribir a sus trabajadores formales en el IMSS.`},{type:`truefalse`,statement:`Si trabajo formalmente, el IMSS solo me sirve para ir al médico.`,answer:!1,explain:`Además de atención médica, incluye incapacidades, maternidad, riesgos de trabajo y tu cuenta para el retiro, entre otras prestaciones.`},{type:`intro`,title:`Si estudias: seguro facultativo`,body:[`Si estudias en una escuela pública de nivel medio superior (prepa, bachillerato) o superior (uni), puedes tener el seguro facultativo del IMSS.`,`Te da acceso a servicios médicos del IMSS: consultas, medicinas, estudios y hospitalización, sin pagar cuota.`,`Normalmente se activa con tu escuela y tu NSS. Muchos estudiantes lo tienen y no lo saben, o no tienen asignada su clínica.`],example:{who:`Luis, 19 años, estudiante de uni pública`,text:`Se torció el tobillo jugando futbol. Comparó cuánto le costaría con y sin su seguro facultativo (cifras ilustrativas):`,rows:[{label:`Consulta y radiografía particular`,amount:1800,tag:`Cuidado`},{label:`Férula y medicinas particulares`,amount:1200,tag:`Cuidado`},{label:`Costo con seguro facultativo`,amount:0,tag:`Ahorro`}]},callout:{tone:`dato`,text:`Los estudiantes de escuelas públicas de nivel medio superior y superior pueden tener el seguro facultativo del IMSS sin costo.`}},{type:`choice`,prompt:`¿Quién puede tener el seguro facultativo del IMSS?`,options:[`Cualquier persona que lo pague`,`Estudiantes de escuelas públicas de nivel medio superior y superior`,`Solo personas mayores de 60 años`],correct:1,explain:`El seguro facultativo está pensado para estudiantes de escuelas públicas de prepa/bachillerato y uni.`},{type:`choice`,prompt:`En el ejemplo de Luis, ¿cuánto se ahorró por usar su seguro facultativo?`,options:[`$1,800`,`$1,200`,`$3,000`],correct:2,explain:`$1,800 + $1,200 = $3,000 que habría pagado en servicios particulares.`},{type:`intro`,title:`Gastos médicos mayores`,body:[`Un seguro privado de gastos médicos mayores cubre enfermedades o accidentes costosos: cirugías, hospitalizaciones, tratamientos largos.`,`No suele cubrir consultas sencillas o chequeos. Está hecho para lo grande y caro.`,`Algunas empresas lo dan como prestación. Si lo contratas por tu cuenta, compara suma asegurada, deducible, coaseguro, red de hospitales y exclusiones.`],callout:{tone:`alerta`,text:`Un seguro privado no sustituye tu seguridad social: complementa. Si trabajas formalmente, tu IMSS sigue siendo tu derecho.`}},{type:`choice`,prompt:`¿Para qué está pensado principalmente un seguro de gastos médicos mayores?`,options:[`Para consultas por gripa`,`Para comprar vitaminas`,`Para cirugías y hospitalizaciones costosas`],correct:2,explain:`Su objetivo es cubrir eventos médicos caros que podrían afectar seriamente tus finanzas.`},{type:`choice`,prompt:`Comparas dos seguros de gastos médicos con prima parecida. ¿Cuál suele proteger mejor ante un evento muy caro?`,options:[`El de suma asegurada más alta y deducible que sí puedes pagar`,`El de suma asegurada más baja`,`El que tiene más exclusiones`],correct:0,explain:`Una suma asegurada alta evita que se acabe la cobertura a mitad de un tratamiento, y un deducible pagable hace que realmente puedas usarlo.`},{type:`truefalse`,statement:`Si soy joven y sano, no necesito saber qué cobertura médica tengo.`,answer:!1,explain:`Los accidentes pasan a cualquier edad. Saber si tienes IMSS, seguro facultativo o algún seguro privado te ayuda a actuar rápido cuando lo necesites.`}],keyPoints:[`Si trabajas formalmente, tu patrón debe inscribirte al IMSS.`,`Si estudias en escuela pública de prepa o uni, puedes tener seguro facultativo.`,`Gastos médicos mayores cubre eventos caros, no consultas sencillas.`,`Compara suma asegurada, deducible, coaseguro y exclusiones.`]},{id:`m9-l3`,title:`Seguros para tus cosas`,summary:`Seguros de celular, de auto o moto, coberturas incluidas en tarjetas y exclusiones.`,minutes:6,xp:60,objectives:[`Evaluar si un seguro de celular te conviene`,`Explicar por qué la responsabilidad civil es clave en auto o moto`,`Reconocer coberturas que ya tienes por tarjetas o compras`],steps:[{type:`intro`,title:`Seguro de celular: haz cuentas`,body:[`Al comprar un celular te pueden ofrecer un seguro contra robo o daño. Puede ser útil, pero haz cuentas.`,`Suma lo que pagarás de prima en el año y súmale el deducible. Compáralo con lo que costaría reparar o reponer tu equipo.`,`Lee si cubre robo con violencia, robo sin violencia, pérdida o daño por agua. Muchos no cubren todo.`],example:{who:`Camila, 20 años, uni y chamba de medio tiempo`,text:`Su celular costó $7,000. Le ofrecen un seguro con prima mensual de $150 y deducible de $1,500 (ejemplo).`,rows:[{label:`Primas en un año ($150 × 12)`,amount:1800,tag:`Fijo`},{label:`Deducible si lo usa`,amount:1500,tag:`Cuidado`},{label:`Total si lo usa una vez en el año`,amount:3300},{label:`Celular nuevo sin seguro`,amount:7e3,tag:`Riesgo`}]}},{type:`choice`,prompt:`Si Camila nunca usa el seguro en el año, ¿cuánto pagó de primas?`,options:[`$1,500`,`$150`,`$1,800`],correct:2,explain:`$150 × 12 meses = $1,800 en primas, aunque no haya ocurrido ningún siniestro.`},{type:`choice`,prompt:`El seguro de celular de Camila dice "no cubre robo sin violencia". ¿Qué significa?`,options:[`Si se lo sacan de la mochila sin que se dé cuenta, no la cubre`,`Cubre cualquier pérdida`,`Solo cubre si el celular se moja`],correct:0,explain:`Robo sin violencia es cuando te lo quitan sin amenaza ni agresión. Si está excluido, ese caso no lo paga el seguro.`},{type:`intro`,title:`Auto o moto: responsabilidad civil`,body:[`Si manejas un auto o una moto, el seguro más importante es el de responsabilidad civil: paga los daños que causes a otras personas o a sus bienes.`,`Un choque puede dañar otro vehículo o lastimar a alguien. Esos costos pueden ser enormes y, sin seguro, tendrías que pagarlos tú.`,`Hay coberturas más amplias que también protegen tu propio vehículo (daños, robo). Cuestan más, pero cubren más.`],callout:{tone:`dato`,text:`El seguro de responsabilidad civil es obligatorio para circular por carreteras federales, y muchos estados también lo exigen.`},terms:[{term:`Responsabilidad civil`,def:`Cobertura que paga los daños que tú causas a terceros: personas, autos o propiedades.`},{term:`Cobertura amplia`,def:`Seguro de auto que además cubre daños y robo de tu propio vehículo.`},{term:`Tercero`,def:`Otra persona afectada por un siniestro que tú causaste.`}]},{type:`choice`,prompt:`Chocas una moto contra un auto estacionado. ¿Qué cobertura paga el daño del auto?`,options:[`Responsabilidad civil`,`Seguro de celular`,`Seguro facultativo`],correct:0,explain:`La responsabilidad civil cubre los daños que causas a terceros, como el auto de otra persona.`},{type:`truefalse`,statement:`Si mi auto es viejo y barato, no necesito ningún seguro.`,answer:!1,explain:`Tal vez no necesites cubrir tu propio auto, pero los daños que causes a otros pueden costar mucho más que tu vehículo. La responsabilidad civil sigue siendo clave.`},{type:`intro`,title:`Seguros que quizá ya tienes`,body:[`Algunas tarjetas de débito o crédito incluyen seguros: por ejemplo, protección de compras, garantía extendida o seguro de viaje.`,`Algunas compras traen garantía del fabricante o del vendedor. Antes de pagar un seguro extra, revisa lo que ya tienes.`,`Estas coberturas casi siempre tienen condiciones: pagar con esa tarjeta, registrar la compra o reclamar en cierto plazo.`],callout:{tone:`tip`,text:`Lee la sección de exclusiones antes de firmar. Ahí está lo que NO cubren, y es donde suelen estar las sorpresas.`}},{type:`choice`,prompt:`Al comprar una laptop te ofrecen garantía extendida. ¿Qué conviene revisar primero?`,options:[`Nada, siempre conviene comprarla`,`Si ya tienes garantía del fabricante o protección con tu tarjeta`,`Solo el precio de la laptop`],correct:1,explain:`Podrías estar pagando dos veces por la misma protección. Revisa lo que ya tienes antes de contratar algo extra.`},{type:`truefalse`,statement:`Todos los seguros de celular cubren cualquier daño o pérdida.`,answer:!1,explain:`Cada póliza tiene exclusiones: muchas no cubren pérdida, robo sin violencia o ciertos daños. Hay que leerlas.`}],keyPoints:[`Para un seguro de celular, compara primas + deducible contra el costo de reponerlo.`,`Si manejas, la responsabilidad civil te protege de los daños que causes a otros.`,`Revisa si tu tarjeta o tu compra ya incluyen protección.`,`Las exclusiones dicen lo que no se cubre: léelas siempre.`]},{id:`m9-l4`,title:`Leer una póliza sin perderte`,summary:`Exclusiones, periodos de espera, cómo reclamar y a quién acudir si hay problemas.`,minutes:6,xp:60,objectives:[`Ubicar las partes clave de una póliza de seguro`,`Explicar qué son exclusiones y periodos de espera`,`Seguir los pasos para reclamar y acudir a CONDUSEF`],steps:[{type:`intro`,title:`Las partes de una póliza`,body:[`La póliza es el contrato de tu seguro. Puede parecer larga, pero hay partes clave que conviene ubicar.`,`La carátula resume lo importante: quién está asegurado, vigencia, prima, suma asegurada, deducible y coaseguro.`,`Las condiciones generales explican cómo funciona todo: qué cubre, qué no, cómo reclamar y en qué plazos.`],terms:[{term:`Póliza`,def:`El contrato del seguro, donde están tus derechos y obligaciones.`},{term:`Carátula`,def:`La primera hoja de la póliza, con el resumen de tu cobertura.`},{term:`Vigencia`,def:`Las fechas en que tu seguro está activo.`}]},{type:`choice`,prompt:`¿Dónde encuentras rápido tu suma asegurada y tu deducible?`,options:[`En la publicidad`,`En la carátula de la póliza`,`En las redes sociales de la aseguradora`],correct:1,explain:`La carátula resume los datos principales de tu cobertura. La publicidad no es parte del contrato.`},{type:`intro`,title:`Exclusiones y periodos de espera`,body:[`Las exclusiones son situaciones que el seguro no cubre. Por ejemplo, daños por manejar en estado de ebriedad o enfermedades que ya tenías antes de contratar.`,`El periodo de espera es el tiempo que debe pasar desde que contratas para que ciertas coberturas empiecen a aplicar. Es común en seguros de gastos médicos.`,`Si no conoces estas reglas, podrías creer que estás protegido y llevarte una sorpresa al reclamar.`],example:{who:`Paola, 25 años, contrató gastos médicos por su cuenta`,text:`Su póliza (ejemplo) tiene periodo de espera de 12 meses para cierta cirugía. La necesitó a los 8 meses.`,rows:[{label:`Costo de la cirugía`,amount:6e4,tag:`Riesgo`},{label:`Lo que cubrió el seguro (en periodo de espera)`,amount:0,tag:`Cuidado`}]},callout:{tone:`alerta`,text:`Si ya tienes una condición de salud, pregunta antes de contratar
