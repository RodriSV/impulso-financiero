s son opcionales, pero el tiempo las hace crecer.`,`Ubica tu Afore, actualiza tus datos y registra beneficiarios.`,`Compara el rendimiento neto antes de cambiarte.`]},{id:`m7-l4`,title:`Vivir por tu cuenta`,summary:`Cuánto cuesta independizarte, presupuesto previo, compartir depa y tu contrato de renta.`,minutes:7,xp:70,objectives:[`Calcular los costos iniciales de mudarte`,`Armar un presupuesto mensual antes de independizarte`,`Revisar los puntos clave de un contrato de arrendamiento`],steps:[{type:`intro`,title:`Lo que cuesta mudarte`,body:[`Independizarte no solo cuesta la renta. Al inicio hay gastos que se pagan una sola vez y suelen sorprender.`,`Es común que pidan un mes de depósito además del primer mes de renta. Súmale la mudanza, muebles básicos y la instalación de servicios.`,`Si juntas ese dinero antes, te mudas con tranquilidad y sin endeudarte de golpe.`],terms:[{term:`Depósito en garantía`,def:`Dinero que entregas al rentar y te devuelven al salir si no hay daños ni adeudos.`},{term:`Aval o fiador`,def:`Persona que responde si no pagas la renta. Algunos arrendadores lo piden.`},{term:`Costo inicial`,def:`Gastos de una sola vez para empezar a vivir en un lugar.`}],example:{who:`Iván, 23 años, se muda cerca de su trabajo`,text:`Encontró un cuarto con renta de $3,500. Esto necesitó juntar antes de entrar.`,rows:[{label:`Primer mes de renta`,amount:3500,tag:`Fijo`},{label:`Depósito (un mes)`,amount:3500,tag:`Cuidado`},{label:`Mudanza`,amount:1200,tag:`Variable`},{label:`Muebles básicos`,amount:4e3,tag:`Variable`},{label:`Total inicial`,amount:12200}]}},{type:`choice`,prompt:`La renta es $4,000 y piden un mes de depósito. La mudanza cuesta $1,000. ¿Cuánto necesitas para entrar, sin contar muebles?`,options:[`$5,000`,`$8,000`,`$9,000`],correct:2,explain:`$4,000 de renta + $4,000 de depósito + $1,000 de mudanza = $9,000.`},{type:`truefalse`,statement:`Para independizarte basta con poder pagar la renta de cada mes.`,answer:!1,explain:`Es un mito. También necesitas cubrir depósito, mudanza, muebles, servicios, comida y transporte.`},{type:`intro`,title:`Tu presupuesto antes de mudarte`,body:[`Antes de firmar, haz un presupuesto con todos los gastos del mes: renta, luz, agua, gas, internet, comida, transporte y un poco para imprevistos.`,`Una referencia común es que la vivienda no se lleve más de un tercio de tu ingreso neto. No es una regla de ley, solo una guía para no quedar apretado.`,`Una buena prueba: vive un par de meses con ese presupuesto antes de mudarte y ahorra la diferencia. Si te alcanza, vas bien.`],callout:{tone:`tip`,text:`Pregunta a quien vive ahí cuánto pagan de luz, agua y gas. Los servicios cambian mucho según la zona y la temporada.`}},{type:`choice`,prompt:`Tu ingreso neto es $12,000. Si la vivienda no debe pasar de un tercio, ¿cuál es tu renta máxima de referencia?`,options:[`$4,000`,`$3,000`,`$6,000`],correct:0,explain:`$12,000 ÷ 3 = $4,000. Es una guía para dejar espacio a tus otros gastos.`},{type:`choice`,prompt:`¿Qué gasto suelen olvidar quienes se mudan por primera vez?`,options:[`La renta`,`Gas, internet y artículos de limpieza`,`Nada, todo es obvio`],correct:1,explain:`Los gastos chicos de la casa se acumulan y no siempre se piensan al principio.`},{type:`intro`,title:`Compartir depa y el contrato`,body:[`Rentar con roomies baja mucho el costo. Un depa de $7,000 entre dos queda en $3,500 por persona, y entre varios aún menos.`,`Antes de firmar, lee el contrato de arrendamiento completo. Fíjate en el monto, la fecha de pago, la duración, quién paga reparaciones y cómo te devuelven el depósito.`,`Toma fotos del lugar el día que entras. Te sirven para demostrar cómo lo recibiste cuando te devuelvan el depósito.`],callout:{tone:`alerta`,text:`Desconfía si te piden depositar para "apartar" un depa que no has visto en persona. Es una forma común de fraude.`}},{type:`choice`,prompt:`Rentan un depa de $9,000 entre tres roomies, en partes iguales. ¿Cuánto paga cada quien?`,options:[`$4,500`,`$3,000`,`$2,500`],correct:1,explain:`$9,000 ÷ 3 = $3,000 por persona.`},{type:`choice`,prompt:`¿Para qué sirve tomar fotos del depa el día que entras?`,options:[`Para subirlas a redes`,`No sirve de nada`,`Para demostrar cómo recibiste el lugar y recuperar tu depósito`],correct:2,explain:`Las fotos con fecha ayudan a aclarar qué daños ya existían antes de que llegaras.`}],keyPoints:[`Junta antes los costos iniciales: depósito, primer mes, mudanza y muebles.`,`Haz un presupuesto mensual completo y pruébalo antes de mudarte.`,`Compartir depa reduce mucho el gasto de vivienda.`,`Lee el contrato y toma fotos del lugar al entrar.`]},{id:`m7-l5`,title:`Dinero compartido: amigos, roomies y pareja`,summary:`Dividir gastos, llevar cuentas claras, hacer acuerdos y prestar dinero con cuidado.`,minutes:6,xp:60,objectives:[`Dividir gastos en partes iguales o proporcionales`,`Organizar cuentas compartidas con acuerdos claros`,`Decidir con calma si prestar dinero a alguien cercano`],steps:[{type:`intro`,title:`Dividir gastos sin pleitos`,body:[`Compartir gastos es parte de vivir con otras personas. Lo que causa problemas no es el dinero, sino no haber hablado antes.`,`Hay dos formas comunes de dividir. En partes iguales: cada quien paga lo mismo. Proporcional: cada quien paga según lo que gana.`,`Ninguna es mejor por sí sola. Lo importante es que todos estén de acuerdo y que se sienta justo.`],terms:[{term:`Partes iguales`,def:`Se divide el gasto entre el número de personas.`},{term:`División proporcional`,def:`Cada quien paga un porcentaje según su ingreso.`}],example:{who:`Paola y Rodrigo, 26 y 27 años, viven juntos`,text:`Paola gana $10,000 y Rodrigo $15,000. Juntos ganan $25,000, así que Paola aporta 40% y Rodrigo 60% de los gastos de la casa.`,rows:[{label:`Gastos de la casa al mes`,amount:5e3,tag:`Fijo`},{label:`Paola (40% de $5,000)`,amount:2e3},{label:`Rodrigo (60% de $5,000)`,amount:3e3}]}},{type:`choice`,prompt:`Tres roomies pagan $900 de luz, agua e internet, en partes iguales. ¿Cuánto paga cada quien?`,options:[`$300`,`$450`,`$270`],correct:0,explain:`$900 ÷ 3 = $300 por persona.`},{type:`choice`,prompt:`Ana gana $8,000 y Beto $12,000. Dividen $4,000 de gastos de forma proporcional. ¿Cuánto paga Ana?`,options:[`$2,000`,`$1,600`,`$2,400`],correct:1,explain:`Juntos ganan $20,000; Ana aporta $8,000 ÷ $20,000 = 40%. El 40% de $4,000 es $1,600.`},{type:`intro`,title:`Cuentas claras`,body:[`Usa una lista o una app para llevar los gastos compartidos. Anota quién pagó qué y cuánto le deben.`,`Pónganse de acuerdo en fechas: cuándo se paga la renta, quién paga cada servicio y cada cuánto hacen cuentas.`,`También acuerden temas como la despensa común, las visitas o qué pasa si alguien se va antes de que termine el contrato.`],callout:{tone:`tip`,text:`Hagan "corte de cuentas" una vez al mes. Es más fácil saldar poco a poco que juntar meses de pendientes.`}},{type:`truefalse`,statement:`Hablar de dinero con tu pareja o roomies siempre termina en pleito.`,answer:!1,explain:`Es un mito. Hablar a tiempo y con calma evita muchos malentendidos.`},{type:`choice`,prompt:`¿Cuál es un buen acuerdo para roomies?`,options:[`"Ya veremos cuando llegue el recibo"`,`"Cada quien paga lo que pueda, sin anotar"`,`"La renta se paga el día 1 y la luz se divide entre todos al llegar el recibo"`],correct:2,explain:`Un acuerdo con fechas y reglas concretas evita confusiones y deja claro qué le toca a cada quien.`},{type:`intro`,title:`Prestar dinero a alguien cercano`,body:[`Prestar dinero a un amigo o familiar puede ser un gran apoyo. También puede tensar la relación si no queda claro cómo se paga.`,`Antes de prestar, pregúntate: ¿puedo vivir sin este dinero si no regresa pronto? Si la respuesta es no, está bien decir que no o prestar menos.`,`Si prestas, acuerden monto y fecha de pago, y déjenlo por escrito, aunque sea en un mensaje.`],callout:{tone:`alerta`,text:`Evita pedir un crédito a tu nombre para prestárselo a alguien. Si no te pagan, la deuda y tu historial son tuyos.`}},{type:`choice`,prompt:`Un amigo te pide $2,000 prestados y es justo tu dinero para la renta. ¿Qué es razonable?`,options:[`Prestarle todo y ver cómo pagas la renta`,`Decirle con amabilidad que ahora no puedes, o prestarle una cantidad que sí puedas`,`Sacar un préstamo para dárselo`],correct:1,explain:`Ayudar está bien, pero sin poner en riesgo tus gastos básicos. Decir que no también es una opción válida.`},{type:`truefalse`,statement:`Si prestas dinero a un amigo, conviene acordar monto y fecha de pago.`,answer:!0,explain:`Es realidad. Un acuerdo claro, aunque sea por mensaje, protege el dinero y la amistad.`}],keyPoints:[`Puedes dividir gastos en partes iguales o según lo que gana cada quien.`,`Lleven una lista de gastos y hagan cuentas una vez al mes.`,`Los acuerdos con fechas y reglas claras evitan pleitos.`,`Presta solo lo que puedas perder y deja el acuerdo por escrito.`]},{id:`m7-l3`,title:`Tu plan a cinco años`,summary:`Une todo lo aprendido: prioridades, metas SMART y cómo revisar tu plan.`,minutes:7,xp:70,objectives:[`Ordenar tus prioridades financieras`,`Escribir metas SMART con monto, plazo y aporte`,`Revisar y ajustar tu plan cuando cambie tu vida`],steps:[{type:`intro`,title:`Junta todo lo que aprendiste`,body:[`Un plan financiero conecta tus metas con tu presupuesto: qué quieres lograr, cuánto cuesta y cuánto puedes separar.`,`A lo largo del camino viste presupuesto, ahorro, crédito, inversión, trabajo y vivienda. El plan es donde todo eso se junta.`,`No necesitas tenerlo perfecto. Un plan sencillo que sigues vale más que uno complicado que abandonas.`],callout:{tone:`tip`,text:`Escribe tu plan en una sola hoja. Si cabe en una página, es más fácil revisarlo y seguirlo.`}},{type:`choice`,prompt:`¿Qué conecta un plan financiero?`,options:[`Tus metas con tu presupuesto`,`Tus redes sociales con tus compras`,`Solo tus deudas`],correct:0,explain:`El plan traduce lo que quieres lograr en cuánto separar cada mes.`},{type:`intro`,title:`Ordena tus prioridades`,body:[`Un orden que funciona para mucha gente: primero un fondo de emergencia básico, luego pagar deudas caras, después metas de estudio o trabajo y al final metas de largo plazo.`,`El fondo va primero porque te protege mientras avanzas en lo demás. Sin él, cualquier imprevisto te regresa a la deuda.`,`Puedes avanzar en varias metas a la vez, repartiendo tu ahorro. Lo importante es saber cuál pesa más ahora.`],example:{who:`Valeria, 22 años, recién egresada con empleo formal`,text:`Puede ahorrar $2,000 al mes y lo reparte según sus prioridades.`,rows:[{label:`Fondo de emergencia`,amount:800,tag:`Ahorro`},{label:`Pagar tarjeta de crédito`,amount:700,tag:`Cuidado`},{label:`Curso de inglés`,amount:300,tag:`Meta`},{label:`Aportación voluntaria a Afore`,amount:200,tag:`Ahorro`}]}},{type:`choice`,prompt:`¿Qué suele ir primero en un plan?`,options:[`Un auto nuevo`,`Invertir todo en algo de alto riesgo`,`Un fondo de emergencia básico`],correct:2,explain:`Te protege mientras avanzas en las demás metas.`},{type:`truefalse`,statement:`Hay que terminar una meta por completo antes de empezar la siguiente.`,answer:!1,explain:`Es un mito. Puedes repartir tu ahorro entre varias metas, dando más peso a la más importante.`},{type:`choice`,prompt:`Valeria ahorra $800 al mes para su fondo de emergencia. ¿Cuánto junta en un año?`,options:[`$8,000`,`$9,600`,`$12,000`],correct:1,explain:`$800 × 12 = $9,600.`},{type:`intro`,title:`Metas SMART y revisiones`,body:[`Una meta SMART es específica, medible, alcanzable, relevante y con tiempo definido. "Ahorrar" no lo es; "juntar $30,000 en 5 años" sí.`,`Para calcular el aporte: monto ÷ número de meses. Si el resultado no cabe en tu presupuesto, ajusta el plazo o el monto.`,`Revisa tu plan al menos una vez al año, o cuando cambie tu vida: un nuevo trabajo, una mudanza o una deuda pagada.`],terms:[{term:`Meta SMART`,def:`Meta específica, medible, alcanzable, relevante y con fecha.`},{term:`Plazo`,def:`Tiempo que te das para lograr una meta: corto, mediano o largo.`}]},{type:`choice`,prompt:`¿Cuál es una meta a cinco años bien planteada?`,options:[`Ser rico`,`Algún día ahorrar`,`Juntar $30,000 para un posgrado en 5 años, con $500 al mes`],correct:2,explain:`Tiene monto, plazo y aporte mensual: $500 × 60 meses = $30,000.`},{type:`choice`,prompt:`Quieres juntar $18,000 en 3 años. ¿Cuánto necesitas ahorrar al mes?`,options:[`$500`,`$600`,`$1,500`],correct:0,explain:`3 años = 36 meses. $18,000 ÷ 36 = $500 al mes.`},{type:`choice`,prompt:`Cambias de trabajo y ganas más. ¿Qué haces con tu plan?`,options:[`Lo dejo igual para siempre`,`Lo actualizo`,`Lo abandono`],correct:1,explain:`Los planes evolucionan con tu vida. Un aumento puede acelerar tus metas.`}],keyPoints:[`Un plan conecta tus metas con tu presupuesto.`,`Prioridad común: fondo de emergencia, deudas caras, metas de mediano y largo plazo.`,`Una meta SMART tiene monto, plazo y aporte mensual.`,`Revisa tu plan cada año o cuando cambie tu vida.`]}]},{id:`m12`,title:`Bienestar financiero`,description:`Emociones, presión social, dinero en familia y estrés: cómo cuidar tu dinero cuidándote a ti.`,why:`El dinero no solo se maneja con números, también con emociones. Entender lo que sientes te ayuda a decidir con calma y a pedir apoyo cuando lo necesitas.`,lessons:[{id:`m12-l1`,title:`Emociones y compras`,summary:`Por qué compramos por impulso, estrés o aburrimiento, y cómo hacer una pausa sin culpa.`,minutes:6,xp:60,objectives:[`Reconocer las emociones que te llevan a comprar`,`Aplicar una pausa antes de una compra no planeada`,`Calcular cuánto suman las compras por impulso`],steps:[{type:`intro`,title:`Comprar también es emocional`,body:[`A todos nos pasa: tuviste un día pesado y terminas comprando algo para sentirte mejor. Es muy humano.`,`Las compras por impulso suelen aparecer con estrés, aburrimiento, tristeza o incluso alegría. Por un rato se siente bien, pero a veces después llega el arrepentimiento.`,`El objetivo no es dejar de darte gustos. Es que tus compras sean decisiones tuyas y no solo una reacción a cómo te sientes.`],terms:[{term:`Compra por impulso`,def:`Compra no planeada que haces en el momento, muchas veces por una emoción.`},{term:`Disparador`,def:`Situación o emoción que te da ganas de comprar: un mal día, aburrimiento, una oferta.`}]},{type:`choice`,prompt:`¿Cuál de estas situaciones suele disparar compras por impulso?`,options:[`Hacer la lista del súper antes de salir`,`Revisar tu presupuesto del mes`,`Navegar en tiendas en línea cuando estás aburrido`],correct:2,explain:`El aburrimiento y el acceso fácil a tiendas en línea son una combinación muy común para comprar sin planear.`},{type:`truefalse`,statement:`Si compras por impulso de vez en cuando, eres malo con el dinero.`,answer:!1,explain:`Es un mito. Le pasa a casi todos. Lo que ayuda es notarlo y tener estrategias, no sentir culpa.`},{type:`intro`,title:`Lo poquito que se vuelve mucho`,body:[`Una compra chica no parece gran cosa. El problema es cuando se repite sin que lo notes.`,`Hacer la cuenta una vez te da información, no culpa. Así decides si ese gasto vale la pena para ti o si prefieres usar ese dinero en otra cosa.`,`Si después de pensarlo te sigue haciendo feliz, está bien. Puedes incluirlo en tu presupuesto como un gusto planeado.`],example:{who:`Montse, 20 años, estudia y trabaja medio tiempo`,text:`Cuando sale estresada de la uni, se compra un frappé y un snack. Lo hace unas 3 veces por semana.`,rows:[{label:`Frappé y snack`,amount:85,tag:`Deseo`},{label:`A la semana ($85 × 3)`,amount:255,tag:`Deseo`},{label:`Al mes ($255 × 4)`,amount:1020,tag:`Cuidado`}]}},{type:`choice`,prompt:`Gastas $60 en antojos por estrés 5 días a la semana. ¿Cuánto suman en 4 semanas?`,options:[`$300`,`$1,200`,`$240`],correct:1,explain:`$60 × 5 = $300 a la semana. $300 × 4 = $1,200 al mes.`},{type:`classify`,prompt:`¿Necesidad o deseo?`,item:`Unos audífonos nuevos porque viste una oferta, aunque los tuyos funcionan`,amount:650,correct:`deseo`,explain:`Tus audífonos funcionan, así que es un deseo. No está mal quererlos; solo vale la pena planearlo.`},{type:`intro`,title:`La pausa antes de comprar`,body:[`Una técnica sencilla: cuando algo no planeado te guste, espera 24 horas antes de comprarlo. Si sigues queriéndolo, cómpralo con tranquilidad.`,`Pregúntate también: ¿cómo me siento ahora? ¿Esto resuelve lo que siento o solo lo tapa un rato?`,`Busca alternativas que te hagan sentir bien sin gastar: caminar, hablar con alguien, escuchar música o descansar.`],callout:{tone:`tip`,text:`Deja las cosas en el carrito y cierra la app. Si mañana ya no te emociona, te ahorraste el dinero; si sí, la compra será más consciente.`}},{type:`choice`,prompt:`Viste unos tenis que te encantaron, pero no estaban en tu plan. ¿Qué es lo más útil?`,options:[`Comprarlos ya, antes de que se acaben`,`Esperar 24 horas y ver si sigues queriéndolos`,`Sentirte mal por quererlos`],correct:1,explain:`La pausa te da tiempo de decidir con calma. Querer cosas está bien; la idea es elegir tú.`},{type:`choice`,prompt:`¿Qué pregunta te ayuda a detectar una compra emocional?`,options:[`"¿Cómo me siento ahora mismo?"`,`"¿Cuántas personas lo tienen?"`,`"¿De qué colores lo hay?"`],correct:0,explain:`Ponerle nombre a la emoción te ayuda a ver si de verdad quieres la compra o solo buscas sentirte mejor.`},{type:`truefalse`,statement:`Darte gustos planeados dentro de tu presupuesto es parte de unas finanzas sanas.`,answer:!0,explain:`Es realidad. Un presupuesto sin gustos es difícil de sostener. Planearlos te deja disfrutar sin preocuparte.`}],keyPoints:[`Las compras por impulso suelen venir de emociones, y le pasan a todos.`,`Hacer la cuenta te da información, no culpa.`,`Espera 24 horas antes de una compra no planeada.`,`Los gustos planeados también son parte de tu presupuesto.`]},{id:`m12-l2`,title:`Presión social y redes`,summary:`Comparación en redes, FOMO y cómo decir que no o proponer planes más baratos.`,minutes:6,xp:60,objectives:[`Reconocer cómo las redes influyen en lo que gastas`,`Identificar el FOMO cuando aparece`,`Proponer planes más baratos sin sentirte mal`],steps:[{type:`intro`,title:`Lo que ves no es toda la historia`,body:[`En redes vemos viajes, ropa nueva y salidas cada fin de semana. Es fácil sentir que todos tienen más que tú.`,`Pero lo que se publica es una parte seleccionada. No ves las deudas, los meses de ahorro ni los días normales.`,`Compararte con lo que ves en redes es como comparar tu película completa con el tráiler de alguien más.`],terms:[{term:`FOMO`,def:`Miedo a perderte algo. Esa sensación de que, si no vas o no compras, te quedas fuera.`},{term:`Presión social`,def:`Influencia de otras personas para que hagas o compres algo, aunque no lo hayas planeado.`}]},{type:`truefalse`,statement:`Si alguien publica viajes y compras seguido, seguro le sobra el dinero.`,answer:!1,explain:`Es un mito. No sabes cómo lo pagó: pudo ahorrar meses, usar crédito o estar endeudado. Las redes muestran solo una parte.`},{type:`choice`,prompt:`Ves que tus amigos van a un concierto y sientes que tienes que ir aunque no te alcanza. ¿Qué es eso?`,options:[`Un presupuesto`,`FOMO`,`Un fondo de emergencia`],correct:1,explain:`El FOMO es el miedo a quedarte fuera. Reconocerlo te ayuda a decidir con más calma.`},{type:`intro`,title:`Decir que no sin pena`,body:[`Decir "esta vez no puedo" es válido. Tus amigos de verdad lo van a entender.`,`No tienes que dar explicaciones largas. Algo como "Ahorita estoy ahorrando para algo, pero me late vernos otro día" es suficiente.`,`También puedes decir que sí a una parte: ir a la reunión, pero no a la cena cara, o llegar después.`],callout:{tone:`tip`,text:`Ten lista una frase amable para decir que no. Cuando ya la tienes pensada, es mucho más fácil usarla.`}},{type:`choice`,prompt:`Te invitan a una cena de $600 y no está en tu presupuesto. ¿Cuál es una respuesta sana?`,options:[`Ir y pagarlo con tarjeta sin revisar cuánto debes`,`Inventar una excusa y sentirte mal`,`"Esta vez no puedo, pero ¿nos vemos el domingo en el parque?"`],correct:2,explain:`Es honesto, cuida tu presupuesto y mantiene la amistad con otra propuesta.`},{type:`choice`,prompt:`¿Cuál es una buena forma de reducir la comparación en redes?`,options:[`Dejar de seguir cuentas que te hacen sentir mal o con ganas de comprar`,`Pasar más tiempo viendo compras de otros`,`Comprar lo mismo que ves para no quedarte atrás`],correct:0,explain:`Lo que ves influye en lo que quieres. Elegir qué sigues es una forma de cuidarte.`},{type:`intro`,title:`Planes buenos y baratos`,body:[`Pasarla bien no tiene que costar mucho. Muchas veces lo que importa es la compañía, no el lugar.`,`Puedes proponer: cena en casa donde cada quien lleva algo, picnic, ver una película juntos, eventos culturales gratuitos o salir a caminar.`,`Cuando tú propones el plan, no solo ahorras: también ayudas a otros que quizá tampoco querían gastar tanto.`],example:{who:`Jorge, 19 años, en primer semestre de la uni`,text:`Su grupo quería salir a un bar. Propuso una noche de juegos en su casa y cada quien llevó algo.`,rows:[{label:`Salida al bar por persona`,amount:600,tag:`Deseo`},{label:`Noche de juegos por persona`,amount:150,tag:`Ahorro`},{label:`Diferencia ($600 − $150)`,amount:450,tag:`Ahorro`}]},callout:{tone:`dato`,text:`Muchas ciudades de México tienen museos, cines al aire libre y eventos culturales gratis o con descuento para estudiantes.`}},{type:`choice`,prompt:`Una salida cuesta $500 y el plan alternativo $120. Si eligen el alternativo dos veces al mes, ¿cuánto ahorras al mes?`,options:[`$380`,`$620`,`$760`],correct:2,explain:`$500 − $120 = $380 por salida. $380 × 2 = $760 al mes.`},{type:`truefalse`,statement:`Proponer un plan más barato significa que eres codo.`,answer:!1,explain:`Es un mito. Cuidar tu dinero es una decisión responsable, y muchas veces otros lo agradecen.`}],keyPoints:[`Las redes muestran solo una parte de la vida de otros.`,`Reconocer el FOMO te ayuda a decidir con calma.`,`Decir "esta vez no puedo" es válido y no necesita explicaciones largas.`,`Proponer planes baratos te ayuda a ti y a tus amigos.`]},{id:`m12-l3`,title:`Hablar de dinero en familia`,summary:`Apoyar a tu familia, poner límites con cariño y tener conversaciones claras de dinero.`,minutes:6,xp:60,objectives:[`Decidir cuánto apoyar a tu familia sin descuidarte`,`Poner límites de dinero con respeto`,`Preparar una conversación clara sobre dinero`],steps:[{type:`intro`,title:`Apoyar a la familia`,body:[`En muchas familias de México, cuando alguien empieza a ganar dinero, aporta a la casa. Es una forma de cariño y de trabajo en equipo.`,`Apoyar está bien. Lo importante es que el apoyo sea claro y sostenible, para que no te quedes sin cubrir tus propios gastos o metas.`,`Una buena forma es acordar una cantidad fija o un porcentaje de tu ingreso. Así todos saben con qué contar.`],terms:[{term:`Aporte fijo`,def:`Cantidad que das cada mes o quincena, acordada de antemano.`},{term:`Límite`,def:`Lo que puedes dar sin afectar tus necesidades básicas ni tus metas importantes.`}],example:{who:`Brenda, 20 años, trabaja y vive con su mamá`,text:`Gana $8,000 al mes. Acordó con su mamá aportar 20% para la casa, y planeó el resto.`,rows:[{label:`Ingreso mensual`,amount:8e3},{label:`Aporte a la casa (20%)`,amount:1600,tag:`Fijo`},{label:`Transporte y comida`,amount:3200,tag:`Necesidad`},{label:`Ahorro`,amount:1200,tag:`Ahorro`},{label:`Gustos y otros`,amount:2e3,tag:`Deseo`}]}},{type:`choice`,prompt:`Ganas $7,000 al mes y acuerdas aportar 15% a tu casa. ¿Cuánto aportas?`,options:[`$1,050`,`$700`,`$1,500`],correct:0,explain:`$7,000 × 0.15 = $1,050 al mes.`},{type:`truefalse`,statement:`Si apoyas a tu familia, ya no puedes ahorrar nada para ti.`,answer:!1,explain:`Es un mito. Con un aporte claro y un presupuesto, puedes apoyar y también avanzar en tus metas, aunque sea poco a poco.`},{type:`intro`,title:`Poner límites con cariño`,body:[`A veces llegan peticiones extra: un préstamo, una emergencia, una fiesta. Es normal querer ayudar siempre.`,`Poner un límite no es egoísmo. Si te quedas sin dinero para tus básicos, después no podrás ayudar a nadie.`,`Puedes decir algo como: "Te quiero ayudar. Este mes puedo con $500, más no me alcanza". Es claro y amable.`],callout:{tone:`alerta`,text:`Ten cuidado con prestar tu tarjeta o sacar créditos a tu nombre para otras personas. Si no se pagan, la deuda y tu historial son tuyos.`}},{type:`choice`,prompt:`Un familiar te pide que saques un crédito a tu nombre para él. ¿Qué conviene saber antes de decidir?`,options:[`Que la deuda queda a tu nombre aunque él use el dinero`,`Que el banco le cobrará a él directamente`,`Que no afecta tu historial`],correct:0,explain:`Quien firma el crédito es responsable ante la institución. Si no se paga, afecta tu historial.`},{type:`choice`,prompt:`¿Cuál es una forma clara y amable de poner un límite?`,options:[`No contestar los mensajes`,`"Este mes puedo ayudarte con $500; más no me alcanza"`,`Prestar todo y luego reclamarlo enojado`],correct:1,explain:`Dice qué sí puedes hacer y hasta dónde, sin dejar de mostrar que te importa.`},{type:`intro`,title:`Conversaciones claras`,body:[`Hablar de dinero en familia puede sentirse incómodo, pero evita malentendidos. Elige un momento tranquilo, no en medio de una discusión.`,`Lleva tus números: cuánto ganas, cuánto puedes aportar y qué metas tienes. Así la plática se basa en datos y no en suposiciones.`,`Escucha también. Quizá tu familia tiene preocupaciones que no conocías y juntos encuentran una mejor solución.`],callout:{tone:`tip`,text:`Empieza con lo que te importa: "Quiero apoyar a la casa y también ahorrar para la uni. ¿Podemos ver juntos cómo hacerlo?"`}},{type:`choice`,prompt:`¿Cuál es un buen momento para hablar de dinero en familia?`,options:[`Justo cuando están discutiendo por otra cosa`,`Nunca, es mejor no tocar el tema`,`Un momento tranquilo, con tiempo para platicar`],correct:2,explain:`Con calma es más fácil escuchar, explicar tus números y llegar a acuerdos.`},{type:`truefalse`,statement:`Llevar tus números a la plática ayuda a llegar a acuerdos más claros.`,answer:!0,explain:`Es realidad. Con datos concretos, todos entienden qué es posible y se evitan suposiciones.`}],keyPoints:[`Apoyar a tu familia es valioso; un aporte fijo lo hace claro y sostenible.`,`Poner límites te permite seguir ayudando sin descuidarte.`,`Evita créditos a tu nombre para otras personas.`,`Habla de dinero en un momento tranquilo y con tus números a la mano.`]},{id:`m12-l4`,title:`Estrés financiero y pedir ayuda`,summary:`Reconocer el estrés por dinero, dar un primer paso pequeño y saber dónde buscar apoyo.`,minutes:6,xp:60,objectives:[`Reconocer señales de estrés financiero`,`Elegir un primer paso pequeño para tu situación`,`Identificar dónde pedir orientación y apoyo`],steps:[{type:`intro`,title:`El estrés por dinero es común`,body:[`Preocuparte por el dinero es algo que vive muchísima gente, a cualquier edad y con cualquier ingreso. No estás solo ni sola.`,`Algunas señales: te cuesta dormir pensando en pagos, evitas ver tu saldo, te pones de malas cuando alguien toca el tema o sientes que no hay salida.`,`Sentir esto no significa que hiciste todo mal. Significa que estás cargando algo pesado y que mereces apoyo.`],terms:[{term:`Estrés financiero`,def:`Preocupación o angustia constante relacionada con el dinero, las deudas o los gastos.`},{term:`Evitación`,def:`No querer ver el problema, como no abrir mensajes del banco. Es una reacción muy humana.`}]},{type:`choice`,prompt:`¿Cuál de estas puede ser una señal de estrés financiero?`,options:[`Revisar tu presupuesto una vez al mes`,`Evitar ver tu saldo porque te da miedo`,`Ahorrar para una meta`],correct:1,explain:`Evitar ver tu saldo es una reacción común cuando el dinero preocupa. Notarlo es el primer paso para atenderlo.`},{type:`truefalse`,statement:`Si tienes problemas de dinero es porque no sabes administrarte.`,answer:!1,explain:`Es un mito. Influyen muchas cosas: ingresos bajos, emergencias, salud, familia. Nadie debería sentirse culpable por eso.`},{type:`intro`,title:`Un primer paso pequeño`,body:[`Cuando todo se siente demasiado, no intentes resolverlo de golpe. Elige un solo paso pequeño para hoy.`,`Puede ser: anotar todas tus deudas en una lista, revisar tu saldo, o apartar aunque sea $50. Ver los números asusta menos que imaginarlos.`,`Con tu lista, ordena qué pagar primero. Pagar algo, aunque sea poco, te devuelve un poco de control.`],example:{who:`Daniela, 24 años, con varios pagos pendientes`,text:`Se sentía abrumada. Hizo una lista de lo que debe y vio que el total era manejable con un plan de varios meses.`,rows:[{label:`Tarjeta de crédito`,amount:4500,tag:`Cuidado`},{label:`Préstamo de un amigo`,amount:1e3},{label:`Compra a meses`,amount:1500},{label:`Total`,amount:7e3}]}},{type:`choice`,prompt:`Daniela debe $7,000 en total y puede destinar $1,000 al mes. Sin contar intereses, ¿en cuántos meses terminaría?`,options:[`5 meses`,`10 meses`,`7 meses`],correct:2,explain:`$7,000 ÷ $1,000 = 7 meses. Con intereses puede tardar un poco más, pero ya tiene un plan.`},{type:`choice`,prompt:`Te sientes abrumado por tus deudas. ¿Cuál es un buen primer paso?`,options:[`Hacer una lista de lo que debes`,`Pedir otro préstamo rápido sin revisar condiciones`,`Ignorar los mensajes hasta que se arregle solo`],correct:0,explain:`La lista convierte la preocupación en algo concreto que puedes ordenar y atender.`},{type:`intro`,title:`Pedir ayuda está bien`,body:[`Para temas financieros, la CONDUSEF da orientación gratuita y te ayuda si tienes un problema con un banco u otra institución financiera.`,`Para tu bienestar emocional, hablar con alguien de confianza ayuda mucho. Si el estrés no se va, un profesional de la salud mental puede acompañarte.`,`En México, la Línea de la Vida (800 911 2000) ofrece apoyo gratuito y confidencial. Pedir ayuda es una señal de fuerza, no de debilidad.`],callout:{tone:`dato`,text:`Línea de la Vida: 800 911 2000. Es gratuita, atiende las 24 horas y te escuchan si te sientes mal, por dinero o por cualquier otra cosa. Si estás en peligro inmediato, llama al 911.`}},{type:`choice`,prompt:`Tienes un cobro que no reconoces y el banco no te resuelve. ¿A qué institución puedes acudir?`,options:[`Al SAT`,`A la CONDUSEF`,`Al Infonavit`],correct:1,explain:`La CONDUSEF orienta y atiende quejas de usuarios de servicios financieros, sin costo.`},{type:`truefalse`,statement:`Pedir ayuda por estrés de dinero es exagerar.`,answer:!1,explain:`Es un mito. El estrés por dinero afecta tu sueño, tu ánimo y tu salud. Hablarlo con alguien es una forma de cuidarte.`},{type:`choice`,prompt:`Un amigo te cuenta que el estrés por sus deudas no lo deja dormir. ¿Qué puedes sugerirle?`,options:[`Que no lo platique con nadie`,`Que haga una lista de sus deudas y hable con alguien de confianza o un profesional`,`Que pida otro préstamo para sentirse mejor`],correct:1,explain:`Ordenar los números y buscar apoyo atienden tanto el dinero como el bienestar emocional.`}],keyPoints:[`El estrés por dinero es común y no significa que hiciste todo mal.`,`Un primer paso pequeño, como hacer una lista, te devuelve control.`,`La CONDUSEF orienta gratis en temas financieros.`,`Hablar con alguien ayuda; la Línea de la Vida (800 911 2000) es gratuita.`]}]}],ue=le.flatMap((e,t)=>e.lessons.map((n,r)=>({...n,moduleId:e.id,moduleIndex:t,indexInModule:r,index:0}))).map((e,t)=>({...e,index:t}));function de(e){return ue.find(t=>t.id===e)}function fe(e){return le.find(t=>t.id===e)}function pe(e){return e.steps.filter(e=>e.type===`classify`||e.type===`choice`||e.type===`truefalse`).length}function me(e){let t=Object.keys(e.completedLessons).length,n=le[0].lessons.filter(t=>e.completedLessons[t.id]).length,r=le[0].lessons.length,i=h(e.xp).level,a=le.filter(t=>t.lessons.every(t=>e.completedLessons[t.id])).length;return[{id:`primera-leccion`,title:`Primera lección`,description:`Completa tu primera lección.`,icon:`book`,current
