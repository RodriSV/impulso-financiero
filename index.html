 si se considera preexistente y cómo la tratará la póliza.`},terms:[{term:`Exclusión`,def:`Situación que la póliza dice expresamente que no cubre.`},{term:`Periodo de espera`,def:`Tiempo desde la contratación antes de que ciertas coberturas apliquen.`},{term:`Preexistencia`,def:`Enfermedad o condición que ya tenías antes de contratar el seguro.`}]},{type:`choice`,prompt:`En el caso de Paola, ¿cuántos meses le faltaban para que terminara el periodo de espera?`,options:[`8 meses`,`4 meses`,`12 meses`],correct:1,explain:`12 meses de espera − 8 meses transcurridos = 4 meses faltantes.`},{type:`truefalse`,statement:`Si tengo un seguro, me cubre cualquier cosa desde el primer día.`,answer:!1,explain:`Muchas pólizas tienen periodos de espera y exclusiones. Algunas coberturas empiezan a aplicar tiempo después de contratar.`},{type:`choice`,prompt:`¿Qué es una exclusión?`,options:[`Un descuento en la prima`,`Un beneficio extra`,`Una situación que el seguro no cubre`],correct:2,explain:`Las exclusiones marcan los límites del seguro: lo que no se pagará aunque ocurra.`},{type:`intro`,title:`Cómo reclamar y a quién acudir`,body:[`Si ocurre un siniestro, avisa a la aseguradora lo antes posible. La póliza indica el plazo y el teléfono para reportar.`,`Reúne documentos: identificación, póliza, facturas, recetas, fotos o la denuncia ante el Ministerio Público si fue robo. Guarda el número de reporte.`,`Si no te pagan o no estás de acuerdo, puedes reclamar en la Unidad Especializada de Atención a Usuarios (UNE) de la aseguradora. Si no se resuelve, o si lo prefieres, acude a CONDUSEF.`],callout:{tone:`dato`,text:`CONDUSEF atiende quejas de usuarios de servicios financieros, incluidas las aseguradoras, y su orientación es gratuita.`}},{type:`choice`,prompt:`Te roban la moto y tienes seguro. ¿Qué es lo primero que conviene hacer?`,options:[`Esperar un mes por si aparece`,`Reportar a la aseguradora y presentar la denuncia correspondiente`,`Publicarlo en redes y no avisar a nadie más`],correct:1,explain:`Las pólizas suelen pedir aviso pronto y denuncia en caso de robo. Esperar puede complicar o afectar tu reclamación.`},{type:`choice`,prompt:`La aseguradora rechazó tu reclamación y su UNE no lo resolvió. ¿A dónde puedes acudir?`,options:[`A PROFECO`,`Al SAT`,`A CONDUSEF`],correct:2,explain:`CONDUSEF atiende quejas contra instituciones financieras, incluidas las aseguradoras. PROFECO ve temas de consumo en comercios.`},{type:`truefalse`,statement:`Pedir la póliza por escrito y guardarla es exagerado.`,answer:!1,explain:`La póliza es tu contrato. Sin ella es difícil saber qué te cubren y defender tu reclamación.`}],keyPoints:[`La carátula resume tu cobertura; las condiciones generales explican las reglas.`,`Revisa exclusiones y periodos de espera antes de contratar.`,`Ante un siniestro, avisa pronto y guarda documentos y número de reporte.`,`Si hay problemas, reclama en la UNE de la aseguradora y luego en CONDUSEF.`]}]},{id:`m11`,title:`Trabajo e ingresos`,description:`Tu primer empleo formal, tus prestaciones, el trabajo por tu cuenta y cómo hacer crecer lo que ganas.`,why:`Tu ingreso es la base de todo tu plan. Conocer tus derechos y cómo valorar tu trabajo te ayuda a ganar mejor y a protegerte desde tu primera chamba.`,lessons:[{id:`m11-l1`,title:`Tu primer empleo formal`,summary:`Contrato, periodo de prueba, documentos que te piden y tu alta en el IMSS.`,minutes:6,xp:60,objectives:[`Reconocer qué debe decir un contrato de trabajo`,`Preparar los documentos que te piden al contratarte`,`Explicar por qué importa que te den de alta en el IMSS`],steps:[{type:`intro`,title:`Qué es un empleo formal`,body:[`Un empleo formal es aquel en el que tu empleador te registra ante el IMSS y el SAT. Eso te da acceso a prestaciones como servicio médico, Afore e Infonavit.`,`La relación se apoya en un contrato. Ahí se escribe tu puesto, tu sueldo, tu horario, tu lugar de trabajo y si el contrato es por tiempo determinado o indeterminado.`,`Lee el contrato completo antes de firmar y pide una copia. Si algo no coincide con lo que te ofrecieron, pregunta antes de firmar.`],terms:[{term:`Contrato por tiempo indeterminado`,def:`No tiene fecha de fin. Es el tipo más común en un empleo estable.`},{term:`Contrato por tiempo determinado`,def:`Dura un periodo fijo o una obra específica, por ejemplo una temporada.`},{term:`Periodo de prueba`,def:`Tiempo al inicio en que la empresa evalúa si cumples con el puesto. La ley le pone límites.`}],callout:{tone:`tip`,text:`Toma foto o guarda en PDF tu contrato firmado. Te servirá si algún día hay una diferencia con tu sueldo o tus prestaciones.`}},{type:`choice`,prompt:`¿Qué dato NO suele venir en un contrato de trabajo?`,options:[`Tu sueldo`,`Tu horario`,`Lo que vas a gastar cada mes`,`Tu puesto`],correct:2,explain:`El contrato describe la relación laboral: puesto, sueldo, horario y lugar. Tu presupuesto personal no forma parte de él.`},{type:`truefalse`,statement:`Durante el periodo de prueba no tienes derecho a que te den de alta en el IMSS.`,answer:!1,explain:`Es un mito. Desde tu primer día de trabajo tienes derecho a tu alta en el IMSS, aunque estés a prueba.`},{type:`intro`,title:`Los documentos que te van a pedir`,body:[`Casi todas las empresas te piden lo mismo para contratarte. Tenerlo listo hace tu alta más rápida.`,`CURP: tu clave única de registro. RFC y Constancia de Situación Fiscal: los obtienes con el SAT. NSS: tu número de seguridad social del IMSS.`,`También suelen pedir comprobante de domicilio, identificación oficial y una cuenta bancaria a tu nombre para depositarte la nómina.`],example:{who:`Mariana, 21 años, recién egresada de la uni`,text:`Le ofrecieron su primer trabajo de oficina. Hizo una carpeta digital con CURP, RFC, constancia del SAT, NSS, comprobante de domicilio, INE y estado de cuenta, y la entregó el mismo día.`},callout:{tone:`dato`,text:`Puedes consultar tu CURP y tu NSS en línea de forma gratuita. La Constancia de Situación Fiscal la descargas desde el portal del SAT.`}},{type:`choice`,prompt:`La empresa te pide tu NSS. ¿Qué institución te lo asigna?`,options:[`El SAT`,`El IMSS`,`Tu banco`],correct:1,explain:`El Número de Seguridad Social lo asigna el IMSS y es el mismo toda tu vida, aunque cambies de trabajo.`},{type:`choice`,prompt:`¿Para qué te piden una cuenta bancaria a tu nombre?`,options:[`Para cobrarte una comisión de contratación`,`Para revisar tu historial de compras`,`Para depositarte tu sueldo`],correct:2,explain:`La mayoría de las empresas pagan la nómina por transferencia, así que necesitan una cuenta a tu nombre.`},{type:`intro`,title:`Tu alta en el IMSS`,body:[`Cuando te contratan formalmente, tu empleador debe darte de alta en el IMSS. Con eso tienes servicio médico, incapacidades pagadas y cuenta de Afore.`,`Puedes verificar que te dieron de alta consultando tus semanas cotizadas. Esas semanas se acumulan durante toda tu vida laboral.`,`Si te pagan, pero no te registran, te pierdes de prestaciones y semanas para tu retiro. Vale la pena revisarlo.`],terms:[{term:`Semanas cotizadas`,def:`Semanas en las que estuviste registrado en el IMSS. Cuentan para tu pensión.`},{term:`Salario base de cotización`,def:`Sueldo con el que te registran en el IMSS. De él dependen tus aportaciones.`}],callout:{tone:`alerta`,text:`Si te registran con un sueldo menor al real, tus aportaciones y futuras prestaciones serán menores. Revisa que coincida con tu recibo.`}},{type:`choice`,prompt:`¿Cómo puedes comprobar que tu empleo es formal?`,options:[`Porque te dieron un gafete`,`Consultando tus semanas cotizadas en el IMSS`,`Porque te pagan cada quincena`],correct:1,explain:`Un gafete o un pago puntual no prueban tu registro. Tus semanas cotizadas sí muestran que estás dado de alta.`},{type:`truefalse`,statement:`Tu NSS cambia cada vez que entras a una nueva empresa.`,answer:!1,explain:`Es un mito. Tu NSS es uno solo y te acompaña en todos tus empleos formales.`},{type:`choice`,prompt:`Tu recibo dice que ganas $10,000 al mes, pero en el IMSS apareces con un salario menor. ¿Qué te conviene hacer?`,options:[`Nada, no afecta en nada`,`Preguntar en Recursos Humanos y pedir que se corrija`,`Renunciar ese mismo día`],correct:1,explain:`Un registro con salario menor reduce tus aportaciones y prestaciones. Preguntar primero es un paso sencillo y razonable.`}],keyPoints:[`Lee tu contrato antes de firmar y guarda una copia.`,`Ten listos CURP, RFC, Constancia de Situación Fiscal, NSS, comprobante de domicilio y cuenta bancaria.`,`Tienes derecho al alta en el IMSS desde tu primer día, incluso a prueba.`,`Revisa tus semanas cotizadas para confirmar que tu empleo es formal.`]},{id:`m11-l2`,title:`Prestaciones de ley`,summary:`Aguinaldo, vacaciones, prima vacacional, IMSS, Infonavit, Afore y reparto de utilidades.`,minutes:7,xp:70,objectives:[`Identificar las prestaciones mínimas que da la ley`,`Calcular tu prima vacacional y tu aguinaldo`,`Distinguir para qué sirven IMSS, Infonavit y Afore`],steps:[{type:`intro`,title:`Aguinaldo y vacaciones`,body:[`Las prestaciones de ley son beneficios mínimos que todo empleo formal debe darte. Tu empresa puede dar más, pero nunca menos.`,`El aguinaldo es de al menos 15 días de salario y se paga antes del 20 de diciembre. Si no trabajaste el año completo, te toca la parte proporcional.`,`Desde 2023, después de tu primer año de trabajo tienes al menos 12 días de vacaciones pagadas. Los días aumentan conforme acumulas antigüedad.`],terms:[{term:`Aguinaldo`,def:`Pago anual de al menos 15 días de salario, antes del 20 de diciembre.`},{term:`Prima vacacional`,def:`Pago extra de al menos 25% del salario de tus días de vacaciones.`},{term:`Proporcional`,def:`La parte que te toca según el tiempo que trabajaste en el año.`}],callout:{tone:`dato`,text:`Por ley, la prima vacacional es de al menos 25% sobre el salario que corresponde a tus días de vacaciones.`}},{type:`choice`,prompt:`¿Cuántos días de vacaciones tienes como mínimo después de tu primer año?`,options:[`6 días`,`10 días`,`12 días`],correct:2,explain:`Con la reforma de 2023, el mínimo tras el primer año es de 12 días, y aumenta con la antigüedad.`},{type:`choice`,prompt:`Trabajaste solo 6 meses del año. ¿Qué pasa con tu aguinaldo?`,options:[`No te toca nada`,`Te toca la parte proporcional`,`Te toca el doble por ser nuevo`],correct:1,explain:`Si no completaste el año, recibes la parte proporcional: por 6 meses, aproximadamente la mitad de 15 días.`},{type:`intro`,title:`Calcula tu prima vacacional`,body:[`Para calcular la prima, primero saca el pago de tus días de vacaciones: salario diario × días de vacaciones.`,`Luego multiplica ese resultado por 25%, que es el mínimo. Ese es el dinero extra que recibes además de tu sueldo normal.`,`Revisa en tu recibo de nómina que aparezca. A veces viene como "prima vacacional" en tus percepciones.`],example:{who:`Diego, 23 años, primer año en un almacén`,text:`Gana $350 diarios y ya cumplió un año, así que le tocan 12 días de vacaciones con prima de 25%.`,rows:[{label:`Pago de vacaciones ($350 × 12)`,amount:4200,tag:`Prestación`},{label:`Prima vacacional (25% de $4,200)`,amount:1050,tag:`Extra`},{label:`Aguinaldo mínimo ($350 × 15)`,amount:5250,tag:`Prestación`}]},callout:{tone:`tip`,text:`Anota en tu calendario cuándo te toca la prima y el aguinaldo. Así puedes decidir antes qué parte ahorrar.`}},{type:`choice`,prompt:`Ganas $400 diarios y te tocan 12 días de vacaciones. ¿Cuál es tu prima vacacional mínima?`,options:[`$1,000`,`$4,800`,`$1,200`,`$480`],correct:2,explain:`$400 × 12 = $4,800 por tus vacaciones. El 25% de $4,800 es $1,200.`},{type:`truefalse`,statement:`Si tomas tus vacaciones, ya no te pagan esos días.`,answer:!1,explain:`Es un mito. Las vacaciones son pagadas y, además, recibes la prima vacacional.`},{type:`intro`,title:`IMSS, Infonavit, Afore y PTU`,body:[`El IMSS te da servicio médico, incapacidades y otras coberturas. La Afore guarda tu ahorro para el retiro. Las dos se alimentan con aportaciones de tu empleo.`,`Tu empleador aporta 5% de tu salario a Infonavit. Ese dinero forma tu subcuenta de vivienda y puede servirte para un crédito o ahorro para casa.`,`La PTU es el reparto de utilidades: si la empresa tuvo ganancias, una parte se reparte entre quienes trabajan ahí. No todas las empresas están obligadas y el monto varía.`],terms:[{term:`Infonavit`,def:`Instituto que administra tu ahorro para vivienda y otorga créditos para casa.`},{term:`PTU`,def:`Participación de los trabajadores en las utilidades: tu parte de las ganancias de la empresa.`}]},{type:`choice`,prompt:`Tu sueldo mensual registrado es $12,000. ¿Cuánto aporta tu empleador al mes a Infonavit?`,options:[`$500`,`$1,200`,`$600`],correct:2,explain:`El patrón aporta 5% de tu salario: $12,000 × 0.05 = $600 al mes.`},{type:`choice`,prompt:`¿Qué prestación está pensada para tu retiro?`,options:[`La Afore`,`El aguinaldo`,`La prima vacacional`],correct:0,explain:`La Afore administra tu cuenta individual de retiro. El aguinaldo y la prima son pagos que recibes en el año.`},{type:`truefalse`,statement:`Todas las empresas pagan exactamente la misma PTU cada año.`,answer:!1,explain:`Es un mito. La PTU depende de las ganancias de cada empresa, así que cambia de un lugar a otro y de un año a otro.`}],keyPoints:[`Aguinaldo: al menos 15 días de salario antes del 20 de diciembre.`,`Tras el primer año: al menos 12 días de vacaciones y prima de 25% o más.`,`Tu empleador aporta 5% de tu salario a Infonavit; la Afore guarda tu retiro.`,`La PTU depende de las ganancias de la empresa.`]},{id:`m11-l3`,title:`Trabajo informal, por app y freelance`,summary:`Ventajas y riesgos de trabajar por tu cuenta y cómo protegerte sin prestaciones.`,minutes:7,xp:70,objectives:[`Comparar ventajas y riesgos del trabajo por tu cuenta`,`Calcular un fondo de emergencia para ingresos variables`,`Planear tu propia protección de salud y retiro`],steps:[{type:`intro`,title:`Mucha gente trabaja así`,body:[`Repartir con una app, hacer diseños por encargo, dar clases o vender en tu colonia son formas reales de ganar dinero. Mucha gente joven en México empieza así.`,`La gran ventaja es la flexibilidad: decides horarios, puedes combinarlo con la escuela y probar cosas distintas.`,`El reto es que, en muchos casos, no tienes prestaciones automáticas: ni aguinaldo, ni vacaciones pagadas, ni Afore con aportes de un patrón.`],terms:[{term:`Trabajo informal`,def:`Trabajo sin registro ante el IMSS ni contrato formal. No da prestaciones de ley.`},{term:`Freelance`,def:`Trabajar por proyecto para distintos clientes, sin ser empleado de planta.`},{term:`Ingreso variable`,def:`Dinero que cambia de un mes a otro según el trabajo que consigas.`}]},{type:`choice`,prompt:`¿Cuál es una ventaja común de trabajar por tu cuenta?`,options:[`Aguinaldo garantizado`,`Flexibilidad para organizar tu tiempo`,`Servicio médico automático`],correct:1,explain:`La flexibilidad es el gran atractivo. El aguinaldo y el servicio médico normalmente vienen de un empleo formal.`},{type:`truefalse`,statement:`Si trabajas por tu cuenta, no puedes ahorrar para tu retiro.`,answer:!1,explain:`Es un mito. Puedes registrarte en una Afore y hacer aportaciones voluntarias aunque no tengas patrón.`},{type:`intro`,title:`Ingresos que suben y bajan`,body:[`Con ingreso variable, un mes puede ir muy bien y el siguiente muy mal. Por eso conviene hacer tu presupuesto con un mes "flojo", no con tu mejor mes.`,`Tu fondo de emergencia también debe ser más grande. Si con empleo formal se suele sugerir un fondo de 3 meses de gastos, trabajando por tu cuenta conviene apuntar a 6.`,`Cuando te vaya bien, separa primero para el fondo, los impuestos y el retiro. Lo que sobra es para gastar sin culpa.`],example:{who:`Luis, 22 años, repartidor por app y estudiante`,text:`Sus ingresos de los últimos meses fueron muy distintos. Hace su presupuesto con el mes más bajo y apunta a un fondo de 6 meses.`,rows:[{label:`Mes bueno`,amount:9500,tag:`Variable`},{label:`Mes flojo`,amount:5500,tag:`Variable`},{label:`Gastos básicos al mes`,amount:5e3,tag:`Fijo`},{label:`Meta de fondo ($5,000 × 6)`,amount:3e4,tag:`Ahorro`}]},callout:{tone:`tip`,text:`En los meses buenos, aparta un porcentaje fijo apenas te paguen. Así el ahorro no depende de lo que sobre.`}},{type:`choice`,prompt:`Tus gastos básicos son $7,000 al mes y trabajas por tu cuenta. ¿Cuánto sería un fondo de emergencia de 6 meses?`,options:[`$21,000`,`$35,000`,`$42,000`],correct:2,explain:`$7,000 × 6 = $42,000. Con ingreso variable, un fondo más grande te da más tranquilidad.`},{type:`choice`,prompt:`Tus ingresos de tres meses fueron $6,000, $9,000 y $4,500. ¿Con cuál conviene hacer tu presupuesto?`,options:[`$9,000`,`$4,500`,`$19,500`],correct:1,explain:`Usar el mes más bajo, $4,500, te protege. Si ganas más, el extra va a ahorro o metas.`},{type:`intro`,title:`Protégete por tu cuenta`,body:[`Sin patrón, tu protección depende de ti. Piensa en tres cosas: salud, retiro e impuestos.`,`Salud: el IMSS tiene esquemas de incorporación voluntaria, y si estudias en una escuela pública puedes tener el seguro facultativo. En años recientes también hubo cambios de ley para quienes trabajan por plataformas digitales; revisa con el IMSS qué te aplica.`,`Retiro: regístrate en una Afore y aporta aunque sea poco. Impuestos: si tus ingresos crecen, infórmate con el SAT sobre tus obligaciones.`],callout:{tone:`dato`,text:`Si estudias prepa o uni en una escuela pública, puedes tener el seguro facultativo del IMSS sin costo para ti.`}},{type:`choice`,prompt:`¿Qué es una buena forma de cubrir tu retiro si trabajas como freelance?`,options:[`Esperar a conseguir empleo formal algún día`,`Registrarte en una Afore y hacer aportaciones voluntarias`,`Confiar en que no lo vas a necesitar`],correct:1,explain:`Aportar por tu cuenta, aunque sea poco, aprovecha el tiempo y el interés compuesto.`},{type:`choice`,prompt:`Estudias en una universidad pública y haces trabajos freelance. ¿Qué opción de salud podrías tener?`,options:[`El seguro facultativo del IMSS`,`Ninguna, solo los empleados tienen acceso`,`El aguinaldo médico`],correct:0,explain:`Estudiantes de escuelas públicas de nivel medio superior y superior pueden tener el seguro facultativo del IMSS.`}],keyPoints:[`Trabajar por tu cuenta da flexibilidad, pero sin prestaciones automáticas.`,`Haz tu presupuesto con tu mes más bajo.`,`Apunta a un fondo de emergencia de unos 6 meses de gastos.`,`Cubre tu salud y tu retiro por tu cuenta: IMSS voluntario o facultativo y Afore.`]},{id:`m11-l4`,title:`Emprender un pequeño negocio`,summary:`Costo, precio, ganancia y margen, y por qué separar el dinero del negocio.`,minutes:7,xp:70,objectives:[`Calcular el costo real de lo que vendes`,`Fijar un precio y calcular tu margen de ganancia`,`Separar el dinero personal del dinero del negocio`],steps:[{type:`intro`,title:`Costo, precio y ganancia`,body:[`Vender postres, stickers o accesorios puede ser una gran forma de ganar dinero. La clave es saber cuánto te cuesta cada cosa que vendes.`,`El costo incluye todo: materiales, empaque, envío y hasta una parte del gas o la luz. Si olvidas algo, crees que ganas más de lo que ganas.`,`La ganancia es el precio menos el costo. El margen es esa ganancia como porcentaje del precio.`],terms:[{term:`Costo unitario`,def:`Lo que te cuesta producir una sola pieza, sumando todo lo que usas.`},{term:`Ganancia`,def:`Precio de venta menos costo. Es lo que realmente te queda.`},{term:`Margen`,def:`Ganancia dividida entre el precio, en porcentaje. Te dice qué parte de cada venta es tuya.`}],example:{who:`Fer, 19 años, vende cupcakes en la uni`,text:`Con $192 de ingredientes hace 12 cupcakes, y cada empaque le cuesta $4. Los vende a $40.`,rows:[{label:`Ingredientes por pieza ($192 ÷ 12)`,amount:16,tag:`Variable`},{label:`Empaque por pieza`,amount:4,tag:`Variable`},{label:`Costo unitario`,amount:20},{label:`Precio de venta`,amount:40},{label:`Ganancia por pieza`,amount:20,tag:`Ganancia`}]}},{type:`choice`,prompt:`Fer gana $20 por cada cupcake que vende a $40. ¿Cuál es su margen?`,options:[`20%`,`40%`,`50%`,`200%`],correct:2,explain:`Margen = ganancia ÷ precio: $20 ÷ $40 = 0.5, es decir, 50%.`},{type:`choice`,prompt:`Si Fer vende 30 cupcakes en una semana, ¿cuánta ganancia obtiene?`,options:[`$600`,`$1,200`,`$400`],correct:0,explain:`$20 de ganancia × 30 piezas = $600. Las ventas totales serían $1,200, pero $600 se van en costos.`},{type:`intro`,title:`Cómo poner un buen precio`,body:[`Un precio sano cubre tu costo, paga tu tiempo y deja una ganancia. Si solo cubres materiales, en realidad estás trabajando gratis.`,`Revisa también cuánto cobran otros por algo parecido. No tienes que ser el más barato; puedes destacar por calidad, sabor o diseño.`,`Cuida los costos fijos, como una mesa en un bazar o publicidad. Esos se pagan aunque vendas poco.`],example:{who:`Ale, 17 años, vende stickers en prepa`,text:`Cada hoja de stickers le cuesta $10 entre papel y tinta, y la vende en $25. Pagó $300 por un lugar en un bazar.`,rows:[{label:`Ganancia por hoja ($25 − $10)`,amount:15,tag:`Ganancia`},{label:`Lugar en el bazar`,amount:300,tag:`Fijo`},{label:`Hojas para cubrir el bazar ($300 ÷ $15)`,amount:20}]},callout:{tone:`alerta`,text:`Vender mucho no siempre significa ganar mucho. Si tu precio apenas cubre el costo, más ventas solo significan más trabajo.`}},{type:`choice`,prompt:`Ale paga $300 por el bazar y gana $15 por hoja. ¿Cuántas hojas necesita vender para recuperar lo del bazar?`,options:[`15 hojas`,`20 hojas`,`30 hojas`],correct:1,explain:`$300 ÷ $15 = 20 hojas. A partir de la hoja 21 empieza a ganar.`},{type:`truefalse`,statement:`Si vendes más barato que todos, siempre ganas más.`,answer:!1,explain:`Es un mito. Un precio muy bajo puede dejarte casi sin ganancia, aunque vendas mucho.`},{type:`intro`,title:`Separa tu dinero del negocio`,body:[`Si mezclas lo que ganas del negocio con tu dinero personal, es muy difícil saber si el negocio funciona.`,`Lo más sencillo es tener una cuenta o un sobre aparte para el negocio. Desde ahí compras materiales y ahí guardas lo que vendes.`,`Después, págate un "sueldo" fijo a tu cuenta personal. Así el negocio guarda dinero para reponer materiales y crecer.`],callout:{tone:`dato`,text:`Si tu negocio crece, infórmate con el SAT sobre en qué régimen darte de alta. Hay opciones pensadas para personas con ingresos pequeños.`}},{type:`choice`,prompt:`Vendiste $2,000 este mes y te gastaste todo en salidas. ¿Cuál es el problema principal?`,options:[`Que salir con amigos está mal`,`Que vendiste muy poco`,`Que no quedó dinero para reponer materiales`],correct:2,explain:`Disfrutar está bien, pero las ventas incluyen tus costos. Sin separar, no tienes con qué comprar los materiales del siguiente lote.`},{type:`choice`,prompt:`¿Cuál es una buena práctica para manejar el dinero de tu negocio?`,options:[`Pagarte un sueldo fijo y dejar el resto en el negocio`,`Usar todo como si fuera dinero personal`,`No anotar nada para no complicarte`],correct:0,explain:`Un sueldo fijo te da orden y deja recursos para que el negocio siga funcionando.`}],keyPoints:[`Costo unitario = todo lo que usas para producir una pieza.`,`Ganancia = precio − costo. Margen = ganancia ÷ precio.`,`Un buen precio cubre costos, tu tiempo y deja ganancia.`,`Separa el dinero del negocio y págate un sueldo fijo.`]},{id:`m11-l5`,title:`Hacer crecer tus ingresos`,summary:`Habilidades, certificaciones, negociar sueldo con información y aprovechar becas.`,minutes:6,xp:60,objectives:[`Identificar habilidades que aumentan tu valor en el trabajo`,`Preparar una negociación de sueldo con información`,`Reconocer becas y apoyos que pueden impulsarte`],steps:[{type:`intro`,title:`Tu ingreso puede crecer`,body:[`Ahorrar ayuda, pero llega un punto en que lo que más mueve tu situación es ganar más. Y eso se puede trabajar poco a poco.`,`Las habilidades que la gente valora suben tu ingreso: idiomas, herramientas digitales, atención a clientes, ventas, redacción u oficios técnicos.`,`No importa desde dónde empieces. Cada habilidad nueva suma, y muchas se aprenden con cursos gratuitos o practicando.`],terms:[{term:`Certificación`,def:`Documento que comprueba que dominas una habilidad específica, emitido por una institución.`},{term:`Habilidades blandas`,def:`Cómo te comunicas, organizas y trabajas en equipo. También se valoran mucho.`}],callout:{tone:`tip`,text:`Revisa vacantes del puesto que te gustaría tener y anota qué habilidades se repiten. Esa es tu lista de qué aprender.`}},{type:`choice`,prompt:`Quieres un mejor puesto en atención a clientes. ¿Qué te conviene aprender primero?`,options:[`Lo que se repite en las vacantes de ese puesto`,`Cualquier curso, sin importar el tema`,`Nada, el sueldo sube solo con el tiempo`],correct:0,explain:`Las vacantes te dicen qué valoran los empleadores. Enfocarte ahí hace que tu esfuerzo rinda más.`},{type:`truefalse`,statement:`Solo las personas con título universitario pueden aumentar sus ingresos.`,answer:!1,explain:`Es un mito. Oficios, certificaciones, idiomas y experiencia también abren mejores oportunidades.`},{type:`intro`,title:`Negociar con información`,body:[`Negociar tu sueldo es normal y no es de mala educación. Lo importante es llegar con datos, no solo con una necesidad.`,`Investiga cuánto pagan por puestos parecidos en tu ciudad. Prepara una lista de tus logros con resultados concretos.`,`Pide un rango razonable y escucha. Si no hay aumento de sueldo, puedes negociar otras cosas: capacitación, horario o un plan para revisar en unos meses.`],example:{who:`Sofía, 25 años, asistente administrativa`,text:`Investigó sueldos de su puesto y llevó tres logros concretos. Pidió 10% de aumento sobre su sueldo de $9,000.`,rows:[{label:`Sueldo actual`,amount:9e3},{label:`Aumento de 10% al mes`,amount:900,tag:`Ingreso`},{label:`Diferencia en un año ($900 × 12)`,amount:10800,tag:`Ingreso`}]}},{type:`choice`,prompt:`Ganas $8,000 al mes y consigues un aumento de 15%. ¿Cuánto más ganas al año?`,options:[`$1,200`,`$9,600`,`$14,400`],correct:2,explain:`$8,000 × 0.15 = $1,200 al mes. $1,200 × 12 = $14,400 al año.`},{type:`choice`,prompt:`¿Qué argumento es más sólido para pedir un aumento?`,options:[`"Necesito más dinero porque todo está caro"`,`"Mi compañero gana más que yo"`,`"Reduje los tiempos de entrega 20% y el sueldo de este puesto en la ciudad es mayor"`],correct:2,explain:`Los resultados concretos y los datos del mercado muestran tu valor. Tus necesidades son reales, pero convencen menos en una negociación.`},{type:`intro`,title:`Becas y apoyos`,body:[`Hay becas del gobierno federal, de tu estado, de tu escuela y de fundaciones. Algunas son para estudiar y otras para capacitarte o hacer prácticas.`,`Una beca no solo es dinero: también puede ser un curso gratis, un intercambio o una certificación pagada.`,`Revisa convocatorias seguido, porque tienen fechas límite. Y nunca pagues por "asegurar" una beca.`],callout:{tone:`alerta`,text:`Las becas reales no te cobran por inscribirte ni piden tus contraseñas. Consulta siempre en sitios oficiales del gobierno o de tu escuela.`}},{type:`truefalse`,statement:`Si una beca te pide un pago para "apartar tu lugar", es una buena señal de que es seria.`,answer:!1,explain:`Es un mito. Las becas legítimas no cobran por apartar lugar. Es una señal común de fraude.`},{type:`choice`,prompt:`¿Dónde conviene buscar becas confiables?`,options:[`En mensajes reenviados por desconocidos`,`En sitios oficiales del gobierno y de tu escuela`,`En anuncios que prometen dinero inmediato`],correct:1,explain:`Las fuentes oficiales publican convocatorias reales con requisitos y fechas claras.`}],keyPoints:[`Aprender habilidades que se valoran es una de las mejores inversiones.`,`Negocia con datos del mercado y logros concretos.`,`Un aumento pequeño al mes se vuelve mucho dinero al año.`,`Busca becas en fuentes oficiales y nunca pagues por una.`]}]},{id:`m10`,title:`Impuestos y SAT`,description:`Para qué sirven los impuestos, cómo sacar tu RFC y e.firma, pedir facturas y qué saber si trabajas por tu cuenta.`,why:`En tu primer empleo te pedirán RFC y Constancia de Situación Fiscal. Entender lo básico del SAT te evita estrés, multas y fraudes.`,lessons:[{id:`m10-l1`,title:`¿Para qué pagamos impuestos?`,summary:`Qué financian los impuestos, la diferencia entre IVA e ISR y los que ya pagas.`,minutes:6,xp:60,objectives:[`Explicar qué financian los impuestos en México`,`Distinguir entre IVA e ISR`,`Calcular el IVA incluido en un precio`],steps:[{type:`intro`,title:`Lo que pagamos entre todos`,body:[`Los impuestos son contribuciones obligatorias que pagamos al gobierno. Con ellos se financian servicios públicos.`,`Por ejemplo: escuelas y universidades públicas, hospitales, becas, seguridad, carreteras, transporte y programas sociales.`,`En México, el Servicio de Administración Tributaria (SAT) es la autoridad que se encarga de recaudar los impuestos federales.`],terms:[{term:`Impuesto`,def:`Pago obligatorio al gobierno para financiar gastos y servicios públicos.`},{term:`SAT`,def:`Servicio de Administración Tributaria: la autoridad que recauda los impuestos federales.`},{term:`Contribuyente`,def:`Persona o empresa que tiene obligaciones fiscales, como pagar impuestos.`}]},{type:`choice`,prompt:`¿Cuál de estos servicios se financia en parte con impuestos?`,options:[`La renta de tu cuarto`,`Una universidad pública`,`Tu plan de celular`],correct:1,explain:`Las universidades públicas reciben recursos del presupuesto público, que sale en buena parte de los impuestos.`},{type:`truefalse`,statement:`Si no tengo trabajo formal, no pago ningún impuesto.`,answer:!1,explain:`Casi todos pagamos impuestos al consumir: el IVA viene incluido en muchos productos y servicios que compras.`},{type:`intro`,title:`IVA e ISR: los más conocidos`,body:[`El IVA (Impuesto al Valor Agregado) se paga al consumir. Lo pagas cuando compras muchos productos y servicios, aunque no lo veas por separado.`,`El ISR (Impuesto Sobre la Renta) se paga sobre lo que ganas: sueldo, honorarios, ventas de un negocio, entre otros ingresos.`,`Hay otros impuestos, como el IEPS, que se aplica a productos específicos como gasolina, bebidas azucaradas, alcohol y tabaco.`],callout:{tone:`dato`,text:`La tasa general del IVA en México es 16%. En la región fronteriza puede aplicarse una tasa de 8%.`}},{type:`choice`,prompt:`¿Qué impuesto se calcula sobre lo que ganas?`,options:[`IVA`,`IEPS`,`ISR`],correct:2,explain:`El ISR grava los ingresos. El IVA y el IEPS se pagan al consumir.`},{type:`choice`,prompt:`Compras algo de $1,000 antes de impuestos con IVA de 16%. ¿Cuánto pagas en total?`,options:[`$1,016`,`$1,160`,`$1,600`],correct:1,explain:`16% de $1,000 es $1,000 × 0.16 = $160. Entonces $1,000 + $160 = $1,160.`},{type:`intro`,title:`Impuestos incluidos en los precios`,body:[`En los precios al público normalmente ya viene incluido el IVA. Por eso no lo notas al pagar en la tiendita o el súper.`,`En tu ticket o factura a veces aparece desglosado: el subtotal (precio sin IVA) y el IVA por separado.`,`Si un precio dice "más IVA", el total que pagarás será mayor al que ves. Pregunta siempre el precio final.`],example:{who:`Ximena, 22 años, uni y diseño freelance`,text:`Compra una tableta gráfica. Su ticket desglosa el precio así (ejemplo con IVA de 16%):`,rows:[{label:`Subtotal (sin IVA)`,amount:2500},{label:`IVA 16%`,amount:400,tag:`Fijo`},{label:`Total pagado`,amount:2900}]},callout:{tone:`tip`,text:`Si un precio es "más IVA", multiplica por 1.16 para saber el total aproximado con la tasa general.`}},{type:`choice`,prompt:`Pagaste $116 por algo que incluye IVA de 16%. ¿Cuánto fue el IVA?`,options:[`$16`,`$18.56`,`$11.60`],correct:0,explain:`Si el total incluye IVA, el precio sin IVA es $116 ÷ 1.16 = $100. El IVA es $116 − $100 = $16.`},{type:`truefalse`,statement:`Un precio que dice "más IVA" ya es el precio final que pagarás.`,answer:!1,explain:`"Más IVA" significa que al precio mostrado se le sumará el impuesto, así que pagarás más.`}],keyPoints:[`Los impuestos financian servicios públicos como escuelas, salud y seguridad.`,`El IVA se paga al consumir; el ISR, sobre lo que ganas.`,`La tasa general del IVA es 16% y suele venir incluida en el precio.`,`Si dice "más IVA", el total será mayor: pregunta el precio final.`]},{id:`m10-l2`,title:`RFC, e.firma y Constancia de Situación Fiscal`,summary:`Qué son, para qué sirven, cómo obtenerlos y por qué te los piden al trabajar.`,minutes:7,xp:70,objectives:[`Explicar para qué sirven el RFC, la e.firma y la Constancia`,`Reconocer cómo obtener tu RFC con tu CURP en el SAT`,`Aplicar medidas para proteger tu e.firma y tu contraseña`],steps:[{type:`intro`,title:`Tu RFC: tu identificación ante el SAT`,body:[`El RFC (Registro Federal de Contribuyentes) es la clave que te identifica ante el SAT. Para personas físicas tiene 13 caracteres.`,`Se forma con letras de tu nombre, tu fecha de nacimiento y una homoclave que asigna el SAT.`,`Puedes inscribirte al RFC con tu CURP desde el portal del SAT. Tener RFC no significa que debas pagar impuestos por sí solo: solo te registra.`],terms:[{term:`RFC`,def:`Registro Federal de Contribuyentes: tu clave única ante el SAT.`},{term:`Homoclave`,def:`Los últimos 3 caracteres del RFC, que asigna el SAT para evitar claves repetidas.`},{term:`CURP`,def:`Clave Única de Registro de Población. La necesitas para inscribirte al RFC.`}]},{type:`choice`,prompt:`¿Qué documento necesitas para inscribirte al RFC en el portal del SAT?`,options:[`Tu credencial de la escuela`,`Un estado de cuenta bancario`,`Tu CURP`],correct:2,explain:`La inscripción al RFC para personas físicas se puede hacer con tu CURP en el portal del SAT.`},{type:`truefalse`,statement:`Si saco mi RFC, automáticamente tendré que pagar impuestos aunque no tenga ingresos.`,answer:!1,explain:`El RFC solo te registra. Tus obligaciones dependen de si tienes ingresos y de qué tipo son.`},{type:`intro`,title:`Constancia y primer empleo`,body:[`La Constancia de Situación Fiscal es un documento del SAT con tus datos fiscales: nombre, RFC, código postal de tu domicilio fiscal y régimen.`,`En tu primer empleo formal te la piden para darte de alta y para emitir tus recibos de nómina, que son facturas electrónicas.`,`Tus datos deben coincidir exactamente con los del SAT. Si hay un error en tu nombre o código postal, la nómina puede salir mal.`],example:{who:`Emilio, 22 años, recién egresado`,text:`Lo contrataron como practicante. Antes de su primer pago, recursos humanos le pidió RFC, CURP, NSS y su Constancia de Situación Fiscal.`,rows:[{label:`Primer pago quincenal (ejemplo)`,amount:4500,tag:`Fijo`}]},callout:{tone:`dato`,text:`Si trabajas con sueldo, tu régimen fiscal suele ser "Sueldos y salarios e ingresos asimilados a salarios". Tu patrón te retiene el ISR.`}},{type:`choice`,prompt:`¿Para qué te piden la Constancia de Situación Fiscal en un empleo?`,options:[`Para revisar tu historial de crédito`,`Para emitir tus recibos de nómina con tus datos fiscales correctos`,`Para abrirte una cuenta de ahorro`],correct:1,explain:`Tu patrón necesita tu RFC, nombre, código postal y régimen tal como aparecen en el SAT para timbrar tu nómina.`},{type:`choice`,prompt:`Emilio gana $4,500 por quincena. ¿Cuánto es su sueldo bruto al mes?`,options:[`$4,500`,`$13,500`,`$9,000`],correct:2,explain:`Un mes tiene dos quincenas: $4,500 × 2 = $9,000. El sueldo neto será menor por retenciones como ISR e IMSS.`},{type:`intro`,title:`e.firma: tu firma digital`,body:[`La e.firma es tu firma electrónica ante el SAT. Tiene la misma validez que tu firma autógrafa para trámites fiscales y algunos otros trámites.`,`Generalmente se tramita con cita en una oficina del SAT, con identificación oficial y tu CURP. Te entregan archivos (.cer y .key) y tú defines una contraseña.`,`Es distinta de la Contraseña del SAT, que sirve para entrar al portal y hacer trámites más sencillos. La e.firma tiene vigencia, así que revisa cuándo vence.`],callout:{tone:`alerta`,text:`Nunca compartas tus archivos de e.firma ni tu contraseña. El SAT no te los pedirá por correo, mensaje o llamada. Si alguien los tiene, puede hacer trámites a tu nombre.`},terms:[{term:`e.firma`,def:`Firma electrónica avanzada del SAT, con validez legal como tu firma a mano.`},{term:`Contraseña del SAT`,def:`Clave para entrar al portal del SAT y hacer trámites básicos.`}]},{type:`choice`,prompt:`Te llega un correo "del SAT" que pide tus archivos .key y tu contraseña para "evitar una multa". ¿Qué haces?`,options:[`No los envío y lo reporto como posible fraude`,`Los envío rápido para evitar la multa`,`Envío solo la contraseña`],correct:0,explain:`El SAT no pide tus archivos de e.firma ni tu contraseña por correo. Es un intento de phishing.`},{type:`truefalse`,statement:`La e.firma y la Contraseña del SAT son lo mismo.`,answer:!1,explain:`La Contraseña sirve para entrar al portal y trámites sencillos. La e.firma es una firma electrónica con validez legal y se usa para trámites más importantes.`}],keyPoints:[`El RFC te identifica ante el SAT y se obtiene con tu CURP.`,`La Constancia de Situación Fiscal muestra tus datos fiscales; te la piden al contratarte.`,`La e.firma tiene validez legal: protégela como tu firma a mano.`,`El SAT nunca te pedirá tus archivos o contraseñas por correo o mensaje.`]},{id:`m10-l3`,title:`Facturas electrónicas (CFDI)`,summary:`Qué es una factura electrónica, cuándo pedirla, qué datos dar y cómo verificarla.`,minutes:6,xp:60,objectives:[`Explicar qué es un CFDI y para qué sirve`,`Identificar los datos que necesitas para pedir una factura`,`Verificar una factura en el portal del SAT`],steps:[{type:`intro`,title:`Qué es una factura electrónica`,body:[`En México, las facturas son electrónicas y se llaman CFDI (Comprobante Fiscal Digital por Internet). Son un archivo XML y suelen venir con su versión en PDF.`,`Una factura comprueba una operación: quién vendió, quién compró, qué, cuánto y cuánto impuesto se pagó.`,`Tu recibo de nómina también es un CFDI. Por eso tu patrón necesita tus datos fiscales correctos.`],terms:[{term:`CFDI`,def:`Comprobante Fiscal Digital por Internet: la factura electrónica en México.`},{term:`XML`,def:`El archivo oficial de la factura. El PDF es solo una representación impresa.`},{term:`Folio fiscal`,def:`Código único de cada factura, también llamado UUID. Sirve para verificarla.`}]},{type:`choice`,prompt:`¿Cuál es el archivo oficial de una factura electrónica?`,options:[`La foto del ticket`,`El correo de confirmación`,`El XML`],correct:2,explain:`El XML es el comprobante fiscal. El PDF y el ticket ayudan a leerlo, pero el XML es el oficial.`},{type:`truefalse`,statement:`Mi recibo de nómina también es una factura electrónica.`,answer:!0,explain:`Los recibos de nómina se emiten como CFDI. Por eso es importante que tus datos fiscales estén bien.`},{type:`intro`,title:`Cuándo pedirla y qué datos dar`,body:[`Pide factura cuando necesites comprobar un gasto: si lo vas a deducir, si te lo reembolsa tu trabajo o si es un gasto de tu actividad propia.`,`Algunos gastos personales, como consultas médicas o colegiaturas, pueden ser deducciones en tu declaración anual si tienes factura y cumples ciertos requisitos, como pagar con medios electrónicos.`,`Para pedirla necesitas los datos de tu Constancia de Situación Fiscal: RFC, nombre completo, código postal, régimen fiscal y el uso que le darás a la factura.`],example:{who:`Andrea, 23 años, pasante con contrato`,text:`Compró lentes graduados con receta y pagó con tarjeta. Pidió factura para guardarla para su declaración anual (ejemplo):`,rows:[{label:`Subtotal de los lentes`,amount:800},{label:`IVA 16%`,amount:128,tag:`Fijo`},{label:`Total de la factura`,amount:928}]},callout:{tone:`tip`,text:`Guarda una foto o el PDF de tu Constancia en tu celular. Así pides facturas en segundos y sin errores.`}},{type:`choice`,prompt:`En el ejemplo de Andrea, ¿cómo se obtiene el IVA de $128?`,options:[`$928 × 0.16`,`$800 × 0.16`,`$800 + $16`],correct:1,explain:`El IVA se calcula sobre el subtotal: $800 × 0.16 = $128. Luego $800 + $128 = $928.`},{type:`choice`,prompt:`¿Qué datos te suelen pedir para emitirte una factura?`,options:[`RFC, nombre, código postal, régimen fiscal y uso del CFDI`,`Tu número de tarjeta y su código de seguridad`,`Tu contraseña del SAT`],correct:0,explain:`Esos datos vienen en tu Constancia de Situación Fiscal. Nunca necesitas dar contraseñas ni datos de tu tarjeta para facturar.`},{type:`intro`,title:`Verifica tus facturas`,body:[`Una factura falsa o mal hecha no te sirve para deducir ni comprobar gastos.`,`En el portal del SAT hay un servicio para verificar facturas electrónicas. Ingresas el folio fiscal, el RFC de quien la emite y de quien la recibe, y te dice si es válida.`,`Revisa también que tus datos estén bien escritos y que el monto coincida con lo que pagaste.`],callout:{tone:`alerta`,text:`Si te ofrecen "vender facturas" de gastos que no hiciste, es ilegal. Las facturas deben reflejar operaciones reales.`}},{type:`choice`,prompt:`¿Qué dato clave usas para verificar una factura en el portal del SAT?`,options:[`El nombre del cajero`,`El horario de la tienda`,`El folio fiscal (UUID)`],correct:2,explain:`El folio fiscal identifica de forma única cada CFDI y se usa, junto con los RFC, para verificarlo.`},{type:`truefalse`,statement:`Pedir factura solo sirve a las empresas.`,answer:!1,explain:`A ti también te sirve: para deducciones personales, reembolsos de tu trabajo, garantías o si trabajas por tu cuenta.`}],keyPoints:[`El CFDI es la factura electrónica; el archivo oficial es el XML.`,`Pide factura cuando necesites comprobar o deducir un gasto.`,`Para facturar usas los datos de tu Constancia de Situación Fiscal.`,`Verifica tus facturas en el portal del SAT con el folio fiscal.`]},{id:`m10-l4`,title:`Impuestos si trabajas por tu cuenta o vendes en línea`,summary:`Qué cambia cuando tienes ingresos propios o vendes por plataformas digitales.`,minutes:6,xp:60,objectives:[`Reconocer cuándo tus ingresos propios generan obligaciones fiscales`,`Explicar qué significa que una plataforma te retenga impuestos`,`Identificar dónde buscar orientación oficial del SAT`],steps:[{type:`intro`,title:`Ingresos propios = obligaciones propias`,body:[`Cuando trabajas con sueldo, tu patrón calcula y retiene tu ISR. Cuando trabajas por tu cuenta, esa responsabilidad es tuya.`,`Si das clases, diseñas, programas, vendes productos o prestas servicios de forma habitual, esos ingresos pueden generar obligaciones fiscales.`,`Normalmente implican inscribirte en un régimen fiscal adecuado, emitir facturas cuando corresponda y presentar declaraciones.`],terms:[{term:`Régimen fiscal`,def:`La categoría del SAT que define cómo pagas impuestos según tu tipo de ingreso.`},{term:`Declaración`,def:`El reporte que presentas al SAT sobre tus ingresos, gastos e impuestos.`},{term:`Retención`,def:`Impuesto que alguien más descuenta de tu pago y entrega al SAT por ti.`}]},{type:`choice`,prompt:`Trabajas con sueldo en una empresa. ¿Quién calcula y retiene tu ISR mes a mes?`,options:[`Tú, cada día`,`Tu patrón`,`Tu banco`],correct:1,explain:`En sueldos y salarios, el patrón retiene el ISR y lo entera al SAT. Por cuenta propia, esa tarea pasa a ti.`},{type:`truefalse`,statement:`Si cobro por transferencia o en efectivo, no tengo que preocuparme por impuestos.`,answer:!1,explain:`La forma de cobro no cambia la naturaleza del ingreso. Si tienes una actividad propia, puede generar obligaciones fiscales.`},{type:`intro`,title:`Vender o trabajar por plataformas`,body:[`Si vendes productos o servicios por plataformas digitales (de venta en línea, de hospedaje o de transporte y entregas), hay reglas fiscales específicas.`,`En muchos casos, la plataforma retiene una parte de impuestos de cada pago y la entrega al SAT. Eso aparece en tu reporte de pagos o constancia de retenciones.`,`Aun con retenciones, revisa si tienes que presentar declaraciones o hacer otros trámites. Depende de tu situación.`],example:{who:`Renata, 24 años, vende postres y accesorios hechos a mano en línea`,text:`Revisa su reporte del mes en la plataforma (cifras y retención ilustrativas, no tasas reales):`,rows:[{label:`Ventas del mes`,amount:6e3},{label:`Impuestos retenidos por la plataforma`,amount:300,tag:`Cuidado`},{label:`Comisión de la plataforma`,amount:600,tag:`Variable`},{label:`Lo que recibe Renata`,amount:5100}]},callout:{tone:`tip`,text:`Descarga y guarda los reportes de pagos y retenciones de cada plataforma. Te servirán para tus declaraciones.`}},{type:`choice`,prompt:`En el ejemplo de Renata, ¿cómo se obtiene lo que recibe?`,options:[`$6,000 − $300 − $600`,`$6,000 − $300`,`$6,000 + $300`],correct:0,explain:`$6,000 − $300 de retención − $600 de comisión = $5,100.`},{type:`choice`,prompt:`¿Qué significa que una plataforma te "retenga" impuestos?`,options:[`Que te cobra una multa`,`Que tu dinero queda congelado para siempre`,`Que descuenta una parte de tu pago y la entrega al SAT por ti`],correct:2,explain:`La retención es un adelanto de impuestos: la plataforma lo descuenta y lo paga al SAT a tu nombre.`},{type:`intro`,title:`Busca orientación oficial`,body:[`Las reglas fiscales cambian y dependen de tu tipo de actividad y de cuánto ganas. No hay una respuesta única para todos.`,`El SAT ofrece orientación gratuita por su portal, por teléfono, por chat y con cita en sus oficinas. Ahí te dicen qué régimen te corresponde.`,`Si tu actividad crece, considera asesoría de una persona contadora. Cuesta, pero puede ahorrarte errores y multas.`],callout:{tone:`alerta`,text:`Desconfía de quien promete "no pagar nada de impuestos" con trucos. Evadir impuestos puede traer multas y problemas legales.`}},{type:`choice`,prompt:`Empiezas a dar clases particulares y no sabes qué régimen te toca. ¿Qué es lo más recomendable?`,options:[`Seguir el consejo de un video sin fuente`,`Ignorarlo hasta que el SAT te contacte`,`Consultar la orientación gratuita del SAT o a una persona contadora`],correct:2,explain:`El régimen depende de tu actividad y tus ingresos. Las fuentes oficiales o profesionales te dan una respuesta para tu caso.`},{type:`truefalse`,statement:`Las reglas fiscales para quien trabaja por su cuenta son iguales para todos y nunca cambian.`,answer:!1,explain:`Dependen del tipo de actividad y de los ingresos, y pueden cambiar con el tiempo. Por eso conviene consultar fuentes oficiales actualizadas.`}],keyPoints:[`Si tienes ingresos por tu cuenta, tú eres responsable de tus obligaciones fiscales.`,`Algunas plataformas digitales retienen impuestos de tus ventas o cobros.`,`Guarda tus reportes de pagos y retenciones.`,`Busca orientación gratuita en el SAT antes de adivinar tu régimen.`]}]},{id:`m6`,title:`Inversión básica`,description:`Riesgo, inflación, diversificación, instrumentos comunes en México y cómo detectar fraudes. Sin promesas de rendimiento.`,why:`Empezar joven te da algo valioso: tiempo. Entender riesgo e inflación te ayuda a proteger tu dinero y a no caer en promesas falsas.`,lessons:[{id:`m6-l1`,title:`Riesgo y rendimiento`,summary:`Qué es invertir, por qué más rendimiento implica más riesgo y qué tener antes.`,minutes:6,xp:60,objectives:[`Explicar la relación entre riesgo y rendimiento`,`Reconocer qué conviene tener antes de invertir`,`Identificar tu tolerancia al riesgo según tu plazo y metas`],steps:[{type:`intro`,title:`Más rendimiento posible, más riesgo`,body:[`Invertir es poner tu dinero en algo que podría crecer con el tiempo, aceptando que también podría bajar de valor.`,`Por lo general, las opciones con mayor rendimiento esperado también tienen más riesgo. "Esperado" significa posible, no seguro.`,`Nada legítimo garantiza ganancias altas sin riesgo. Si alguien te lo promete, desconfía.`],terms:[{term:`Rendimiento`,def:`Lo que gana tu inversión, normalmente expresado como porcentaje al año.`},{term:`Riesgo`,def:`La posibilidad de que el resultado sea distinto al esperado, incluso de perder dinero.`},{term:`Volatilidad`,def:`Qué tanto sube y baja el precio de una inversión en poco tiempo.`}]},{type:`choice`,prompt:`Alguien te promete duplicar tu dinero en un mes, sin riesgo. ¿Qué piensas?`,options:[`Es una gran oportunidad`,`Es normal en inversiones`,`Es una señal clara de posible fraude`],correct:2,explain:`Ninguna inversión legítima puede garantizar rendimientos tan altos y sin riesgo. Esa promesa es típica de fraudes.`},{type:`truefalse`,statement:`Si una inversión da más rendimiento, seguro es mejor.`,answer:!1,explain:`Más rendimiento posible suele venir con más riesgo. Lo "mejor" depende de tu meta, tu plazo y cuánto puedes tolerar perder.`},{type:`intro`,title:`Antes de invertir: tu base`,body:[`Invertir funciona mejor cuando tu base está firme. Primero, un fondo de emergencia para imprevistos.`,`Segundo, revisa tus deudas caras. Si tu tarjeta cobra una tasa alta, pagarla suele "rendir" más que casi cualquier inversión.`,`Tercero, invierte dinero que no necesitarás pronto. Así no tendrás que vender en mal momento.`],example:{who:`Valeria, 21 años, uni y trabajo de medio tiempo`,text:`Gana $6,000 al mes. Antes de invertir arma su base. Sus números (ejemplo):`,rows:[{label:`Fondo de emergencia ya ahorrado`,amount:9e3,tag:`Ahorro`},{label:`Saldo pendiente de tarjeta`,amount:2500,tag:`Cuidado`},{label:`Lo que podría invertir al mes`,amount:500,tag:`Ahorro`}]},callout:{tone:`tip`,text:`Puedes empezar a invertir con poco. Lo importante es la constancia y entender en qué metes tu dinero.`}},{type:`choice`,prompt:`¿Qué conviene tener antes de empezar a invertir?`,options:[`Una tarjeta al límite`,`Un fondo de emergencia`,`Muchas compras a meses sin intereses`],correct:1,explain:`Con un fondo de emergencia no tendrás que vender tus inversiones con prisa, quizá con pérdida, si surge un imprevisto.`},{type:`choice`,prompt:`Valeria debe $2,500 en una tarjeta con tasa alta. ¿Qué suele convenir primero?`,options:[`Invertir esos $2,500 en algo arriesgado para pagar después`,`Pagar la tarjeta y luego empezar a invertir`,`Pedir otro préstamo para invertir`],correct:1,explain:`Una deuda con tasa alta crece más rápido de lo que normalmente crece una inversión. Pagarla primero es una "ganancia" segura.`},{type:`intro`,title:`Tu tolerancia al riesgo`,body:[`Tolerancia al riesgo es cuánta subida y bajada puedes aguantar sin perder el sueño ni vender por miedo.`,`Depende de tu plazo: si necesitas el dinero en meses, conviene poco riesgo. Si es para dentro de muchos años, puedes aguantar más altibajos.`,`También depende de tu situación y tu carácter. No hay una respuesta única ni correcta para todos.`],callout:{tone:`alerta`,text:`Una inversión puede valer menos que lo que pusiste. Solo arriesga lo que puedas dejar quieto sin afectar lo básico.`}},{type:`choice`,prompt:`Tu tolerancia al riesgo depende sobre todo de…`,options:[`Lo que hacen tus amigos`,`Lo que esté de moda en redes`,`Tus metas, tu plazo y tu situación`],correct:2,explain:`Cada persona decide según su contexto. Copiar a otros ignora tus propias necesidades.`},{type:`choice`,prompt:`Inviertes $2,000 y un año después valen $2,140. ¿Qué rendimiento tuviste?`,options:[`7%`,`14%`,`1.4%`],correct:0,explain:`Ganaste $2,140 − $2,000 = $140. Luego $140 ÷ $2,000 = 0.07, es decir, 7%.`},{type:`truefalse`,statement:`Para invertir necesitas tener mucho dinero.`,answer:!1,explain:`Hay instrumentos que aceptan montos bajos. Lo que sí necesitas es una base (fondo de emergencia) y entender el riesgo.`}],keyPoints:[`Más rendimiento posible casi siempre significa más riesgo.`,`Antes de invertir: fondo de emergencia y deudas caras bajo control.`,`Tu tolerancia al riesgo depende de tu plazo, tus metas y tu situación.`,`Nadie puede garantizar ganancias altas sin riesgo.`]},{id:`m6-l2`,title:`Inflación y rendimiento real`,summary:`Por qué los precios suben, cómo se mide y cómo calcular tu rendimiento real.`,minutes:6,xp:60,objectives:[`Explicar qué es la inflación y quién la mide en México`,`Calcular el rendimiento real aproximado de un ahorro`,`Reconocer por qué el dinero quieto pierde poder de compra`],steps:[{type:`intro`,title:`Cuando los precios suben`,body:[`La inflación es el aumento general de los precios. Con la misma cantidad de dinero compras menos con el tiempo.`,`No es que un solo producto suba: es el promedio de muchos bienes y servicios, como comida, transporte y renta.`,`Un poco de inflación es normal en una economía. El problema es cuando es alta o cuando tu dinero no crece al mismo ritmo.`],callout:{tone:`dato`,text:`En México, el INEGI mide la inflación con el Índice Nacional de Precios al Consumidor (INPC). Banxico tiene como meta una inflación anual de 3%, con un margen de ±1 punto.`},terms:[{term:`Inflación`,def:`Aumento generalizado y sostenido de los precios en un periodo.`},{term:`INPC`,def:`Índice que publica el INEGI para medir cómo cambian los precios de lo que consumen los hogares.`},{term:`Poder adquisitivo`,def:`Lo que realmente puedes comprar con tu dinero.`}]},{type:`choice`,prompt:`Si la inflación anual es 5% y tus ahorros no generan rendimiento, después de un año…`,options:[`Compran más`,`Compran lo mismo`,`Compran menos`],correct:2,explain:`Tienes los mismos pesos, pero los precios subieron, así que alcanzan para menos.`},{type:`choice`,prompt:`¿Qué institución publica el INPC?`,options:[`El IMSS`,`El INEGI`,`La SEP`],correct:1,explain:`El INEGI publica el índice de precios con el que se mide la inflación en México.`},{type:`intro`,title:`Rendimiento nominal vs. real`,body:[`El rendimiento nominal es el porcentaje que te anuncian, por ejemplo "8% anual".`,`El rendimiento real es lo que crece tu poder de compra. Se aproxima así: rendimiento real ≈ rendimiento nominal − inflación.`,`Si el rendimiento real es negativo, tu dinero crece en pesos pero compra menos que antes.`],example:{who:`Diego, 18 años, prepa y trabajo de fin de semana`,text:`Ahorra $5,000 en un instrumento con tasa ilustrativa de 8% anual. La inflación del año fue 4%.`,rows:[{label:`Ahorro inicial`,amount:5e3,tag:`Ahorro`},{label:`Ganancia nominal (8%)`,amount:400},{label:`Lo que "se comió" la inflación (4%)`,amount:200,tag:`Cuidado`},{label:`Ganancia real aproximada (4%)`,amount:200,tag:`Ahorro`}]}},{type:`choice`,prompt:`Un rendimiento de 7% anual con inflación de 5% da un rendimiento real aproximado de…`,options:[`12%`,`7%`,`2%`],correct:2,explain:`Rendimiento real ≈ nominal − inflación: 7% − 5% ≈ 2%.`},{type:`choice`,prompt:`Tu cuenta da 3% anual y la inflación es 4.5%. ¿Qué pasa con tu poder de compra?`,options:[`Baja alrededor de 1.5%`,`Sube 3%`,`Sube 7.5%`],correct:0,explain:`3% − 4.5% = −1.5%. Tienes más pesos, pero alcanzan para un poco menos que antes.`},{type:`truefalse`,statement:`Guardar el dinero en efectivo en casa lo mantiene a salvo de todo.`,answer:!1,explain:`Además del riesgo de robo o pérdida, el efectivo no genera rendimiento, así que la inflación reduce lo que puedes comprar con él.`},{type:`intro`,title:`Qué hacer con esto`,body:[`Cuando compares opciones de ahorro o inversión, compara contra la inflación, no solo contra cero.`,`Para tu fondo de emergencia, lo importante es que esté disponible y seguro; que al menos le gane un poco a la inflación es un plus.`,`Para metas largas, buscar instrumentos que puedan superar la inflación ayuda a que tu dinero no se quede atrás.`],callout:{tone:`tip`,text:`Revisa la inflación anual más reciente en el sitio del INEGI o de Banxico antes de comparar tasas.`}},{type:`choice`,prompt:`Un helado costaba $40 y con 5% de inflación anual sube igual que el promedio. ¿Cuánto costaría al año siguiente?`,options:[`$45`,`$42`,`$40.50`],correct:1,explain:`5% de $40 es $40 × 0.05 = $2. Entonces $40 + $2 = $42.`},{type:`truefalse`,statement:`Una tasa de 6% anual es buena sin importar la inflación.`,answer:!1,explain:`Depende: si la inflación es 2%, ganas alrededor de 4% real; si es 7%, tu poder de compra baja aproximadamente 1%.`}],keyPoints:[`La inflación hace que tu dinero compre menos con el tiempo.`,`El INEGI la mide con el INPC; Banxico busca una inflación de 3% anual.`,`Rendimiento real ≈ rendimiento nominal − inflación.`,`Compara cualquier tasa contra la inflación, no contra cero.`]},{id:`m6-l3`,title:`Diversificar y pensar en largo plazo`,summary:`Repartir tu dinero, elegir según tu plazo y no dejarte llevar por el pasado.`,minutes:6,xp:60,objectives:[`Explicar qué es diversificar y por qué reduce el riesgo`,`Relacionar el plazo de tu meta con el tipo de instrumento`,`Reconocer el error de decidir solo por rendimientos pasados`],steps:[{type:`intro`,title:`No todos los huevos en la misma canasta`,body:[`Diversificar es repartir tu dinero entre distintos instrumentos para que una sola pérdida no afecte todo.`,`Puedes diversificar por tipo de instrumento (deuda, acciones), por plazo y por sector o país.`,`Diversificar no elimina el riesgo, pero lo reduce y lo vuelve más manejable.`],example:{who:`Fer, 24 años, recién egresada con su primer empleo`,text:`Tiene $10,000 para invertir a largo plazo. Así los reparte (ejemplo ilustrativo, no recomendación):`,rows:[{label:`Deuda gubernamental (bajo riesgo)`,amount:5e3,tag:`Ahorro`},{label:`Fondo de inversión diversificado`,amount:3e3},{label:`Acciones (más volatilidad)`,amount:2e3,tag:`Riesgo`}]},terms:[{term:`Diversificar`,def:`Repartir tu dinero en distintas inversiones para no depender de una sola.`},{term:`Portafolio`,def:`El conjunto de todas tus inversiones.`}]},{type:`choice`,prompt:`Pones todo tu dinero en una sola criptomoneda. ¿Qué riesgo corres?`,options:[`Ninguno, porque es digital`,`Que gane demasiado`,`Si su precio cae, todo tu dinero se ve afectado`],correct:2,explain:`Concentrar todo en un solo instrumento muy volátil aumenta la posibilidad de perder mucho de golpe.`},{type:`choice`,prompt:`En el ejemplo de Fer, ¿qué porcentaje de su dinero está en acciones?`,options:[`20%`,`30%`,`50%`],correct:0,explain:`$2,000 ÷ $10,000 = 0.20, es decir, 20%.`},{type:`intro`,title:`El plazo cambia todo`,body:[`Corto plazo (menos de un año): necesitas que el dinero esté ahí cuando lo uses. Conviene poco riesgo y buena liquidez.`,`Largo plazo (varios años): hay tiempo para recuperarse de caídas, así que puedes considerar instrumentos con más altibajos.`,`El tiempo también deja trabajar al interés compuesto: las ganancias generan más ganancias.`],callout:{tone:`tip`,text:`Asigna cada meta a un plazo: viaje en 6 meses, laptop en 1 año, retiro en 40 años. Cada una puede ir en un instrumento distinto.`}},{type:`choice`,prompt:`Para una meta a 6 meses, ¿qué suele tener más sentido?`,options:[`Algo muy volátil`,`Un instrumento de bajo riesgo`,`Pedir prestado para invertir`],correct:1,explain:`En plazos cortos hay poco tiempo para recuperarse si el valor cae justo cuando necesitas el dinero.`},{type:`truefalse`,statement:`Si el mercado baja, lo mejor siempre es vender todo de inmediato.`,answer:!1,explain:`Vender por pánico convierte una baja temporal en pérdida real. Si tu plan es de largo plazo y diversificado, muchas veces conviene revisar con calma antes de decidir.`},{type:`intro`,title:`El pasado no garantiza el futuro`,body:[`Que un instrumento haya ganado mucho el año pasado no significa que vaya a repetirlo.`,`Entrar a algo solo porque "está subiendo" suele llevar a comprar caro y vender barato.`,`Mejor decide con un plan: tu meta, tu plazo, tu tolerancia al riesgo y la diversificación.`],callout:{tone:`alerta`,text:`Los rendimientos pasados no garantizan rendimientos futuros. Lo verás escrito en documentos de inversión serios.`}},{type:`choice`,prompt:`"Este fondo ganó 20% el año pasado, así que ganará 20% este año." Esta afirmación es…`,options:[`Correcta`,`Una ley financiera`,`Incorrecta: lo pasado no garantiza el futuro`],correct:2,explain:`Un buen año no asegura otro igual. Los resultados dependen de muchas condiciones que cambian.`},{type:`choice`,prompt:`¿Cuál es un ejemplo de diversificar?`,options:[`Repartir tu dinero entre deuda gubernamental, un fondo y algunas acciones`,`Comprar acciones de una sola empresa en tres días distintos`,`Poner todo en lo que más subió el mes pasado`],correct:0,explain:`Diversificar es combinar instrumentos distintos. Comprar lo mismo varias veces sigue siendo concentrar el riesgo.`}],keyPoints:[`Diversificar reduce el impacto de que una inversión salga mal.`,`Metas de corto plazo: bajo riesgo. Metas de largo plazo: puedes tolerar más altibajos.`,`Los rendimientos pasados no garantizan los futuros.`,`Decide con un plan, no por moda ni por pánico.`]},{id:`m6-l4`,title:`Instrumentos comunes en México`,summary:`CETES, fondos de inversión, acciones y ahorro voluntario en la Afore.`,minutes:7,xp:70,objectives:[`Describir CETES, fondos, acciones y ahorro voluntario en la Afore`,`Comparar instrumentos por liquidez, plazo y riesgo`,`Elegir un tipo de instrumento según el plazo de una meta`],steps:[{type:`intro`,title:`Tres preguntas para cualquier instrumento`,body:[`Antes de elegir dónde invertir, hazte tres preguntas: ¿qué tan rápido puedo sacar mi dinero?, ¿por cuánto tiempo lo dejo?, ¿cuánto puede bajar?`,`Eso es liquidez, plazo y riesgo. Ningún instrumento es el mejor en las tres a la vez.`,`En México hay opciones reguladas que aceptan montos bajos, así que puedes aprender empezando con poco.`],terms:[{term:`Liquidez`,def:`Qué tan rápido y fácil puedes convertir tu inversión en efectivo sin perder valor.`},{term:`Plazo`,def:`El tiempo que tu dinero queda invertido o que planeas dejarlo.`},{term:`Instrumento`,def:`El "vehículo" donde inviertes: un bono, un fondo, una acción, etc.`}]},{type:`choice`,prompt:`Tu fondo de emergencia debe poder usarse rápido. ¿Qué característica es la más importante?`,options:[`Alta volatilidad`,`Alta liquidez`,`Plazo de varios años`],correct:1,explain:`Una emergencia no espera. Necesitas poder sacar el dinero pronto y sin perder valor.`},{type:`intro`,title:`CETES: prestarle al gobierno`,body:[`Los CETES son instrumentos de deuda del Gobierno Federal: tú le prestas dinero y al final del plazo te lo regresa con un rendimiento.`,`Hay plazos como 28, 91, 182 y 364 días. La tasa cambia con las condiciones del mercado, así que revísala antes de invertir.`,`Se consideran de bajo riesgo porque los respalda el gobierno, y se pueden comprar desde montos bajos en la plataforma oficial del gobierno.`],example:{who:`Sofía, 20 años, uni con beca`,text:`Guarda parte de su beca en CETES a 28 días y reinvierte cada mes. Con una tasa ilustrativa de 10% anual:`,rows:[{label:`Monto invertido`,amount:3e3,tag:`Ahorro`},{label:`Rendimiento aproximado en un año (10%)`,amount:300},{label:`Total aproximado al año`,amount:3300,tag:`Ahorro`}]},callout:{tone:`dato`,text:`Los CETES no están protegidos por el IPAB (eso es para depósitos bancarios), pero los respalda el Gobierno Federal.`}},{type:`choice`,prompt:`Al comprar CETES, ¿a quién le estás prestando dinero?`,options:[`A una empresa privada`,`Al Gobierno Federal`,`A otros inversionistas`],correct:1,explain:`Los CETES son deuda del Gobierno Federal; por eso se consideran de bajo riesgo.`},{type:`choice`,prompt:`Inviertes $1,000 a una tasa ilustrativa de 9% anual durante un año completo. ¿Cuánto ganas aproximadamente, antes de impuestos?`,options:[`$9`,`$900`,`$90`],correct:2,explain:`$1,000 × 0.09 = $90. Es un ejemplo; la tasa real cambia con el tiempo.`},{type:`truefalse`,statement:`Necesitas mucho dinero para comprar CETES.`,answer:!1,explain:`Se pueden comprar desde montos bajos en la plataforma oficial del gobierno, por lo que son una forma accesible de empezar.`},{type:`intro`,title:`Fondos, acciones y tu Afore`,body:[`Un fondo de inversión junta el dinero de muchas personas y un equipo profesional lo invierte. Hay fondos de deuda (más estables) y de renta variable (más altibajos); revisa sus comisiones y cuándo puedes retirar.`,`Comprar acciones es comprar una pequeña parte de una empresa. En México se negocian en las bolsas de valores autorizadas. Su precio puede subir o bajar mucho.`,`Si trabajas formalmente, tienes una cuenta en una Afore para tu retiro, y puedes hacer aportaciones voluntarias. Algunas se pueden retirar después de cierto plazo y otras son para el retiro; revisa las reglas de tu Afore.`,`Como la Afore es de largo plazo, el interés compuesto tiene muchos años para trabajar, aunque aportes poco.`],terms:[{term:`Fondo de inversión`,def:`Bolsa común de dinero de muchas personas, administrada por profesionales.`},{term:`Acción`,def:`Una parte de la propiedad de una empresa que cotiza en bolsa.`},{term:`Comisión`,def:`Lo que te cobran por administrar o comprar tu inversión. Reduce tu ganancia.`}],callout:{tone:`tip`,text:`Antes de elegir un instrumento, verifica que la institución esté autorizada en el SIPRES de CONDUSEF o en el padrón de la CNBV.`}},{type:`truefalse`,statement:`Un fondo de inversión de renta variable siempre gana dinero porque lo manejan profesionales.`,answer:!1,explain:`Los profesionales administran, pero no controlan el mercado. Un fondo de renta variable puede bajar de valor.`},{type:`choice`,prompt:`¿Qué instrumento suele tener más altibajos en el corto plazo?`,options:[`Acciones de una empresa`,`CETES a 28 días`,`Fondo de deuda de corto plazo`],correct:0,explain:`El precio de una acción depende de la empresa y del mercado, y puede cambiar mucho en poco tiempo.`},{type:`choice`,prompt:`Quieres juntar para tu retiro, dentro de más de 30 años. ¿Qué opción encaja mejor con ese plazo?`,options:[`Guardar efectivo en casa`,`Una cuenta para gastos del día a día`,`Aportaciones voluntarias a tu Afore`],correct:2,explain:`La Afore está diseñada para el largo plazo. El efectivo en casa pierde valor con la inflación.`}],keyPoints:[`Compara instrumentos por liquidez, plazo y riesgo.`,`Los CETES son deuda del gobierno, de bajo riesgo y accesibles con montos bajos.`,`Fondos y acciones pueden rendir más, pero también bajar.`,`La Afore acepta aportaciones voluntarias para el largo plazo.`]},{id:`m6-l5`,title:`Señales de fraude en inversiones`,summary:`Promesas imposibles, presión, pirámides y cómo verificar antes de invertir.`,minutes:7,xp:70,objectives:[`Reconocer las señales más comunes de fraude en inversiones`,`Verificar si una entidad está autorizada en CNBV o CONDUSEF`,`Identificar riesgos y estafas frecuentes con criptomonedas`],steps:[{type:`intro`,title:`Las promesas que deben encender alertas`,body:[`El fraude más común promete rendimientos altos y "garantizados". Ninguna inversión legítima puede garantizar ganancias altas.`,`Otra señal es la presión: "solo hoy", "quedan pocos lugares", "si no entras ahora te lo pierdes". La prisa te impide verificar.`,`También desconfía si no te explican claramente en qué se invierte tu dinero o si todo es "secreto".`],callout:{tone:`alerta`,text:`Si suena demasiado bueno para ser verdad, probablemente lo es. Detente y verifica antes de transferir un solo peso.`},terms:[{term:`Rendimiento garantizado`,def:`Promesa de ganancia fija sin riesgo. En cifras altas, es señal típica de fraude.`},{term:`Fraude financiero`,def:`Engaño para quedarse con tu dinero haciéndote creer que es una inversión.`}]},{type:`choice`,prompt:`Te ofrecen 5% de ganancia garantizada cada semana. ¿Qué es lo más probable?`,options:[`Es una oportunidad única`,`Es una posible estafa`,`Es lo normal en bolsa`],correct:1,explain:`Una ganancia alta, fija y semanal no corresponde a ninguna inversión legítima. Es una señal clásica de fraude.`},{type:`choice`,prompt:`Si 5% semanal fuera real, ¿cuánto ganarías en 4 semanas sobre $2,000 (sin reinvertir)?`,options:[`$100`,`$400`,`$40`],correct:1,explain:`$2,000 × 0.05 = $100 por semana; $100 × 4 = $400. Ganar 20% al mes "seguro" es irreal, por eso es una alerta.`},{type:`intro`,title:`Pirámides: ganar por reclutar`,body:[`En un esquema piramidal, las "ganancias" de los primeros salen del dinero de los que entran después, no de una actividad real.`,`Por eso te piden reclutar amigos y familia. Cuando dejan de entrar personas nuevas, el esquema se cae y la mayoría pierde.`,`Suelen presentarse como "comunidad", "mentoría" o "libertad financiera". Fíjate en de dónde sale realmente el dinero.`],example:{who:`Andrés, 19 años, prepa`,text:`Un conocido lo invita a un "club de inversión". Así le explican las ganancias:`,rows:[{label:`Cuota de entrada`,amount:1500,tag:`Riesgo`},{label:`"Bono" por cada amigo que invites`,amount:500,tag:`Cuidado`},{label:`Ganancia por invertir en algo real`,amount:0,tag:`Cuidado`}]}},{type:`choice`,prompt:`En el "club" de Andrés, ¿de dónde sale el dinero de los bonos?`,options:[`De una empresa que vende productos`,`De las cuotas de las personas nuevas`,`De rendimientos de CETES`],correct:1,explain:`Si no hay actividad real y solo se gana por reclutar, el dinero viene de los nuevos participantes: es una pirámide.`},{type:`truefalse`,statement:`Si un familiar o amigo te recomienda una inversión, es segura.`,answer:!1,explain:`Muchas pirámides se expanden justo por personas de confianza que creen en ellas. Verifica igual, sin importar quién te la recomiende.`},{type:`intro`,title:`Cripto, estafas y cómo verificar`,body:[`Las criptomonedas son activos digitales. No son buenas ni malas en sí, pero su precio puede subir o bajar muchísimo en días. Si decides invertir, que sea una parte pequeña que puedas perder, y nunca compartas tus claves.`,`Muchas estafas usan la palabra "cripto": "gurús" que prometen ganancias seguras o plataformas falsas que no te dejan retirar.`,`En México, las instituciones que captan e invierten dinero deben estar autorizadas. Revisa el SIPRES de CONDUSEF y el padrón de entidades supervisadas de la CNBV; CONDUSEF también publica alertas sobre entidades no autorizadas.`,`Busca el nombre exacto: los estafadores copian nombres y logotipos de instituciones reales.`],callout:{tone:`alerta`,text:`Si una plataforma te pide pagar una "comisión" o "impuesto" para poder retirar tu dinero, es una señal fuerte de estafa.`}},{type:`truefalse`,statement:`Todas las criptomonedas son una estafa.`,answer:!1,explain:`Las criptomonedas en sí no son estafas, pero son muy volátiles y se usan mucho como gancho en fraudes. Entiende el riesgo y verifica.`},{type:`choice`,prompt:`Una persona que conociste en redes te ayuda a "invertir en cripto", tus ganancias suben y para retirar te pide pagar $2,000. ¿Qué haces?`,options:[`Pagas, porque ya ganaste mucho`,`Pides un préstamo para pagar más rápido`,`No pagas nada más y reportas el caso`],correct:2,explain:`Pedir pagos para liberar ganancias es una estafa común. Las "ganancias" en pantalla suelen ser falsas; pagar más solo aumenta la pérdida.`},{type:`choice`,prompt:`¿Cuál es el mejor primer paso ante una oferta de inversión desconocida?`,options:[`Invertir poquito para probar`,`Preguntar en los comentarios del anuncio`,`Verificar la entidad en CONDUSEF y la CNBV`],correct:2,explain:`Los comentarios pueden ser falsos y "probar" igual pone tu dinero en riesgo. Verificar en fuentes oficiales es lo más seguro.`}],keyPoints:[`Rendimientos altos garantizados y presión por invertir ya son señales de fraude.`,`Si solo se gana por reclutar personas, es una pirámide.`,`Verifica cualquier entidad en el SIPRES de CONDUSEF y en la CNBV.`,`Las criptos son muy volátiles y se usan como gancho en estafas: nunca compartas tus claves.`]}]},{id:`m7`,title:`Independencia financiera`,description:`Tu recibo de nómina, el retiro, vivir por tu cuenta, compartir gastos y un plan para los próximos años.`,why:`Independizarte es emocionante y también cuesta. Entender tu nómina, tus gastos de vivienda y tus acuerdos de dinero te ayuda a dar el paso con calma.`,lessons:[{id:`m7-l1`,title:`Tu primer recibo de nómina`,summary:`Sueldo bruto y neto, percepciones, deducciones de ISR e IMSS y tu aguinaldo.`,minutes:7,xp:70,objectives:[`Distinguir entre sueldo bruto y sueldo neto`,`Leer las percepciones y deducciones de tu recibo`,`Calcular tu aguinaldo mínimo`],steps:[{type:`intro`,title:`Sueldo bruto y sueldo neto`,body:[`El sueldo bruto es lo que acordaste con tu empleador. El neto es lo que recibes después de descuentos como ISR e IMSS.`,`Por eso, si te ofrecen $10,000 al mes, a tu cuenta llega algo menos. La diferencia no se pierde: una parte paga impuestos y otra tu seguridad social.`,`Haz tu presupuesto con el sueldo neto, porque es el dinero que realmente llega a tu cuenta.`],terms:[{term:`Sueldo bruto`,def:`Lo que ganas antes de cualquier descuento. Es la cifra que suele aparecer en la oferta.`},{term:`Sueldo neto`,def:`Lo que te depositan después de descuentos. Con esto haces tu presupuesto.`},{term:`ISR`,def:`Impuesto sobre la renta. Tu empleador lo retiene y lo paga al SAT por ti.`}]},{type:`choice`,prompt:`¿Con qué cifra conviene hacer tu presupuesto?`,options:[`Sueldo bruto`,`Sueldo bruto más aguinaldo`,`Sueldo neto`],correct:2,explain:`El neto es lo que recibes después de impuestos y cuotas, así que es el dinero con el que realmente cuentas.`},{type:`truefalse`,statement:`Si tu recibo tiene descuentos, tu empleador se está quedando con tu dinero.`,answer:!1,explain:`Es un mito. Los descuentos de ley, como ISR e IMSS, se pagan al SAT y al IMSS a tu nombre.`},{type:`intro`,title:`Cómo leer tu recibo`,body:[`Tu recibo de nómina tiene dos columnas principales. Percepciones: todo lo que ganas, como sueldo, horas extra o prima vacacional. Deducciones: lo que se descuenta.`,`Sueldo neto = percepciones − deducciones. Revisa que la cuenta cuadre y que tus días trabajados sean correctos.`,`Tu recibo es un comprobante digital que tu empleador emite ante el SAT. Guárdalos: te sirven para trámites, créditos o aclaraciones.`],example:{who:`Andrea, 22 años, primer empleo en una oficina`,text:`Revisó su recibo de la quincena. Estas cifras son un ejemplo ilustrativo; tus descuentos dependen de tu sueldo.`,rows:[{label:`Sueldo de la quincena`,amount:6e3,tag:`Percepción`},{label:`ISR retenido`,amount:450,tag:`Deducción`},{label:`Cuota IMSS`,amount:150,tag:`Deducción`},{label:`Neto depositado`,amount:5400}]},callout:{tone:`tip`,text:`Compara cada quincena tu recibo con lo que te depositaron. Si algo no cuadra, pregunta pronto en Recursos Humanos.`}},{type:`choice`,prompt:`Tus percepciones de la quincena son $7,000 y tus deducciones $700. ¿Cuál es tu neto?`,options:[`$7,700`,`$6,300`,`$6,700`],correct:1,explain:`Neto = percepciones − deducciones: $7,000 − $700 = $6,300.`},{type:`choice`,prompt:`¿Dónde aparece el ISR en tu recibo?`,options:[`En las deducciones`,`En las percepciones`,`No aparece nunca`],correct:0,explain:`El ISR es un descuento que tu empleador retiene, así que va en la columna de deducciones.`},{type:`intro`,title:`Tu aguinaldo`,body:[`Por ley, en México recibes al menos 15 días de salario como aguinaldo, antes del 20 de diciembre.`,`Para calcularlo: salario diario × 15. Si no trabajaste el año completo, te toca la parte proporcional.`,`Llega en una época de muchos gastos. Decidir antes qué harás con él te ayuda a usarlo a tu favor.`],callout:{tone:`dato`,text:`El aguinaldo está exento de ISR hasta 30 UMA. Si tu aguinaldo es mayor, solo el excedente paga impuesto.`}},{type:`choice`,prompt:`Tu salario diario es $400. ¿Cuál es el aguinaldo mínimo por un año completo?`,options:[`$4,000`,`$6,000`,`$12,000`],correct:1,explain:`15 días × $400 = $6,000.`},{type:`choice`,prompt:`Un buen uso posible del aguinaldo es…`,options:[`Gastarlo antes de recibirlo`,`Dejarlo en la cuenta sin decidir nada`,`Repartirlo entre deudas, ahorro y algún gusto`],correct:2,explain:`Depende de tu situación. Dividirlo te permite avanzar en metas y disfrutar a la vez.`},{type:`truefalse`,statement:`El aguinaldo es un regalo de la empresa y puede darlo o no.`,answer:!1,explain:`Es un mito. El aguinaldo es un derecho de ley: al menos 15 días de salario antes del 20 de diciembre.`}],keyPoints:[`Haz tu presupuesto con el sueldo neto, no con el bruto.`,`Neto = percepciones − deducciones (ISR, IMSS y otras).`,`Aguinaldo mínimo: salario diario × 15, antes del 20 de diciembre.`,`Guarda tus recibos y revisa que cuadren con tu depósito.`]},{id:`m7-l2`,title:`Afore y retiro`,summary:`Cómo funciona tu cuenta de retiro, quién aporta y por qué empezar joven.`,minutes:6,xp:60,objectives:[`Explicar qué es una Afore y quién aporta a tu cuenta`,`Calcular cuánto suman aportaciones voluntarias pequeñas`,`Reconocer qué revisar en tu cuenta de retiro`],steps:[{type:`intro`,title:`Tu yo del futuro también cuenta`,body:[`Si trabajas con prestaciones, tu empleador, tú y el gobierno aportan a una cuenta individual de retiro. Esa cuenta la administra una Afore.`,`La Afore invierte ese dinero para que crezca con los años. Cuando te retires, de ahí saldrá tu pensión.`,`Aunque el retiro se vea lejos, es el ahorro que más tiempo tiene para crecer. Por eso conviene conocerlo desde ya.`],terms:[{term:`Afore`,def:`Administradora de fondos para el retiro. Cuida e invierte el dinero de tu cuenta de retiro.`},{term:`Cuenta individual`,def:`Tu cuenta de retiro a tu nombre. Lo que se aporta es tuyo, aunque cambies de empleo.`},{term:`Aportación voluntaria`,def:`Dinero extra que tú decides depositar en tu Afore, además de lo obligatorio.`}]},{type:`choice`,prompt:`¿Qué administra una Afore?`,options:[`Tu tarjeta de crédito`,`Tu cuenta individual para el retiro`,`Tu beca`],correct:1,explain:`Es una institución que administra e invierte los recursos de tu cuenta de retiro.`},{type:`truefalse`,statement:`Si cambias de trabajo, pierdes lo que ya tenías en tu Afore.`,answer:!1,explain:`Es un mito. La cuenta es tuya y sigue contigo; los nuevos aportes llegan a la misma cuenta.`},{type:`intro`,title:`El poder de empezar temprano`,body:[`Puedes hacer aportaciones voluntarias, aunque sean pequeñas. Por el tiempo, lo que aportes joven tiene más años para crecer.`,`Aun sin contar rendimientos, el hábito suma. Y con el interés compuesto, el dinero que entra temprano crece sobre sus propias ganancias.`,`Las aportaciones voluntarias son opcionales. Decide según tu presupuesto y tus otras metas, como tu fondo de emergencia.`],example:{who:`Karla, 24 años, diseñadora con empleo formal`,text:`Decidió aportar $200 al mes de forma voluntaria. Sin contar rendimientos, así se acumula su aporte.`,rows:[{label:`En un año ($200 × 12)`,amount:2400,tag:`Ahorro`},{label:`En 10 años ($2,400 × 10)`,amount:24e3,tag:`Ahorro`},{label:`En 30 años ($2,400 × 30)`,amount:72e3,tag:`Ahorro`}]}},{type:`choice`,prompt:`Si aportas $150 al mes de forma voluntaria, ¿cuánto aportas en un año, sin contar rendimientos?`,options:[`$1,500`,`$1,800`,`$1,200`],correct:1,explain:`$150 × 12 meses = $1,800 al año.`},{type:`choice`,prompt:`¿Por qué importa empezar joven?`,options:[`Porque es obligatorio aportar de más`,`No importa, da igual empezar a los 50`,`Por el interés compuesto y más años de aportes`],correct:2,explain:`El tiempo ayuda a que los aportes crezcan, como viste en la lección de interés compuesto.`},{type:`intro`,title:`Revisa tu cuenta`,body:[`Primero ubica en qué Afore estás. Puedes consultarlo con tu CURP o tu NSS en los canales oficiales.`,`Mantén tus datos actualizados y registra a tus beneficiarios. Revisa tu estado de cuenta al menos una vez al año.`,`Las Afores cobran comisiones y obtienen rendimientos distintos. Compara el rendimiento neto, que ya descuenta comisiones, antes de decidir si cambiarte.`],callout:{tone:`dato`,text:`La CONSAR es la autoridad que supervisa a las Afores y publica comparativos de comisiones y rendimientos.`}},{type:`choice`,prompt:`¿Qué dato te ayuda más a comparar Afores?`,options:[`El rendimiento neto`,`El color de su logotipo`,`Cuántos anuncios tiene`],correct:0,explain:`El rendimiento neto muestra cuánto ganó tu dinero después de comisiones.`},{type:`choice`,prompt:`¿Las aportaciones voluntarias son obligatorias?`,options:[`Sí, para todos`,`Solo para estudiantes`,`No, son opcionales`],correct:2,explain:`Son una opción. Decide según tu presupuesto y tus otras metas.`}],keyPoints:[`Tu Afore administra tu cuenta individual de retiro y es tuya siempre.`,`Las aportaciones voluntaria
