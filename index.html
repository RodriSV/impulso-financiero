spués.`,`Cuando entiendes para qué lo usas, es más fácil decidir qué hacer con él.`],terms:[{term:`Medio de intercambio`,def:`Lo usas para pagar bienes y servicios sin tener que hacer trueque.`},{term:`Unidad de medida`,def:`Te permite comparar precios: sabes que algo de $300 cuesta el doble que algo de $150.`},{term:`Reserva de valor`,def:`Puedes guardarlo hoy y usarlo después, aunque la inflación le resta poder de compra con el tiempo.`}]},{type:`choice`,prompt:`Guardar $200 hoy para comprar un libro el próximo mes usa el dinero como…`,options:[`Medio de intercambio`,`Reserva de valor`,`Unidad de medida`],correct:1,explain:`Al guardarlo, el dinero conserva poder de compra para usarlo después: es una reserva de valor.`},{type:`choice`,prompt:`Comparas dos mochilas: una de $450 y otra de $780. ¿Qué función del dinero estás usando?`,options:[`Reserva de valor`,`Medio de intercambio`,`Unidad de medida`],correct:2,explain:`Los precios en pesos te dejan comparar cuánto vale cada cosa. Eso es usar el dinero como unidad de medida.`},{type:`intro`,title:`Efectivo y dinero digital`,body:[`El efectivo son billetes y monedas. Es aceptado casi en todos lados, pero se pierde fácil y es difícil saber en qué se fue.`,`El dinero digital vive en una cuenta: pagas con tarjeta de débito, transferencia o código QR. Cada movimiento queda registrado.`,`Ninguno es mejor siempre. Muchas personas combinan: efectivo para la tiendita o el camión, y la cuenta para lo demás.`],example:{who:`Mariana, 20 años, estudia en la uni y vende postres los fines de semana`,text:`Así se movió su dinero en una semana:`,rows:[{label:`Ventas cobradas en efectivo`,amount:850},{label:`Ventas cobradas por transferencia`,amount:1150},{label:`Pasajes y tiendita (efectivo)`,amount:320},{label:`Ingredientes pagados con débito`,amount:640}]},callout:{tone:`dato`,text:`En México, las transferencias por SPEI funcionan las 24 horas, todos los días del año.`}},{type:`truefalse`,statement:`El dinero en una cuenta no es dinero "de verdad" porque no lo puedes tocar.`,answer:!1,explain:`Es tan real como el efectivo: con él pagas, transfieres y ahorras. Solo cambia la forma en que lo guardas.`},{type:`choice`,prompt:`¿Cuál es una ventaja de pagar con tu tarjeta de débito en lugar de efectivo?`,options:[`Que el dinero no se acaba`,`Que cada pago queda registrado y puedes revisarlo después`,`Que te genera deuda que pagas después`],correct:1,explain:`Con débito usas tu propio dinero y cada movimiento aparece en tu cuenta. Eso facilita saber en qué gastas.`},{type:`intro`,title:`Decidir con intención`,body:[`Administrar no es tener mucho dinero. Es decidir a dónde va cada peso que entra, antes de que se vaya solo.`,`Una forma sencilla: cuando recibas dinero, reparte primero lo necesario, luego un poco para ahorro y después lo que usarás en gustos.`,`Los gustos también cuentan. Un buen plan no es el que prohíbe todo, sino el que puedes sostener.`],callout:{tone:`tip`,text:`Antes de gastar, pregúntate: ¿esto es lo que más quiero hacer con este dinero ahora?`}},{type:`choice`,prompt:`¿Qué significa administrar bien tu dinero?`,options:[`Tener ingresos altos`,`No gastar en nada que no sea indispensable`,`Decidir con intención en qué usas lo que recibes`],correct:2,explain:`Cualquier ingreso se puede administrar. Gastar en cosas que disfrutas también cabe en un buen plan.`},{type:`choice`,prompt:`Lalo recibe $2,000. Aparta $800 para comida y pasajes y $500 para ahorro. ¿Cuánto le queda para salir con amigos?`,options:[`$500`,`$700`,`$1,200`],correct:1,explain:`$800 + $500 = $1,300 ya tienen destino. $2,000 − $1,300 = $700 para salir, sin culpa.`},{type:`truefalse`,statement:`Para empezar a administrar tu dinero primero necesitas ganar mucho.`,answer:!1,explain:`Los hábitos se forman con cualquier cantidad. Aprender con poco te prepara para cuando ganes más.`}],keyPoints:[`El dinero sirve para intercambiar, medir el valor de las cosas y guardar valor.`,`Efectivo y dinero digital tienen ventajas distintas; puedes combinarlos.`,`Administrar es darle destino a cada peso, no tener mucho.`,`Los gustos caben en un buen plan cuando los decides con intención.`]},{id:`m1-l2`,title:`Ingresos y gastos`,summary:`Tipos de ingreso, ingreso bruto y neto, gastos fijos y variables y tu flujo de dinero.`,minutes:6,xp:60,objectives:[`Identificar tus fuentes de ingreso fijas y variables`,`Distinguir entre gastos fijos y gastos variables`,`Calcular tu flujo de dinero del mes`],steps:[{type:`intro`,title:`Lo que entra: tus ingresos`,body:[`Ingreso es todo el dinero que recibes: sueldo, beca, apoyo familiar, ventas o propinas. Todas las fuentes cuentan.`,`Algunos ingresos llegan igual cada mes, como una beca. Otros cambian, como las propinas o lo que vendes.`,`Si trabajas con nómina, ojo: el sueldo que acordaste (bruto) normalmente no es lo que llega a tu cuenta (neto), porque antes se descuentan impuestos y cuotas.`],terms:[{term:`Ingreso fijo`,def:`Llega con un monto parecido cada periodo, como una beca o un sueldo fijo.`},{term:`Ingreso variable`,def:`Cambia de un mes a otro, como propinas, ventas o trabajos por proyecto.`},{term:`Ingreso bruto`,def:`Lo que acordaste ganar, antes de descuentos.`},{term:`Ingreso neto`,def:`Lo que realmente recibes después de descuentos. Con este haces tu plan.`}]},{type:`choice`,prompt:`Recibes $3,000 de beca y $4,500 de un trabajo de medio tiempo. ¿Cuál es tu ingreso mensual?`,options:[`$3,000`,`$4,500`,`$7,500`],correct:2,explain:`Todas las fuentes cuentan: $3,000 + $4,500 = $7,500.`},{type:`choice`,prompt:`¿Cuál de estos ingresos es variable?`,options:[`Una beca mensual de $3,000`,`Las propinas de tu trabajo en un restaurante`,`Un sueldo fijo que llega cada quincena`],correct:1,explain:`Las propinas dependen de cuántos clientes atiendas y cuánto dejen, así que cambian cada semana.`},{type:`choice`,prompt:`Tu sueldo bruto es $6,000 al mes y te descuentan $400. ¿Cuál es tu ingreso neto?`,options:[`$6,400`,`$6,000`,`$5,600`],correct:2,explain:`$6,000 − $400 = $5,600. Ese es el dinero que realmente puedes repartir.`},{type:`intro`,title:`Lo que sale: gastos fijos y variables`,body:[`Gasto es todo lo que pagas. Los gastos fijos se repiten con un monto parecido: renta, plan de celular, colegiatura.`,`Los gastos variables cambian según lo que decidas o lo que pase: comida fuera, salidas, ropa.`,`Los fijos son fáciles de prever. Los variables son donde más margen tienes para ajustar.`],example:{who:`Iván, 21 años, estudia en la uni y trabaja medio tiempo`,text:`Separó sus gastos del mes en fijos y variables:`,rows:[{label:`Renta compartida`,amount:2500,tag:`Fijo`},{label:`Plan de celular`,amount:249,tag:`Fijo`},{label:`Transporte a la uni`,amount:560,tag:`Fijo`},{label:`Comida fuera`,amount:1200,tag:`Variable`},{label:`Salidas con amigos`,amount:800,tag:`Variable`}]},callout:{tone:`tip`,text:`Revisa primero tus gastos variables: ahí suele estar el ajuste más rápido cuando necesitas dinero.`}},{type:`choice`,prompt:`¿Cuál de estos suele ser un gasto fijo?`,options:[`Una cena con amigos`,`La renta del cuarto`,`Un regalo de cumpleaños`],correct:1,explain:`La renta se paga cada mes con un monto parecido. Los otros cambian de mes a mes.`},{type:`truefalse`,statement:`Todos los gastos fijos son necesidades.`,answer:!1,explain:`Una suscripción de video se cobra igual cada mes, pero es un gusto. Fijo habla de cómo se paga, no de qué tan necesario es.`},{type:`intro`,title:`Tu flujo de dinero`,body:[`El flujo de dinero es la resta más importante de tus finanzas: ingresos menos gastos.`,`Si el resultado es positivo, te sobra dinero para ahorrar o para metas. Si es negativo, gastaste más de lo que entró.`,`Un mes negativo no es el fin del mundo, pero si se repite, la diferencia suele cubrirse con deudas.`],callout:{tone:`alerta`,text:`Si cada mes cubres el faltante con tarjeta o préstamos, la deuda crece aunque no compres nada nuevo.`}},{type:`choice`,prompt:`Este mes recibiste $6,200 y gastaste $6,650. ¿Cuál fue tu flujo?`,options:[`$450 a favor`,`$12,850`,`$450 en contra`],correct:2,explain:`$6,200 − $6,650 = −$450. Gastaste $450 más de lo que entró.`},{type:`choice`,prompt:`Tu flujo salió negativo dos meses seguidos. ¿Qué conviene hacer primero?`,options:[`Revisar tus gastos variables y ver cuáles puedes ajustar`,`Ignorarlo: el próximo mes se compensa solo`,`Dejar de pagar la renta un mes`],correct:0,explain:`Los gastos variables son los más fáciles de mover sin poner en riesgo lo básico.`}],keyPoints:[`Todas tus fuentes de ingreso cuentan: sueldo, beca, apoyo, ventas y propinas.`,`Haz tus cuentas con el ingreso neto, lo que realmente recibes.`,`Los gastos fijos se repiten; los variables son donde más puedes ajustar.`,`Ingresos menos gastos te dice si te sobra o te falta dinero.`]},{id:`m1-l3`,title:`Necesidades vs. deseos`,summary:`Distingue lo que necesitas de lo que quieres, y por qué a veces depende del contexto.`,minutes:7,xp:70,objectives:[`Distinguir una necesidad de un deseo`,`Aplicar tres preguntas para clasificar un gasto`,`Reconocer cuándo un gasto depende de tu contexto`],steps:[{type:`intro`,title:`Necesitar y querer no es lo mismo`,body:[`Una necesidad es un gasto que te permite vivir, estudiar o trabajar: comida, transporte, vivienda, salud.`,`Un deseo es algo que mejora tu vida, pero sin lo cual puedes seguir funcionando.`,`Los deseos no son malos. La clave es cubrir primero las necesidades y después decidir qué gustos caben.`],example:{who:`Dani, 19 años, estudia y trabaja medio tiempo en una cafetería`,text:`Recibe $6,500 al mes. Antes de gastar, separa lo que necesita para el mes.`,rows:[{label:`Transporte a la uni`,amount:560,tag:`Necesidad`},{label:`Despensa`,amount:1400,tag:`Necesidad`},{label:`Concierto el sábado`,amount:900,tag:`Deseo`},{label:`Plan de celular`,amount:249,tag:`Necesidad`}]}},{type:`classify`,prompt:`¿Necesidad o deseo?`,item:`Pasaje de camión para ir a la escuela`,amount:14,correct:`necesidad`,explain:`Sin transporte no llegas a clases ni al trabajo. Es un gasto que te permite funcionar.`},{type:`classify`,prompt:`¿Necesidad o deseo?`,item:`Suscripción a una plataforma de streaming`,amount:219,correct:`deseo`,explain:`Es entretenimiento. Puede caber en tu presupuesto, pero si el dinero no alcanza es de lo primero que puedes pausar.`},{type:`classify`,prompt:`¿Necesidad o deseo?`,item:`Despensa básica: arroz, frijol, huevo y verduras`,amount:650,correct:`necesidad`,explain:`La alimentación básica es una necesidad. Comparar precios ayuda a que rinda más.`},{type:`classify`,prompt:`¿Necesidad o deseo?`,item:`Tenis de edición limitada (tus tenis actuales están bien)`,amount:3200,correct:`deseo`,explain:`Ya tienes calzado funcional, así que son un gusto. Si los quieres, puedes planearlos con una meta de ahorro.`},{type:`intro`,title:`Tres preguntas para decidir`,body:[`Cuando dudes, hazte tres preguntas. ¿Puedo vivir, estudiar o trabajar sin esto?`,`¿Existe una versión más sencilla que cubra lo mismo? Comer es necesidad; comer en restaurante todos los días, no tanto.`,`¿Pasa algo grave si lo pospongo un mes? Si la respuesta es no, probablemente es un deseo que puedes planear.`],terms:[{term:`Necesidad`,def:`Gasto sin el cual no puedes vivir, estudiar, trabajar o cuidar tu salud.`},{term:`Deseo`,def:`Gasto que disfrutas o te hace la vida más cómoda, pero que puedes posponer.`},{term:`Prioridad`,def:`El orden en que cubres tus gastos: primero lo que no puede esperar.`}],callout:{tone:`tip`,text:`Muchas veces la necesidad es la base y el deseo es "la versión mejorada". Separa ambas partes del precio.`}},{type:`classify`,prompt:`¿Necesidad o deseo?`,item:`Impresiones del proyecto final`,amount:120,correct:`necesidad`,explain:`Es un gasto escolar obligatorio para entregar tu trabajo.`},{type:`classify`,prompt:`¿Necesidad o deseo?`,item:`Café de especialidad todos los días`,amount:65,correct:`deseo`,explain:`Es un gusto válido. Ojo: $65 diarios son cerca de $1,950 al mes. Los gastos pequeños y frecuentes suman.`},{type:`classify`,prompt:`¿Necesidad o deseo?`,item:`Medicamento recetado por tu médico`,amount:280,correct:`necesidad`,explain:`La salud es prioridad. Si es posible, pregunta por la opción genérica, que suele costar menos.`},{type:`intro`,title:`Depende del contexto`,body:[`El mismo gasto puede ser necesidad para una persona y deseo para otra. Una laptop potente es necesidad si estudias diseño o programación, y un gusto si solo la usas para juegos.`,`Un celular básico puede ser necesidad para trabajar o estudiar. Cambiarlo por el modelo más nuevo, cuando el tuyo funciona, suele ser deseo.`,`Tomar un taxi de noche para volver seguro a casa puede ser necesidad. Tomarlo para no caminar dos cuadras de día, probablemente no.`],callout:{tone:`alerta`,text:`No uses esta lista para juzgarte. El objetivo es ordenar prioridades, no sentir culpa por tus gustos.`}},{type:`truefalse`,statement:`Un mismo gasto puede ser necesidad para una persona y deseo para otra.`,answer:!0,explain:`Depende de tu situación: tu carrera, tu trabajo, tu salud o tu seguridad cambian lo que necesitas.`},{type:`choice`,prompt:`Valeria estudia diseño y necesita una laptop para clases. ¿Qué parte de la compra es un deseo?`,options:[`Una laptop que corra los programas de su carrera`,`Un cargador para poder usarla`,`Pagar extra por un modelo con funciones que no va a usar`],correct:2,explain:`La laptop que cubre sus clases es necesidad. Lo que paga de más por funciones que no usará es un gusto.`},{type:`truefalse`,statement:`Si algo es un deseo, está mal gastar en él.`,answer:!1,explain:`Los deseos son parte de una vida plena. Lo importante es que no dejen sin cubrir tus necesidades.`}],keyPoints:[`Las necesidades te permiten vivir, estudiar, trabajar y cuidar tu salud.`,`Los deseos mejoran tu vida y no son malos: van después de lo esencial.`,`Si dudas, pregúntate si puedes posponerlo o si hay una versión más sencilla.`,`El contexto importa: un mismo gasto puede ser necesidad o deseo.`]},{id:`m1-l4`,title:`Gastos hormiga`,summary:`Gastos pequeños y frecuentes: dónde se esconden, cuánto suman y cómo manejarlos.`,minutes:6,xp:60,objectives:[`Reconocer gastos hormiga en tu día a día`,`Calcular cuánto suman en un mes o en un año`,`Elegir qué gastos pequeños conservar y cuáles recortar`],steps:[{type:`intro`,title:`Pequeños, frecuentes y casi invisibles`,body:[`Los gastos hormiga son compras pequeñas que haces casi sin pensar: un refresco, unas papas, una comisión, una compra dentro de un juego.`,`Uno solo no pesa. Juntos pueden ser una parte grande de tu mes.`,`No se trata de eliminarlos todos, sino de verlos y decidir cuáles valen la pena para ti.`],example:{who:`Sofía, 17 años, estudia la prepa`,text:`Anotó todo lo que compró en la tiendita y en apps durante 7 días.`,rows:[{label:`Refresco diario ($22 × 7)`,amount:154},{label:`Botanas ($18 × 5)`,amount:90},{label:`Monedas en un juego`,amount:79}]}},{type:`choice`,prompt:`Sofía gastó $323 en una semana. ¿Cuánto sería en un mes de 4 semanas?`,options:[`$646`,`$969`,`$1,292`],correct:2,explain:`$323 × 4 = $1,292. Ver el total mensual ayuda a decidir si vale la pena para ti.`},{type:`truefalse`,statement:`Los gastos hormiga son solo antojos de comida.`,answer:!1,explain:`También cuentan comisiones, suscripciones que no usas, costos de envío y compras dentro de apps o juegos.`},{type:`intro`,title:`Dónde se esconden`,body:[`En la tiendita y en la cafetería: bebidas, botanas, dulces.`,`En tu celular: suscripciones que olvidaste, compras dentro de juegos y costos de envío de comida a domicilio.`,`En tu cuenta: comisiones por retirar en cajeros de otro banco o por no mantener un saldo mínimo.`],terms:[{term:`Gasto hormiga`,def:`Gasto pequeño y frecuente que casi no notas, pero que suma mucho con el tiempo.`},{term:`Cargo recurrente`,def:`Cobro automático que se repite cada semana, mes o año, como una suscripción.`},{term:`Comisión`,def:`Lo que cobra una institución por un servicio, como usar un cajero ajeno.`}],callout:{tone:`alerta`,text:`Las pruebas gratis que piden tu tarjeta suelen renovarse solas. Anota la fecha y cancela si no la vas a usar.`}},{type:`choice`,prompt:`Una comisión de $15 por retirar en un cajero de otro banco es…`,options:[`Un ingreso`,`Un gasto hormiga evitable`,`Una inversión`],correct:1,explain:`Usar los cajeros de tu banco o pagar con tarjeta de débito puede evitar esa comisión.`},{type:`choice`,prompt:`Tienes tres suscripciones de $99, $139 y $179 al mes. ¿Cuánto suman en un año?`,options:[`$4,170`,`$5,004`,`$1,251`],correct:1,explain:`$99 + $139 + $179 = $417 al mes. $417 × 12 = $5,004 al año.`},{type:`intro`,title:`Manejarlos sin prohibirte todo`,body:[`Primero mide: anota tus gastos pequeños una o dos semanas. Lo que no ves, no lo puedes decidir.`,`Después elige: quédate con los que más disfrutas y recorta los que haces por costumbre.`,`Busca alternativas sencillas: llevar agua en termo, preparar un lunch, cancelar la suscripción que no abres.`],callout:{tone:`tip`,text:`Ponte un tope semanal para antojos, por ejemplo $150, y disfrútalo sin culpa.`}},{type:`choice`,prompt:`¿Cuál es la mejor primera acción contra los gastos hormiga?`,options:[`Prohibirte cualquier antojo`,`Pagar todo con tarjeta de crédito`,`Registrarlos una o dos semanas para ver cuánto suman`],correct:2,explain:`Primero mides; después decides qué conservar y qué recortar.`},{type:`choice`,prompt:`Cambias un refresco de $22 por agua de tu termo 5 días a la semana. ¿Cuánto ahorras en 4 semanas?`,options:[`$440`,`$110`,`$616`],correct:0,explain:`$22 × 5 = $110 a la semana. $110 × 4 = $440 al mes.`},{type:`truefalse`,statement:`Para controlar los gastos hormiga hay que eliminarlos todos.`,answer:!1,explain:`Se trata de elegir. Un gusto pequeño que disfrutas puede quedarse si cabe en tu plan.`}],keyPoints:[`Los gastos hormiga son pequeños, frecuentes y suman mucho.`,`Se esconden en la tiendita, en tu celular y en comisiones.`,`Primero mídelos; después decide cuáles conservar.`,`Multiplica por 4 o por 52 para ver su costo real en un mes o un año.`]},{id:`m1-l5`,title:`Costo de oportunidad`,summary:`Cada decisión implica renunciar a otra opción: aprende a verlo con dinero y tiempo.`,minutes:6,xp:60,objectives:[`Definir qué es el costo de oportunidad`,`Traducir un precio a horas de trabajo`,`Comparar opciones considerando lo que dejas de hacer`],steps:[{type:`intro`,title:`Elegir es renunciar`,body:[`Tu dinero y tu tiempo son limitados. Cuando eliges algo, dejas de elegir otra cosa.`,`El costo de oportunidad es la mejor opción a la que renuncias al tomar una decisión.`,`No es para sentirte mal por elegir. Es para elegir sabiendo qué estás dejando.`],example:{who:`Jimena, 18 años, recibió $900 en su cumpleaños`,text:`Tiene tres ideas para usarlos, pero solo le alcanza para una:`,rows:[{label:`Boleto para un concierto`,amount:900,tag:`Deseo`},{label:`Curso de inglés en línea`,amount:900},{label:`Ahorro para su laptop`,amount:900,tag:`Ahorro`}]},terms:[{term:`Costo de oportunidad`,def:`Lo que dejas de obtener por elegir una opción en lugar de la siguiente mejor.`},{term:`Alternativa`,def:`Cada una de las opciones entre las que puedes elegir.`}]},{type:`choice`,prompt:`Jimena elige el concierto. Su segunda opción favorita era el curso de inglés. ¿Cuál es su costo de oportunidad?`,options:[`Nada, porque disfrutó el concierto`,`Todas las cosas que podría comprar en el mundo`,`El curso de inglés que dejó de tomar`],correct:2,explain:`El costo de oportunidad es la mejor alternativa a la que renunció: en este caso, el curso.`},{type:`truefalse`,statement:`Si algo es gratis, no tiene costo de oportunidad.`,answer:!1,explain:`Aunque no pagues dinero, usas tiempo que podrías dedicar a otra cosa, como estudiar, trabajar o descansar.`},{type:`intro`,title:`Tu tiempo también cuenta`,body:[`El tiempo es un recurso igual de limitado que el dinero. Una hora de trabajo es una hora que no estudias ni descansas.`,`Un truco útil: traduce precios a horas de trabajo. Si ganas $60 por hora, algo de $600 te cuesta 10 horas.`,`Así es más fácil decidir si una compra vale lo que te costó ganarla.`],callout:{tone:`tip`,text:`Antes de una compra grande, divide el precio entre lo que ganas por hora. ¿Trabajarías esas horas por eso?`}},{type:`choice`,prompt:`Ganas $55 por hora. Unos audífonos cuestan $880. ¿A cuántas horas de trabajo equivalen?`,options:[`12 horas`,`16 horas`,`20 horas`],correct:1,explain:`$880 ÷ $55 = 16 horas de trabajo.`},{type:`choice`,prompt:`Tomas un turno extra el sábado y ganas $450, pero ya no estudias para tu examen final. ¿Cuál es el costo de oportunidad?`,options:[`El tiempo de estudio y quizá una mejor calificación`,`Los $450 que ganas`,`No hay costo, porque ganas dinero`],correct:0,explain:`Ganas $450, pero renuncias al tiempo de estudio. Esa es la opción que dejas.`},{type:`intro`,title:`Úsalo para decidir mejor`,body:[`Antes de decidir, pregúntate: ¿qué dejo de hacer o de comprar si elijo esto?`,`Aplica también a deudas: lo que pagas en intereses es dinero que ya no podrás usar en otra cosa.`,`Y cuidado con el costo hundido: lo que ya pagaste no se recupera, así que no debería obligarte a seguir con algo que ya no te conviene.`],terms:[{term:`Costo hundido`,def:`Dinero o tiempo que ya gastaste y no puedes recuperar, decidas lo que decidas.`}],callout:{tone:`alerta`,text:`Ninguna decisión es perfecta. El objetivo es elegir con información, no arrepentirte de todo.`}},{type:`choice`,prompt:`Puedes trabajar en vacaciones y ganar $7,200 en 6 semanas, o tomar un curso gratis en esas mismas semanas. Si eliges el curso, ¿cuál es su costo de oportunidad en dinero?`,options:[`$0, porque el curso es gratis`,`$1,200`,`$7,200`],correct:2,explain:`Aunque el curso no cuesta, renuncias a los $7,200 que ganarías. Puede valer la pena, pero ese es su costo real.`},{type:`choice`,prompt:`¿Qué pregunta te ayuda más a ver el costo de oportunidad?`,options:[`¿Está de moda?`,`¿Qué dejo de hacer o comprar si elijo esto?`,`¿Cuánto cuesta el envío?`],correct:1,explain:`Pensar en lo que dejas te ayuda a comparar opciones de verdad, no solo el precio.`},{type:`truefalse`,statement:`Si ya pagaste algo, debes usarlo aunque ya no te convenga, para no "perder" el dinero.`,answer:!1,explain:`Ese dinero ya se fue pase lo que pase. Decide pensando en lo que te conviene de aquí en adelante.`}],keyPoints:[`Toda decisión implica renunciar a otra opción.`,`El costo de oportunidad aplica al dinero y también a tu tiempo.`,`Traducir precios a horas de trabajo ayuda a decidir.`,`Lo que ya pagaste no debería obligarte a seguir con algo que no te conviene.`]}]},{id:`m2`,title:`Presupuesto`,description:`Planea tu mes, registra lo que gastas y adapta tu plan a ingresos variables y gastos de temporada.`,why:`Muchos jóvenes en México tienen ingresos que cambian mes a mes. Un presupuesto flexible te ayuda a cubrir lo básico y llegar a la quincena con calma.`,lessons:[{id:`m2-l1`,title:`La regla 50/30/20`,summary:`Reparte tu ingreso en necesidades, deseos y ahorro, y adapta los porcentajes a tu vida.`,minutes:6,xp:60,objectives:[`Calcular cuánto va a necesidades, deseos y ahorro`,`Clasificar tus gastos en los tres grupos de la regla`,`Adaptar los porcentajes a tu situación real`],steps:[{type:`intro`,title:`Un punto de partida, no una ley`,body:[`La regla 50/30/20 sugiere destinar 50% de tu ingreso a necesidades, 30% a deseos y 20% a ahorro o a salir de deudas.`,`Se calcula sobre tu ingreso neto, es decir, lo que realmente recibes.`,`Su mayor ventaja: con tres números ya sabes cuánto puedes gastar en cada cosa.`],example:{who:`Carla, 22 años, recién egresada en su primer empleo`,text:`Recibe $8,000 netos al mes. Así se vería con la regla 50/30/20:`,rows:[{label:`Necesidades (50%)`,amount:4e3,tag:`Necesidad`},{label:`Deseos (30%)`,amount:2400,tag:`Deseo`},{label:`Ahorro o deudas (20%)`,amount:1600,tag:`Ahorro`}]}},{type:`choice`,prompt:`Con un ingreso de $6,000, ¿cuánto sería el 20% para ahorro?`,options:[`$600`,`$2,000`,`$1,200`],correct:2,explain:`$6,000 × 0.20 = $1,200.`},{type:`choice`,prompt:`Ganas $7,000 al mes. Según la regla, ¿cuánto destinarías a necesidades?`,options:[`$3,500`,`$2,100`,`$1,400`],correct:0,explain:`$7,000 × 0.50 = $3,500. ($2,100 sería el 30% de deseos y $1,400 el 20% de ahorro.)`},{type:`truefalse`,statement:`Conviene aplicar los porcentajes a tu ingreso neto, no al bruto.`,answer:!0,explain:`El neto es lo que llega a tu cuenta después de descuentos. Planear con el bruto te haría contar dinero que no recibes.`},{type:`intro`,title:`Qué va en cada grupo`,body:[`Necesidades: renta, despensa, transporte, servicios, colegiatura, salud y los pagos mínimos que estás obligado a cubrir.`,`Deseos: salidas, comida fuera, suscripciones, ropa que no es indispensable, viajes.`,`Ahorro y deudas: fondo de emergencia, metas de ahorro y los pagos extra para terminar antes una deuda.`],terms:[{term:`Necesidades (50%)`,def:`Gastos que no puedes dejar de pagar para vivir, estudiar o trabajar.`},{term:`Deseos (30%)`,def:`Gustos que disfrutas y puedes ajustar si el dinero no alcanza.`},{term:`Ahorro y deudas (20%)`,def:`Lo que guardas para tu futuro y lo que abonas de más para salir de deudas.`}]},{type:`choice`,prompt:`Quieres terminar de pagar tu tarjeta antes y abonas $500 extra al mes. ¿En qué grupo va ese pago extra?`,options:[`Deseos`,`Ahorro o deudas`,`No se incluye en el presupuesto`],correct:1,explain:`Pagar de más libera tu dinero futuro y reduce intereses, por eso comparte grupo con el ahorro.`},{type:`truefalse`,statement:`Si no puedes cumplir exacto el 50/30/20, tu presupuesto no sirve.`,answer:!1,explain:`Es una guía. Lo importante es que cada peso tenga un destino y que el plan te funcione a ti.`},{type:`intro`,title:`Adáptala a tu realidad`,body:[`Si pagas renta en una ciudad cara, tus necesidades pueden pasar del 50%. Entonces reduces deseos y ahorras aunque sea 5%.`,`Si vives con tu familia y no pagas renta, quizá puedas ahorrar más del 20%.`,`Lo que importa es la constancia: un ahorro pequeño cada mes vale más que un plan perfecto que abandonas.`],example:{who:`Toño, 20 años, vive con su familia y trabaja medio tiempo`,text:`Gana $5,000 al mes y no paga renta, así que ajustó sus porcentajes a 30/30/40:`,rows:[{label:`Aporte a la casa y transporte (30%)`,amount:1500,tag:`Necesidad`},{label:`Deseos (30%)`,amount:1500,tag:`Deseo`},{label:`Ahorro (40%)`,amount:2e3,tag:`Ahorro`}]},callout:{tone:`tip`,text:`Si hoy no puedes ahorrar 20%, empieza con 5% y súbelo un punto cada vez que tu ingreso crezca.`}},{type:`choice`,prompt:`Tu renta y transporte ya ocupan 65% de tu ingreso. ¿Qué haces?`,options:[`Abandonar el presupuesto porque no cumple 50/30/20`,`Pedir prestado para completar el 30% de deseos`,`Ajustar los porcentajes: menos deseos y un ahorro pequeño pero constante`],correct:2,explain:`La regla se adapta a tu realidad. Un ahorro de 5% constante vale más que un plan perfecto que no puedes sostener.`},{type:`choice`,prompt:`Toño ahorra $2,000 al mes (40% de $5,000). ¿Cuánto junta en 6 meses?`,options:[`$10,000`,`$12,000`,`$2,000`],correct:1,explain:`$5,000 × 0.40 = $2,000 al mes. $2,000 × 6 = $12,000.`}],keyPoints:[`50/30/20: necesidades, deseos y ahorro o deudas.`,`Calcula los porcentajes sobre tu ingreso neto.`,`Los pagos extra a deudas van junto con el ahorro.`,`Ajusta los porcentajes a tu vida; la constancia importa más que la exactitud.`]},{id:`m2-l2`,title:`Registrar tus gastos`,summary:`Anota lo que gastas, compáralo con tu plan y usa esa información para ajustar.`,minutes:6,xp:60,objectives:[`Registrar un gasto con fecha, monto y categoría`,`Comparar lo planeado contra lo que realmente gastaste`,`Detectar patrones en tus gastos con una revisión semanal`],steps:[{type:`intro`,title:`Lo que se mide, se puede mejorar`,body:[`Un presupuesto es lo que planeas. El registro es lo que de verdad pasó.`,`Comparar los dos te muestra dónde te pasaste, dónde te sobró y qué ajustar el próximo mes.`,`Sin registro, el presupuesto es solo un deseo bien escrito.`],terms:[{term:`Registro de gastos`,def:`Lista de todo lo que pagas, con fecha, monto y categoría.`},{term:`Categoría`,def:`Grupo al que pertenece un gasto: comida, transporte, salidas, escuela…`},{term:`Diferencia`,def:`Lo que gastaste menos lo que planeaste. Si es positiva, te pasaste.`}]},{type:`choice`,prompt:`Planeaste $800 de comida fuera y gastaste $1,100. ¿Cuál es la diferencia?`,options:[`$300 de menos`,`$1,900`,`$300 de más`],correct:2,explain:`$1,100 − $800 = $300 por encima de lo planeado. Ahora sabes dónde ajustar el siguiente mes.`},{type:`choice`,prompt:`¿Cuál es el mejor momento para registrar un gasto?`,options:[`El mismo día que ocurre`,`A fin de año`,`Solo si es mayor a $1,000`],correct:0,explain:`Los gastos pequeños son los que más se olvidan. Registrar el mismo día evita huecos.`},{type:`intro`,title:`Cómo registrar sin complicarte`,body:[`Anota cuatro datos: fecha, descripción, monto y categoría. Si quieres, agrega si pagaste en efectivo o con tarjeta.`,`Usa lo que te acomode: una libreta, una hoja de cálculo, las notas del celular o la sección Finanzas de esta app.`,`El efectivo es lo que más se escapa. Los pagos con tarjeta aparecen en tu cuenta, pero sin categoría.`],example:{who:`Paola, 19 años, estudia enfermería y vive con su tía`,text:`Así quedó su registro de una semana, ordenado por categoría:`,rows:[{label:`Transporte`,amount:140,tag:`Necesidad`},{label:`Comida`,amount:420,tag:`Necesidad`},{label:`Salidas`,amount:350,tag:`Deseo`},{label:`Suscripción de música`,amount:99,tag:`Deseo`},{label:`Copias y material`,amount:85,tag:`Necesidad`}]},callout:{tone:`tip`,text:`Toma foto de tus tickets y regístralos en la noche. Dos minutos al día bastan.`}},{type:`choice`,prompt:`¿Cuánto gastó Paola en total esa semana?`,options:[`$994`,`$1,094`,`$1,194`],correct:1,explain:`$140 + $420 + $350 + $99 + $85 = $1,094.`},{type:`truefalse`,statement:`Si pagas todo con tarjeta, no necesitas registrar nada porque el banco ya lo hace.`,answer:!1,explain:`Tu estado de cuenta muestra movimientos, pero no los agrupa como tú los piensas ni incluye lo que pagas en efectivo.`},{type:`intro`,title:`Revisa y ajusta`,body:[`Una vez a la semana, toma diez minutos para sumar por categoría y compararlo con tu plan.`,`Busca patrones: ¿gastas más los viernes?, ¿la comida fuera sube en semana de exámenes?`,`Con esa información decides: mover dinero entre categorías, recortar algo o aceptar que esa categoría necesitaba más.`],callout:{tone:`alerta`,text:`Si te pasaste, no abandones el registro. Un mes con números "feos" es justo el que más te enseña.`}},{type:`choice`,prompt:`Planeaste $1,600 para comida en el mes. A la mitad del mes llevas $1,050. ¿Cuánto te queda para la segunda mitad?`,options:[`$800`,`$550`,`$1,050`],correct:1,explain:`$1,600 − $1,050 = $550. Es menos que la mitad del plan ($800), así que conviene ajustar desde ya.`},{type:`choice`,prompt:`Revisas tu registro y ves que "Suscripciones" suma $640. ¿Qué te dice esto?`,options:[`Que debes cancelar todo`,`Nada, las suscripciones no cuentan`,`Que vale la pena revisar cuáles usas de verdad`],correct:2,explain:`El registro te da información. Tú decides qué conservar según lo que más valoras.`},{type:`choice`,prompt:`¿Cada cuánto conviene revisar tu registro?`,options:[`Una vez a la semana, unos minutos`,`Solo cuando ya no tienes dinero`,`Nunca: con anotar es suficiente`],correct:0,explain:`Revisar seguido te deja corregir a tiempo, antes de que se acabe el mes.`}],keyPoints:[`El registro te muestra la diferencia entre lo planeado y lo real.`,`Anota fecha, descripción, monto y categoría el mismo día.`,`El efectivo es lo que más se olvida: regístralo con cuidado.`,`Revisa una vez a la semana para ajustar a tiempo.`]},{id:`m2-l3`,title:`Cuando el dinero no alcanza`,summary:`Qué hacer en un mes apretado: proteger lo básico, ajustar y evitar deuda cara.`,minutes:6,xp:60,objectives:[`Ordenar tus gastos por prioridad en un mes difícil`,`Calcular cuánto liberas al pausar o reducir deseos`,`Reconocer opciones de ingreso y préstamos riesgosos`],steps:[{type:`intro`,title:`Ajustar sin culpa`,body:[`Tener meses difíciles es normal. Un presupuesto sirve justamente para tomar decisiones cuando el dinero es poco.`,`El orden general: primero protege necesidades, luego reduce o pausa deseos y, si es posible, busca ingresos extra.`,`Evita cubrir gastos diarios con deuda cara: resuelve este mes, pero complica los siguientes.`],terms:[{term:`Déficit`,def:`Cuando tus gastos son mayores que tus ingresos en un periodo.`},{term:`Gasto esencial`,def:`El que no puedes dejar de pagar sin afectar tu salud, casa, estudio o trabajo.`}]},{type:`choice`,prompt:`Te faltan $500 este mes. ¿Qué conviene revisar primero?`,options:[`La despensa básica`,`Gastos en deseos que puedas pausar`,`El transporte a la escuela`],correct:1,explain:`Pausar un deseo temporalmente protege lo esencial.`},{type:`truefalse`,statement:`Si un mes el dinero no te alcanza, significa que eres malo con el dinero.`,answer:!1,explain:`Los imprevistos, los ingresos bajos y los gastos de temporada le pasan a todos. Lo importante es cómo respondes.`},{type:`intro`,title:`Ordena por prioridad`,body:[`Primero: comida, vivienda, servicios básicos, transporte y salud.`,`Después: pagos de deudas, al menos el mínimo, para evitar recargos y daños a tu historial.`,`Al final: deseos. Pausar una suscripción o salir menos un mes no es para siempre.`],example:{who:`Rodrigo, 20 años, estudia en la uni y comparte depa`,text:`Recibe $6,000 al mes, pero sus gastos suman $6,700. Le faltan $700.`,rows:[{label:`Renta compartida`,amount:2500,tag:`Necesidad`},{label:`Despensa y comida`,amount:1800,tag:`Necesidad`},{label:`Transporte`,amount:600,tag:`Necesidad`},{label:`Celular`,amount:250,tag:`Necesidad`},{label:`Salidas`,amount:900,tag:`Deseo`},{label:`Streaming y juegos`,amount:350,tag:`Deseo`},{label:`Ropa`,amount:300,tag:`Deseo`}]}},{type:`choice`,prompt:`Rodrigo pausa streaming y juegos ($350) y reduce sus salidas a la mitad. ¿Cubre el faltante de $700?`,options:[`No, le faltan $100`,`Sí, justo exacto`,`Sí, y le sobran $100`],correct:2,explain:`Libera $350 + $450 (la mitad de $900) = $800. $800 − $700 = $100 de sobra.`},{type:`choice`,prompt:`¿Cuál de estos gastos de Rodrigo NO conviene recortar primero?`,options:[`Transporte a la uni`,`Salidas`,`Ropa`],correct:0,explain:`Sin transporte no llega a clases. Salidas y ropa se pueden posponer sin afectar lo esencial.`},{type:`intro`,title:`Busca opciones, no deuda cara`,body:[`Para entrar más dinero: vende cosas que ya no usas, da asesorías, haz trabajos por proyecto o revisa si puedes solicitar una beca.`,`Habla: con tu familia, con quien compartes gastos o con la institución donde tienes una deuda, antes de atrasarte.`,`Desconfía de préstamos "inmediatos" que no revisan nada y piden acceso a tus contactos o fotos.`],callout:{tone:`dato`,text:`Con el SIPRES de la CONDUSEF puedes verificar si una institución financiera está registrada antes de pedirle un préstamo.`}},{type:`choice`,prompt:`¿Cuál es una forma de aumentar ingresos que muchos estudiantes usan?`,options:[`Sacar un préstamo cada mes`,`Dejar de pagar servicios`,`Vender cosas que ya no usas`],correct:2,explain:`Vender lo que no usas, dar asesorías o hacer trabajos por proyecto son opciones que no generan deuda.`},{type:`choice`,prompt:`Usar la tarjeta de crédito para la despensa todos los meses porque no alcanza…`,options:[`Puede acumular una deuda difícil de pagar si no cubres el total cada mes`,`Es una solución permanente`,`Siempre es gratis`],correct:0,explain:`Si no pagas el total, se cobran intereses. Es mejor revisar el presupuesto de fondo.`},{type:`choice`,prompt:`Una app te ofrece un préstamo al instante, sin revisar nada, y pide acceso a tus contactos. ¿Qué haces primero?`,options:[`Aceptar, porque es rápido`,`Verificar en el SIPRES si está registrada y desconfiar`,`Compartir la liga con tus amigos`],correct:1,explain:`Pedir tus contactos es una señal de alerta común en préstamos abusivos. Verifica antes de dar cualquier dato.`}],keyPoints:[`Un mes difícil es normal; el presupuesto te ayuda a decidir.`,`Protege primero comida, vivienda, transporte y salud.`,`Pausa deseos antes de pedir prestado.`,`Verifica en el SIPRES de la CONDUSEF a quien te ofrezca un préstamo.`]},{id:`m2-l4`,title:`Presupuesto con ingresos variables`,summary:`Cómo planear si ganas con propinas, ventas, proyectos o apps de reparto.`,minutes:7,xp:70,objectives:[`Identificar tu ingreso base a partir de tus meses más bajos`,`Repartir lo que ganas por encima de tu base`,`Calcular un colchón para cubrir meses flojos`],steps:[{type:`intro`,title:`Cuando no sabes cuánto vas a ganar`,body:[`Propinas, ventas, trabajos por proyecto o reparto con apps: muchos jóvenes ganan distinto cada mes.`,`El riesgo es gastar como si todos los meses fueran buenos. Cuando llega uno flojo, falta para lo básico.`,`La solución no es adivinar, sino planear con lo que casi seguro vas a recibir.`],example:{who:`Fer, 21 años, reparte comida en bici con apps y estudia en línea`,text:`Esto ganó en los últimos 6 meses (ya sin comisiones de la plataforma):`,rows:[{label:`Mayo`,amount:6800},{label:`Junio`,amount:5200},{label:`Julio`,amount:7400},{label:`Agosto`,amount:4600,tag:`Cuidado`},{label:`Septiembre`,amount:6100},{label:`Octubre`,amount:5900}]},terms:[{term:`Ingreso variable`,def:`El que cambia cada mes según ventas, clientes, propinas o proyectos.`},{term:`Ingreso base`,def:`Lo que casi seguro ganas aun en un mes flojo. Suele ser tu mes más bajo reciente.`},{term:`Colchón`,def:`Dinero apartado de los meses buenos para completar los meses bajos.`}]},{type:`choice`,prompt:`¿Con qué cifra conviene que Fer haga su presupuesto base?`,options:[`$7,400, su mejor mes`,`$6,000, su promedio`,`$4,600, su mes más bajo`],correct:2,explain:`Si planea con $4,600, cubre lo básico aun en un mes flojo. Con el promedio, en meses bajos le faltaría.`},{type:`truefalse`,statement:`Si un mes te va muy bien, ese será tu nuevo ingreso normal.`,answer:!1,explain:`Un buen mes puede no repetirse. Mejor espera a ver varios meses antes de subir tus gastos fijos.`},{type:`intro`,title:`Presupuesta con tu mes más bajo`,body:[`Con tu ingreso base cubre necesidades y un ahorro mínimo. Ese es tu plan "de piso".`,`Lo que ganes por encima de la base es un extra. Repártelo con reglas que decidas antes, no al momento.`,`Por ejemplo: la mitad al colchón y la otra mitad a metas o gustos.`],callout:{tone:`tip`,text:`Escribe tu regla de reparto antes de cobrar. Decidir en frío evita que el extra desaparezca en una semana.`}},{type:`choice`,prompt:`En mayo Fer ganó $6,800 y su base es $4,600. Si manda la mitad del extra al colchón, ¿cuánto aparta?`,options:[`$1,100`,`$2,200`,`$3,400`],correct:0,explain:`$6,800 − $4,600 = $2,200 de extra. $2,200 ÷ 2 = $1,100 al colchón.`},{type:`choice`,prompt:`¿Qué debe cubrir tu presupuesto base?`,options:[`Solo los deseos del mes`,`Nada: se decide al final del mes`,`Tus necesidades y un ahorro mínimo`],correct:2,explain:`La base protege lo esencial. Los gustos y metas grandes se pagan con lo que ganes de más.`},{type:`intro`,title:`Tu colchón y tu propio "sueldo"`,body:[`Una meta útil es juntar en el colchón de 1 a 2 meses de tu ingreso base. Es distinto de tu fondo de emergencia.`,`Un truco: mete todo lo que ganas a una cuenta y de ahí pásate un "sueldo" fijo cada quincena. Si un mes ganas menos, el colchón completa.`,`Si trabajas por tu cuenta, infórmate sobre tus obligaciones ante el SAT y aparta para impuestos si te corresponde.`],callout:{tone:`alerta`,text:`Resta los costos de trabajar: comisiones de la plataforma, gasolina, datos del celular o mantenimiento de la bici.`}},{type:`choice`,prompt:`Fer quiere un colchón de 2 meses de su ingreso base de $4,600. ¿Cuánto necesita?`,options:[`$12,000`,`$9,200`,`$4,600`],correct:1,explain:`$4,600 × 2 = $9,200.`},{type:`choice`,prompt:`Te pagas un "sueldo" fijo desde tu colchón. Este mes ganaste menos que ese sueldo. ¿Qué pasa?`,options:[`Dejas de pagar la renta`,`Pides prestado de inmediato`,`Tomas la diferencia del colchón y tu gasto sigue estable`],correct:2,explain:`Para eso sirve el colchón: los meses buenos financian los flojos y tu vida no se descontrola.`},{type:`truefalse`,statement:`Los costos de trabajar, como comisiones o gasolina, reducen lo que realmente ganas.`,answer:!0,explain:`Si cobras $800 en un día y gastas $120 en gasolina, tu ingreso real fue $680.`}],keyPoints:[`Planea con tu mes más bajo, no con el mejor ni con el promedio.`,`Decide antes cómo repartir lo que ganes de más.`,`Un colchón de 1 a 2 meses de tu base suaviza los meses flojos.`,`Resta los costos de trabajar para conocer tu ingreso real.`]},{id:`m2-l5`,title:`Gastos de temporada`,summary:`Regreso a clases, diciembre y cumpleaños: prepáralos con un fondo de gastos anuales.`,minutes:6,xp:60,objectives:[`Reconocer los gastos que se repiten cada año`,`Calcular cuánto apartar al mes con tu fondo anual`,`Planear diciembre y enero sin desequilibrar tu año`],steps:[{type:`intro`,title:`Gastos que sí sabías que venían`,body:[`Regreso a clases, inscripciones, regalos de diciembre, cumpleaños, Día de las Madres: no son sorpresas, llegan cada año.`,`El problema es que llegan juntos y se pagan de golpe. Si no los planeas, se sienten como emergencias.`,`La diferencia: una emergencia no se puede prever. Un gasto de temporada sí.`],terms:[{term:`Gasto de temporada`,def:`Gasto que se repite en ciertas fechas del año, como útiles o regalos.`},{term:`Fondo de gastos anuales`,def:`Ahorro mensual para cubrir los gastos de temporada cuando lleguen.`},{term:`Prorratear`,def:`Repartir un gasto grande en partes iguales a lo largo de varios meses.`}]},{type:`truefalse`,statement:`Las inscripciones y el regreso a clases son emergencias.`,answer:!1,explain:`Sabes cuándo llegan y más o menos cuánto cuestan. Por eso se pueden planear con meses de anticipación.`},{type:`choice`,prompt:`¿Cuál de estos es un gasto de temporada?`,options:[`La despensa de la semana`,`El pasaje diario`,`Útiles e inscripción de cada agosto`],correct:2,explain:`Se repite cada año en la misma época. Los otros son gastos frecuentes del día a día.`},{type:`intro`,title:`Tu fondo de gastos anuales`,body:[`Paso 1: haz una lista de lo que pagas una o pocas veces al año y cuánto cuesta.`,`Paso 2: súmalo y divide entre 12. Ese es tu aporte mensual.`,`Paso 3: apártalo cada mes en un lugar separado. Cuando llegue la fecha, el dinero ya está ahí.`],example:{who:`Ximena, 20 años, estudia en una uni pública y trabaja los fines de semana`,text:`Su lista de gastos de temporada para el año:`,rows:[{label:`Inscripción y cuotas`,amount:2400},{label:`Útiles y materiales`,amount:1500},{label:`Regalos de diciembre`,amount:2400},{label:`Cumpleaños de familia y amigos`,amount:1200},{label:`Mantenimiento de laptop`,amount:900}]},callout:{tone:`tip`,text:`Revisa tus pagos del año pasado: ahí aparecen los gastos de temporada que olvidarías en la lista.`}},{type:`choice`,prompt:`La lista de Ximena suma $8,400 al año. ¿Cuánto debe apartar al mes?`,options:[`$840`,`$700`,`$600`],correct:1,explain:`$2,400 + $1,500 + $2,400 + $1,200 + $900 = $8,400. $8,400 ÷ 12 = $700 al mes.`},{type:`choice`,prompt:`Faltan 6 meses para diciembre y quieres $2,400 para regalos. ¿Cuánto separas al mes?`,options:[`$200`,`$240`,`$400`],correct:2,explain:`$2,400 ÷ 6 = $400 al mes. Si empiezas tarde, divides entre los meses que quedan.`},{type:`intro`,title:`Diciembre, aguinaldo y enero`,body:[`Si tienes empleo formal, el aguinaldo llega justo antes de los gastos de diciembre. Puede cubrir parte, pero no todo debe irse ahí.`,`Enero suele ser apretado: llegan inscripciones, pagos de lo que compraste en diciembre y menos ingresos. Se le llama la "cuesta de enero".`,`Cuidado con las compras a meses en diciembre: se pagan durante el año siguiente.`],callout:{tone:`dato`,text:`En México, por ley, el aguinaldo mínimo es de 15 días de salario y debe pagarse antes del 20 de diciembre.`}},{type:`choice`,prompt:`¿Qué es la "cuesta de enero"?`,options:[`El mes apretado que llega después de los gastos de diciembre`,`Una oferta de inicio de año`,`Un impuesto nuevo que se paga en enero`],correct:0,explain:`Se juntan pagos de diciembre, inscripciones y menos ingresos. Planearlo desde antes lo hace más ligero.`},{type:`choice`,prompt:`Tu salario diario es $350 y recibes 15 días de aguinaldo. Si reservas $2,400 para regalos, ¿cuánto te queda?`,options:[`$3,250`,`$5,250`,`$2,850`],correct:2,explain:`15 × $350 = $5,250 de aguinaldo. $5,250 − $2,400 = $2,850 para ahorro, deudas o enero.`},{type:`truefalse`,statement:`Comprar regalos a meses sin intereses en diciembre no afecta tu presupuesto del año siguiente.`,answer:!1,explain:`No pagas intereses, pero cada mensualidad ocupa parte de tu ingreso de enero en adelante.`}],keyPoints:[`Los gastos de temporada se pueden prever; no son emergencias.`,`Suma tus gastos anuales y divide entre 12 para saber cuánto apartar.`,`Si empiezas tarde, divide entre los meses que quedan.`,`Planea diciembre pensando también en enero.`]}]},{id:`m3`,title:`Ahorro`,description:`Metas claras, un fondo para emergencias, interés compuesto y dónde guardar tu dinero de forma segura.`,why:`Ahorrar poco desde ahora te protege de imprevistos y te acerca a tus metas. Empezar joven le da a cada peso más tiempo para crecer.`,lessons:[{id:`m3-l1`,title:`Metas de ahorro claras`,summary:`Ponle nombre, monto y fecha a tus metas y calcula cuánto separar cada mes.`,minutes:6,xp:60,objectives:[`Plantear una meta con nombre, monto y fecha`,`Calcular el aporte mensual para llegar a tu meta`,`Ajustar monto o plazo para que el aporte sea realista`],steps:[{type:`intro`,title:`Ponle nombre, monto y fecha`,body:[`"Quiero ahorrar" es difícil de cumplir. "Quiero $12,000 para una laptop en 10 meses" te dice exactamente qué hacer.`,`La cuenta es sencilla: monto ÷ meses = aporte mensual. En el ejemplo, $12,000 ÷ 10 = $1,200 al mes.`,`Ponerle nombre a la meta también ayuda: es más fácil no gastar el dinero de "mi laptop" que el de "ahorro".`],terms:[{term:`Meta de ahorro`,def:`Algo concreto que quieres lograr, con un monto y una fecha.`},{term:`Plazo`,def:`El tiempo que tienes para juntar el dinero.`},{term:`Aporte`,def:`Lo que separas cada semana, quincena o mes para tu meta.`}]},{type:`choice`,prompt:`¿Cuál de estas metas es más clara?`,options:[`Ahorrar más este año`,`No gastar tanto`,`Juntar $4,500 para una bici en 6 meses`],correct:2,explain:`Tiene monto y plazo: $4,500 ÷ 6 = $750 al mes.`},{type:`choice`,prompt:`Quieres $6,000 para tu viaje de graduación en 12 meses. ¿Cuánto separas al mes?`,options:[`$400`,`$500`,`$600`],correct:1,explain:`$6,000 ÷ 12 = $500 al mes.`},{type:`intro`,title:`Que sea realista para ti`,body:[`Si el aporte mensual es demasiado alto para tu ingreso, la meta se abandona. Mejor ajústala desde el inicio.`,`Tienes tres palancas: bajar el monto, alargar el plazo o subir tu ingreso.`,`Si ya tienes algo ahorrado, réstalo primero: solo divides lo que te falta.`],example:{who:`Luis, 18 años, estudia la prepa y trabaja los fines de semana`,text:`Gana $3,200 al mes y quiere un celular de $7,200. Comparó plazos:`,rows:[{label:`En 6 meses: aporte mensual`,amount:1200,tag:`Cuidado`},{label:`En 9 meses: aporte mensual`,amount:800,tag:`Ahorro`},{label:`En 12 meses: aporte mensual`,amount:600,tag:`Ahorro`}]},callout:{tone:`tip`,text:`Un aporte que puedas sostener sin dejar de cubrir lo básico es mejor que uno ambicioso que dura dos meses.`}},{type:`choice`,prompt:`Luis ya tiene $1,200 ahorrados para su meta de $7,200. Si le quedan 6 meses, ¿cuánto separa al mes?`,options:[`$1,000`,`$1,200`,`$800`],correct:0,explain:`$7,200 − $1,200 = $6,000 por juntar. $6,000 ÷ 6 = $1,000 al mes.`},{type:`truefalse`,statement:`Una meta pequeña no vale la pena; mejor espera a ganar más para empezar a ahorrar.`,answer:!1,explain:`Las metas pequeñas crean el hábito y te dan confianza. Cuando ganes más, ya sabrás cómo hacerlo.`},{type:`intro`,title:`Sepáralo primero y mide tu avance`,body:[`Si ahorras "lo que sobre", casi nunca sobra. Separa tu aporte el mismo día que recibes tu dinero.`,`Guárdalo en un lugar distinto al de tu gasto diario, para no usarlo sin darte cuenta.`,`Revisa tu avance y celebra al llegar a 25%, 50% y 75%. Ver el progreso te mantiene motivado.`],callout:{tone:`alerta`,text:`Si un mes tienes que usar parte del ahorro, no es un fracaso. Ajusta el plazo y sigue.`}},{type:`choice`,prompt:`Ahorrar "lo que sobre" al final del mes suele…`,options:[`Funcionar siempre`,`Ser lo más recomendado`,`Dejar poco o nada para ahorrar`],correct:2,explain:`Separar el ahorro en cuanto recibes tu ingreso hace más probable que lo cumplas.`},{type:`choice`,prompt:`Llevas $2,700 de una meta de $4,500. ¿Qué porcentaje de tu meta llevas?`,options:[`50%`,`60%`,`70%`],correct:1,explain:`$2,700 ÷ $4,500 = 0.6, es decir, 60%. Ya pasaste la mitad.`}],keyPoints:[`Una buena meta tiene nombre, monto y fecha.`,`Aporte mensual = lo que te falta ÷ meses que quedan.`,`Si el aporte no es realista, ajusta monto o plazo.`,`Separa el ahorro en cuanto recibes tu dinero.`]},{id:`m3-l2`,title:`Fondo de emergencia`,summary:`Qué es, cuánto juntar, dónde guardarlo y cómo usarlo cuando llegue un imprevisto.`,minutes:6,xp:60,objectives:[`Distinguir una emergencia de un gasto planeable`,`Calcular la meta de tu fondo con tus gastos básicos`,`Decidir dónde guardarlo y cómo reponerlo`],steps:[{type:`intro`,title:`Tu colchón para lo inesperado`,body:[`Un fondo de emergencia es dinero apartado solo para imprevistos: una consulta médica, una reparación, quedarte sin trabajo.`,`Sin él, cualquier imprevisto termina en deuda o en dejar de pagar algo importante.`,`Una meta común es juntar de 3 a 6 meses de gastos básicos. Si suena lejano, empieza con $1,000 o $3,000.`],terms:[{term:`Emergencia`,def:`Gasto que no esperabas, que no puedes posponer y que afecta tu salud, casa, estudio o trabajo.`},{term:`Gastos básicos`,def:`Lo mínimo que necesitas al mes para vivir: vivienda, comida, transporte, servicios y salud.`},{term:`Liquidez`,def:`Qué tan rápido puedes disponer de tu dinero sin perder valor.`}]},{type:`choice`,prompt:`¿Cuál de estas situaciones es una emergencia?`,options:[`Una oferta de audífonos`,`Un concierto que se anunció hoy`,`Se descompone la laptop que usas para estudiar`],correct:2,explain:`Es imprevisto y afecta tu capacidad de estudiar. Las ofertas y los conciertos se planean con otra meta.`},{type:`truefalse`,statement:`Si tienes tarjeta de crédito, no necesitas un fondo de emergencia.`,answer:!1,explain:`La tarjeta es dinero prestado: si no pagas el total a tiempo, la emergencia se vuelve deuda con intereses.`},{type:`intro`,title:`¿Cuánto necesitas?`,body:[`Suma solo tus gastos básicos de un mes. No incluyas salidas ni compras que podrías pausar en una emergencia.`,`Multiplica por 3 para una primera meta y por 6 si tu ingreso es variable o mantienes a alguien.`,`Constrúyelo poco a poco: un aporte fijo cada quincena llega más lejos de lo que crees.`],example:{who:`Andrea, 23 años, recién egresada en su primer empleo, comparte depa`,text:`Así calculó sus gastos básicos de un mes:`,rows:[{label:`Renta compartida`,amount:3e3,tag:`Fijo`},{label:`Comida`,amount:2200,tag:`Variable`},{label:`Transporte`,amount:700,tag:`Fijo`},{label:`Servicios y celular`,amount:600,tag:`Fijo`},{label:`Salud y otros básicos`,amount:500,tag:`Variable`}]}},{type:`choice`,prompt:`Los gastos básicos de Andrea suman $7,000 al mes. ¿Cuánto serían 3 meses de fondo?`,options:[`$14,000`,`$21,000`,`$42,000`],correct:1,explain:`$3,000 + $2,200 + $700 + $600 + $500 = $7,000. $7,000 × 3 = $21,000.`},{type:`choice`,prompt:`Andrea aporta $1,500 al mes. ¿En cuánto tiempo junta un primer fondo de $6,000?`,options:[`4 meses`,`3 meses`,`6 meses`],correct:0,explain:`$6,000 ÷ $1,500 = 4 meses. Es un primer escalón antes de llegar a $21,000.`},{type:`intro`,title:`Dónde guardarlo y cómo usarlo`,body:[`Debe estar seguro, separado de tu dinero diario y disponible rápido. Una cuenta en una institución regulada suele cumplir las tres cosas.`,`No lo pongas en algo de alto riesgo ni a un plazo en el que no puedas sacarlo.`,`Si lo usas, no pasa nada: para eso existe. Después, vuelve a reponerlo con aportes.`],callout:{tone:`tip`,text:`Ponle un nombre claro a ese apartado, como "Solo emergencias". Te ayuda a no tocarlo para otras cosas.`}},{type:`choice`,prompt:`¿Dónde conviene guardar el fondo de emergencia?`,options:[`En efectivo dentro de la cartera`,`En algo de alto riesgo para que crezca rápido`,`En un lugar seguro, separado de tu dinero diario y fácil de retirar`],correct:2,explain:`Debe estar disponible cuando lo necesites y no mezclarse con lo que gastas cada día.`},{type:`choice`,prompt:`Usaste $2,000 de tu fondo para el dentista. ¿Qué sigue?`,options:[`Nada, ya cumplió su función`,`Reponerlo poco a poco con aportes`,`Cerrar el fondo porque ya no está completo`],correct:1,explain:`El fondo se usa y se repone. Así está listo para el siguiente imprevisto.`}],keyPoints:[`El fondo de emergencia es solo para imprevistos que no puedes posponer.`,`Meta común: de 3 a 6 meses de gastos básicos; empieza con poco.`,`Guárdalo seguro, separado y fácil de retirar.`,`Si lo usas, repónlo.`]},{id:`m3-l3`,title:`Interés compuesto`,summary:`Cómo los intereses generan intereses, por qué importa el tiempo y su efecto en deudas.`,minutes:7,xp:70,objectives:[`Distinguir entre interés simple e interés compuesto`,`Estimar en cuánto tiempo se duplica un monto con la regla del 72`,`Reconocer cómo el interés compuesto hace crecer una deuda`],steps:[{type:`intro`,title:`Intereses que generan intereses`,body:[`Con interés simple, ganas siempre sobre el mismo monto inicial. Con interés compuesto, lo que ganas se suma a tu saldo y también genera rendimiento.`,`Al principio la diferencia es pequeña. Con los años, se vuelve enorme.`,`Prueba el simulador: mueve el aporte, la tasa y los años y mira cómo cambia el resultado.`],example:{who:`Renata, 19 años, estudia en la uni y guardó $10,000 de su beca y trabajos`,text:`Con una tasa ilustrativa de 10% anual e interés compuesto, cada año gana sobre un saldo más grande:`,rows:[{label:`Al final del año 1`,amount:11e3},{label:`Al final del año 2`,amount:12100},{label:`Al final del año 3`,amount:13310,tag:`Ahorro`}]},terms:[{term:`Interés simple`,def:`Rendimiento calculado siempre sobre el monto inicial.`},{term:`Interés compuesto`,def:`Rendimiento calculado sobre el monto inicial más los intereses ya ganados.`},{term:`Tasa anual`,def:`Porcentaje que se gana o se paga en un año.`}]},{type:`compound`},{type:`choice`,prompt:`Con interés simple de 10% anual, ¿cuánto tendrías después de 3 años si empiezas con $10,000?`,options:[`$13,310`,`$13,000`,`$11,000`],correct:1,explain:`$10,000 × 10% = $1,000 cada año. $10,000 + 3 × $1,000 = $13,000. Con compuesto serían $13,310.`},{type:`choice`,prompt:`Ana y Luis aportan lo mismo cada mes con la misma tasa. Ana empieza 5 años antes. ¿Quién tendrá más?`,options:[`Luis`,`Lo mismo`,`Ana`],correct:2,explain:`Ana aporta más meses y su dinero tiene más tiempo para generar rendimiento sobre rendimiento.`},{type:`intro`,title:`El tiempo es el ingrediente principal`,body:[`Cuantos más años dejes trabajar tu dinero, más crece el efecto compuesto. Por eso empezar joven, aunque sea con poco, ayuda tanto.`,`Una forma rápida de estimar: la regla del 72. Divide 72 entre la tasa anual y obtienes cuántos años tarda en duplicarse un monto.`,`Las tasas no son fijas para siempre y nadie puede garantizarlas. Usa la regla solo como estimación.`],callout:{tone:`dato`,text:`Regla del 72 con una tasa ilustrativa de 8% anual: 72 ÷ 8 = 9 años para duplicar tu dinero, aproximadamente.`}},{type:`choice`,prompt:`Con una tasa ilustrativa de 6% anual, ¿en cuántos años se duplicaría tu dinero, aproximadamente?`,options:[`12 años`,`6 años`,`18 años`],correct:0,explain:`Regla del 72: 72 ÷ 6 = 12 años, aproximadamente.`},{type:`truefalse`,statement:`Para aprovechar el interés compuesto necesitas empezar con mucho dinero.`,answer:!1,explain:`El tiempo pesa más que el monto inicial. Aportes pequeños y constantes durante muchos años suman mucho.`},{type:`intro`,title:`También funciona en tu contra`,body:[`Con las deudas pasa lo mismo: los intereses que no pagas se suman al saldo y el mes siguiente generan más intereses.`,`Por eso una deuda de tarjeta en la que solo pagas el mínimo puede tardar años en terminarse.`,`Antes de invertir para ganar intereses, conviene salir de las deudas que te cobran intereses altos.`],callout:{tone:`alerta`,text:`En México, los intereses de tarjeta de crédito además causan IVA, lo que hace la deuda todavía más cara.`}},{type:`choice`,prompt:`¿Qué pasa con una deuda de tarjeta que no pagas por completo?`,options:[`Se congela automáticamente`,`Los intereses se suman al saldo y puede crecer`,`Se reduce sola con el tiempo`],correct:1,explain:`El interés compuesto también juega en tu contra cuando debes.`},{type:`choice`,prompt:`Debes $5,000 a una tasa ilustrativa de 5% mensual y no pagas nada en 2 meses. Sin contar comisiones ni IVA, ¿cuánto debes?`,options:[`$5,512.50`,`$5,500`,`$5,250`],correct:0,explain:`Mes 1: $5,000 × 1.05 = $5,250. Mes 2: $5,250 × 1.05 = $5,512.50. Los intereses del primer mes también generaron intereses.`}],keyPoints:[`Con interés compuesto, los intereses también generan intereses.`,`El tiempo es el ingrediente principal: empezar joven ayuda.`,`Regla del 72: 72 ÷ tasa anual ≈ años para duplicar.`,`Con las deudas, el interés compuesto juega en tu contra.`]},{id:`m3-l4`,title:`Dónde guardar tus ahorros`,summary:`Alcancía, cuenta de débito o cuenta con rendimiento: seguridad, liquidez y GAT.`,minutes:7,xp:70,objectives:[`Comparar alcancía, cuenta de débito y cuenta con rendimiento`,`Verificar que una institución esté regulada y protegida`,`Interpretar la GAT nominal y la GAT real`],steps:[{type:`intro`,title:`Tres lugares, tres ventajas`,body:[`Alcancía o efectivo: lo tienes a la mano, pero se puede perder o robar, es fácil gastarlo y no genera rendimiento.`,`Cuenta de débito: tu dinero está protegido y lo usas con tarjeta o transferencia, aunque normalmente no genera rendimiento.`,`Cuenta de ahorro o inversión con rendimiento: tu dinero crece un poco, pero revisa en cuánto tiempo puedes retirarlo.`],example:{who:`Brenda, 24 años, diseñadora con $10,000 ahorrados`,text:`Comparó qué tendría en un año en cada opción (tasa ilustrativa, no es una oferta real):`,rows:[{label:`Alcancía en casa`,amount:1e4,tag:`Riesgo`},{label:`Cuenta de débito sin rendimiento`,amount:1e4},{label:`Cuenta con rendimiento de 8% anual`,amount:10800,tag:`Ahorro`}]},terms:[{term:`Liquidez`,def:`Qué tan rápido puedes usar tu dinero sin perder valor ni pagar penalizaciones.`},{term:`Rendimiento`,def:`Lo que gana tu dinero por dejarlo guardado o invertido.`},{term:`Plazo fijo`,def:`Acuerdo en el que no puedes retirar tu dinero hasta una fecha.`}]},{type:`choice`,prompt:`Que puedas sacar tu dinero hoy mismo, sin penalización, significa que tiene alta…`,options:[`Liquidez`,`Inflación`,`Comisión`],correct:0,explain:`La liquidez mide qué tan rápido y fácil puedes disponer de tu dinero.`},{type:`truefalse`,statement:`Guardar todos tus ahorros en efectivo en casa es la opción más segura.`,answer:!1,explain:`El efectivo puede perderse o robarse y no tiene ninguna protección. Además, la inflación le quita poder de compra.`},{type:`intro`,title:`Que esté regulada y protegida`,body:[`Antes de abrir una cuenta, revisa que la institución esté autorizada. Puedes buscarla en el SIPRES de la CONDUSEF.`,`En los bancos, el IPAB protege tus depósitos. En las SOFIPO autorizadas existe un fondo de protección, con un límite menor.`,`Si una plataforma no aparece registrada, tu dinero no tiene esa protección, aunque prometa mucho.`],terms:[{term:`IPAB`,def:`Instituto que protege los depósitos de las personas en los bancos, hasta un límite.`},{term:`SOFIPO`,def:`Sociedad Financiera Popular: institución de ahorro y préstamo regulada, distinta de un banco.`},{term:`UDI`,def:`Unidad cuyo valor en pesos sube con la inflación. Los límites de protección se miden en UDIS.`}],callout:{tone:`dato`,text:`El IPAB protege hasta 400,000 UDIS por persona por banco. En SOFIPO autorizadas, el fondo de protección cubre hasta 25,000 UDIS por persona.`}},{type:`choice`,prompt:`Una plataforma promete 30% anual "garantizado", pero no aparece en el SIPRES. ¿Qué haces?`,options:[`Invierto, porque el rendimiento es muy alto`,`Desconfío: no está registrada ni tiene protección clara`,`Invierto solo lo de mi fondo de emergencia`],correct:1,explain:`Un rendimiento alto "garantizado" sin registro es una señal de alerta común en fraudes.`},{type:`choice`,prompt:`Tienes tus ahorros en una SOFIPO autorizada. ¿Qué protección tienes?`,options:[`Ninguna`,`La del IPAB, hasta 400,000 UDIS`,`Un fondo de protección de hasta 25,000 UDIS por persona`],correct:2,explain:`El IPAB cubre bancos. Las SOFIPO autorizadas tienen su propio fondo de protección, con un límite menor.`},{type:`intro`,title:`Compara con la GAT`,body:[`La GAT (Ganancia Anual Total) te dice cuánto gana tu dinero en un año, ya descontando comisiones. Sirve para comparar cuentas.`,`La GAT nominal es el rendimiento en pesos. La GAT real le resta la inflación estimada: es lo que de verdad crece tu poder de compra.`,`Revisa también la letra chica: si hay monto máximo con ese rendimiento, si es a plazo y si hay comisiones.`],callout:{tone:`tip`,text:`Para tu fondo de emergencia prioriza liquidez. Para una meta lejana puedes aceptar un plazo a cambio de más rendimiento.`}},{type:`choice`,prompt:`Una cuenta ofrece una GAT nominal ilustrativa de 9% y la inflación estimada es 4%. ¿Cuál es la GAT real aproximada?`,options:[`13%`,`9%`,`5%`],correct:2,explain:`GAT real ≈ GAT nominal − inflación: 9% − 4% ≈ 5%.`},{type:`choice`,prompt:`Cuenta A: GAT nominal de 7%, retiras cuando quieras. Cuenta B: GAT nominal de 9%, a plazo fijo de un año. ¿Cuál conviene para tu fondo de emergencia?`,options:[`La B, porque rinde más`,`La A, porque puedes sacar el dinero cuando lo necesites`,`Ninguna: mejor en efectivo en casa`],correct:1,explain:`Una emergencia no avisa. Un poco menos de rendimiento vale la pena a cambio de tener el dinero disponible.`},{type:`truefalse`,statement:`Si la GAT real de una cuenta es negativa, tu dinero pierde poder de compra aunque veas más pesos.`,answer:!0,explain:`Significa que los precios suben más rápido que tu rendimiento: tienes más pesos, pero alcanzan para menos.`}],keyPoints:[`El efectivo es práctico, pero no protege ni hace crecer tu dinero.`,`Verifica en el SIPRES que la institución esté autorizada.`,`IPAB: hasta 400,000 UDIS en bancos; SOFIPO autorizadas: hasta 25,000 UDIS.`,`Compara la GAT real y elige la liquidez según tu meta.`]},{id:`m3-l5`,title:`Hábitos para ahorrar sin sufrir`,summary:`Págate primero, automatiza, espera 48 horas, redondea y prueba retos de ahorro.`,minutes:6,xp:60,objectives:[`Aplicar el hábito de pagarte primero`,`Usar la regla de las 48 horas antes de compras no planeadas`,`Elegir un reto de ahorro que se ajuste a tu ingreso`],steps:[{type:`intro`,title:`Págate primero y automatízalo`,body:[`Pagarte primero significa que el ahorro es el primer "gasto" del mes, no lo que sobra al final.`,`Si lo automatizas, ni siquiera tienes que acordarte: programa una transferencia a tu cuenta de ahorro el día que te pagan.`,`Empieza con un porcentaje que no se sienta, como 5% o 10%, y súbelo poco a poco.`],example:{who:`Mau, 22 años, trabaja en una oficina y cobra por quincena`,text:`Recibe $4,000 netos cada quincena y programó una transferencia de 10%:`,rows:[{label:`Ahorro automático por quincena`,amount:400,tag:`Ahorro`},{label:`Ahorro al mes (2 quincenas)`,amount:800,tag:`Ahorro`},{label:`Para gastar cada quincena`,amount:3600}]},terms:[{term:`Págate primero`,def:`Separar tu ahorro en cuanto recibes dinero, antes de cualquier otro gasto.`},{term:`Ahorro automático`,def:`Transferencia programada que mueve dinero a tu ahorro sin que tengas que hacerlo tú.`}]},{type:`choice`,prompt:`Mau ahorra $400 cada quincena. ¿Cuánto junta en un año?`,options:[`$4,800`,`$9,600`,`$8,000`],correct:1,explain:`$400 × 2 quincenas = $800 al mes. $800 × 12 = $9,600 al año.`},{type:`choice`,prompt:`¿Por qué suele funcionar el ahorro automático?`,options:[`Porque siempre da más intereses`,`Porque es obligatorio por ley`,`Porque no depende de tu fuerza de voluntad cada mes`],correct:2,explain:`Al quitar la decisión mensual, evitas el "este mes no" que se repite.`},{type:`intro`,title:`Regla de las 48 horas y redondeo`,body:[`Regla de las 48 horas: ante una compra que no tenías planeada, espera dos días. Si todavía la quieres y cabe en tu presupuesto, adelante.`,`Muchas compras impulsivas pierden su encanto en ese tiempo, y las que siguen valiendo la pena las compras más tranquilo.`,`Redondeo: cada vez que pagas, redondea a la siguiente decena y aparta la diferencia. Son pesos que casi no notas.`],example:{who:`Ejemplo de redondeo en un día`,text:`Cada compra se redondea a la siguiente decena y la diferencia va al ahorro:`,rows:[{label:`Café de $38 → $40`,amount:2,tag:`Ahorro`},{label:`Comida de $87 → $90`,amount:3,tag:`Ahorro`},{label:`Copias de $14 → $20`,amount:6,tag:`Ahorro`},{label:`Despensa de $152 → $160`,amount:8,tag:`Ahorro`}]},callout:{tone:`tip`,text:`Quita tu tarjeta guardada de las tiendas en línea. Tener que escribirla te da tiempo para pensarlo.`}},{type:`choice`,prompt:`Haces tres compras de $46, $73 y $128 y redondeas cada una a la siguiente decena. ¿Cuánto ahorras?`,options:[`$27`,`$13`,`$7`],correct:1,explain:`$46 → $50 ($4), $73 → $80 ($7), $128 → $130 ($2). $4 + $7 + $2 = $13.`},{type:`truefalse`,statement:`La regla de las 48 horas significa que no puedes comprar nada que quieras.`,answer:!1,explain:`Solo te pide esperar. Si después de dos días sigues queriéndolo y te alcanza, lo compras sin culpa.`},{type:`choice`,prompt:`Ves unos tenis en oferta de $1,400 que no tenías planeados. Con la regla de las 48 horas…`,options:[`Los compras ya, antes de que se acabe la oferta`,`Nunca los compras`,`Esperas dos días y, si aún los quieres y caben en tu presupuesto, los compras`],correct:2,explain:`La espera separa el impulso del deseo real. Las ofertas con prisa son justo las que más presionan.`},{type:`intro`,title:`Retos de ahorro`,body:[`Un reto convierte el ahorro en juego. El de 52 semanas es popular: la semana 1 ahorras $10, la semana 2 $20, y así hasta $520 en la semana 52.`,`Hay versiones más ligeras: guardar cada billete de $50 que te llegue, o un día a la semana sin gastos extra.`,`Elige uno que se ajuste a tu ingreso. Si se vuelve pesado, ajústalo: el chiste es mantener el hábito.`],callout:{tone:`alerta`,text:`Ningún reto debe dejarte sin dinero para comida, transporte o salud. Lo básico va primero.`}},{type:`choice`,prompt:`En el reto de 52 semanas ahorras $10 la semana 1, $20 la semana 2… y $520 la semana 52. ¿Cuánto juntas en total?`,options:[`$5,200`,`$27,560`,`$13,780`],correct:2,explain:`Sumas 10 × (1 + 2 + … + 52) = 10 × 1,378 = $13,780.`},{type:`choice`,prompt:`A mitad del reto, los montos ya son muy altos para tu ingreso. ¿Qué conviene?`,options:[`Abandonar el ahorro por completo`,`Ajustar los montos y seguir ahorrando`,`Pedir prestado para cumplir el reto`],correct:1,explain:`El reto es una herramienta, no una obligación. Ajustarlo mantiene el hábito sin poner en riesgo lo básico.`}],keyPoints:[`Págate primero: el ahorro es el primer gasto del mes.`,`Automatizar quita la decisión mensual y hace el hábito más fácil.`,`Espera 48 horas antes de compras que no planeaste.`,`Los retos ayudan si se ajustan a tu ingreso.`]}]},{id:`m8`,title:`Consumo inteligente`,description:`Compara precios, compra en línea con seguridad, controla tus suscripciones y reconoce ofertas que presionan.`,why:`Cada peso que no se va en un cargo olvidado o en una oferta engañosa se queda para lo que sí te importa. Comprar bien es una habilidad que usas todos los días.`,lessons:[{id:`m8-l1`,title:`Comparar antes de comprar`,summary:`Precio por unidad, costo total con envío, reseñas y herramientas de PROFECO.`,minutes:6,xp:60,objectives:[`Calcular el precio por unidad para comparar presentaciones`,`Sumar envío y cargos extra para conocer el precio total`,`Usar reseñas y fuentes como PROFECO con criterio`],steps:[{type:`intro`,title:`El paquete más grande no siempre es más barato`,body:[`Dos productos iguales pueden venir en tamaños distintos. Para saber cuál conviene, divide el precio entre la cantidad.`,`A eso se le llama precio por unidad: cuánto pagas por cada gramo, mililitro o pieza.`,`Muchas veces el tamaño grande sale mejor, pero no siempre. Y si se te echa a perder antes de usarlo, lo barato sale caro.`],example:{who:`Sofía, 20 años, uni y renta compartida`,text:`Compara dos shampoos de la misma marca en la tiendita:`,rows:[{label:`Botella de 400 ml`,amount:64},{label:`Botella de 750 ml`,amount:105}]},terms:[{term:`Precio por unidad`,def:`Lo que cuesta cada gramo, mililitro o pieza. Sirve para comparar tamaños distintos.`},{term:`Presentación`,def:`El tamaño o formato en que se vende un producto: 400 ml, 1 kg, paquete de 6, etc.`}]},{type:`choice`,prompt:`En el ejemplo de Sofía, ¿cuánto cuestan 100 ml en cada botella?`,options:[`$16 la chica y $16 la grande`,`$16 la chica y $14 la grande`,`$14 la chica y $16 la grande`],correct:1,explain:`Botella chica: $64 ÷ 4 = $16 por 100 ml. Botella grande: $105 ÷ 7.5 = $14 por 100 ml. La grande conviene si la vas a usar toda.`},{type:`choice`,prompt:`Detergente: 1 kg cuesta $45 y la bolsa de 3 kg cuesta $120. ¿Cuál tiene mejor precio por kilo?`,options:[`La de 3 kg`,`La de 1 kg`,`Cuestan igual por kilo`],correct:0,explain:`$120 ÷ 3 = $40 por kilo, contra $45 de la bolsa chica. Ahorras $5 por kilo con la grande.`},{type:`intro`,title:`El precio que importa es el total`,body:[`En línea, el precio que ves al inicio no siempre es lo que pagas. Revisa envío, comisiones por pago y cargos que aparecen al final.`,`Compara siempre el precio total, ya con todo, en al menos dos o tres tiendas.`,`También cuenta el tiempo: si un producto llega en 15 días y lo necesitas mañana, quizá te conviene otra opción aunque cueste un poco más.`],example:{who:`Diego, 18 años, prepa y trabajo de fin de semana`,text:`Quiere unos audífonos y encuentra el mismo modelo en dos tiendas en línea:`,rows:[{label:`Tienda A: precio`,amount:450},{label:`Tienda A: envío`,amount:99,tag:`Cuidado`},{label:`Tienda B: precio con envío gratis`,amount:499}]},callout:{tone:`tip`,text:`Antes de pagar, llega hasta la pantalla final del carrito. Ahí aparece el total real con envío y cargos.`}},{type:`choice`,prompt:`En el ejemplo de Diego, ¿qué tienda le sale más barata?`,options:[`La tienda A, por $49`,`Cuestan lo mismo`,`La tienda B, por $50`],correct:2,explain:`Tienda A: $450 + $99 = $549. Tienda B: $499. La B sale $50 más barata aunque su precio inicial parecía mayor.`},{type:`truefalse`,statement:`Si un producto cuesta menos, siempre es la mejor compra.`,answer:!1,explain:`Mito. Importa el precio total, cuánto dura y si de verdad lo vas a usar. Algo barato que se rompe pronto puede salir más caro.`},{type:`intro`,title:`Reseñas y fuentes confiables`,body:[`Las reseñas de otros compradores ayudan, pero léelas con calma. Fíjate en las de 2 y 3 estrellas: suelen ser las más detalladas.`,`Desconfía de productos con puras reseñas perfectas, todas escritas el mismo día o con frases muy parecidas.`,`Busca opiniones en más de un lugar y fíjate si hablan de lo que a ti te importa: duración, talla, garantía o servicio.`],callout:{tone:`dato`,text:`La PROFECO publica comparativos de precios entre tiendas y estudios de calidad de productos. Son gratuitos y no venden nada.`},terms:[{term:`PROFECO`,def:`Procuraduría Federal del Consumidor. Protege tus derechos cuando compras bienes o servicios.`},{term:`Reseña`,def:`Opinión de alguien que ya compró el producto o usó el servicio.`}]},{type:`truefalse`,statement:`Un producto con cientos de reseñas de 5 estrellas seguro es bueno.`,answer:!1,explain:`Mito. Algunas reseñas son falsas o pagadas. Revisa las calificaciones medias y si las opiniones suenan reales.`},{type:`choice`,prompt:`¿Qué reseña te da información más útil para decidir?`,options:[`"¡Excelente! 5 estrellas"`,`"Pésimo, no compren"`,`"Buen sonido, pero el cable se dañó a los 4 meses y la garantía tardó 3 semanas"`],correct:2,explain:`Explica qué funcionó, qué falló y cómo respondió la tienda. Las reseñas sin detalles casi no ayudan a decidir.`},{type:`choice`,prompt:`Quieres comparar precios de la despensa entre varias tiendas sin que te vendan nada. ¿Dónde puedes consultar?`,options:[`En los comparativos de la PROFECO`,`Solo en los anuncios de cada tienda`,`En el SAT`],correct:0,explain:`La PROFECO compara precios de forma gratuita. Los anuncios muestran solo lo que le conviene a cada tienda, y el SAT se encarga de impuestos.`}],keyPoints:[`Divide precio entre cantidad para comparar presentaciones distintas.`,`Compara el precio total con envío y cargos, no el precio inicial.`,`Lee reseñas con detalle y desconfía de las perfectas.`,`La PROFECO tiene comparativos de precios gratuitos.`]},{id:`m8-l2`,title:`Compras en línea seguras`,summary:`Sitios confiables, formas de pago más seguras, garantías y tus derechos.`,minutes:6,xp:60,objectives:[`Reconocer señales de una tienda en línea confiable`,`Elegir formas de pago que limiten tu riesgo`,`Identificar tus derechos y a dónde acudir si algo sale mal`],steps:[{type:`intro`,title:`¿Es una tienda confiable?`,body:[`Antes de comprar, revisa que la dirección de la página esté bien escrita y empiece con https. El candado no garantiza que sea honesta, pero sin él no pongas datos.`,`Una tienda seria muestra su nombre legal, datos de contacto, aviso de privacidad y políticas de envío y devolución.`,`Señales de alerta: precios demasiado bajos, presión para pagar ya y que solo acepten transferencia o depósito a una persona.`],callout:{tone:`alerta`,text:`Si el único método de pago es transferir a una cuenta personal o depositar en una tiendita, es muy difícil recuperar tu dinero si es un fraude.`}},{type:`choice`,prompt:`¿Cuál de estas es la señal MÁS preocupante en una tienda en línea?`,options:[`Tarda 5 días en entregar`,`Solo acepta transferencia a una cuenta personal`,`Cobra envío de $99`],correct:1,explain:`Pagar a una cuenta personal casi no te deja forma de reclamar. Que tarde o cobre envío es normal en tiendas legítimas.`},{type:`truefalse`,statement:`Si la página tiene candado y https, la tienda es confiable.`,answer:!1,explain:`Mito. El candado indica que la conexión está cifrada, pero un sitio falso también puede tenerlo. Revisa también quién vende y sus políticas.`},{type:`intro`,title:`Paga de forma que limites el riesgo`,body:[`Muchos bancos ofrecen tarjetas digitales: un número distinto al de tu plástico, a veces con código de seguridad que cambia. Si roban esos datos, puedes apagarla sin afectar tu tarjeta física.`,`Otra opción es usar una tarjeta de débito con poco saldo, solo para compras en línea. Así, lo que queda expuesto es poco.`,`Con tarjeta puedes pedir una aclaración al banco si no te llega el producto o te cobran de más. Con efectivo o transferencia a desconocidos es mucho más difícil.`],example:{who:`Andrea, 22 años, recién egresada`,text:`Tiene su dinero en su cuenta principal y pasa solo lo necesario a una tarjeta para compras en línea:`,rows:[{label:`Saldo en cuenta principal`,amount:5e3,tag:`Ahorro`},{label:`Pasa a su tarjeta de compras en línea`,amount:1500},{label:`Compra unos tenis con envío`,amount:1370}]},terms:[{term:`Tarjeta digital`,def:`Tarjeta con número propio que vive en la app del banco. Puedes apagarla o borrarla cuando quieras.`},{term:`CVV dinámico`,def:`Código de seguridad que cambia cada cierto tiempo, así los datos robados dejan de servir.`},{term:`Aclaración`,def:`Solicitud al banco para revisar un cargo que no reconoces o que no corresponde a lo que recibiste.`}]},{type:`choice`,prompt:`Después de su compra, alguien roba los datos de la tarjeta de compras de Andrea. ¿Cuánto podría gastar como máximo?`,options:[`$5,000`,`$1,370`,`$130`],correct:2,explain:`$1,500 − $1,370 = $130. Como solo pasó lo necesario, sus $5,000 de la cuenta principal no quedaron expuestos.`},{type:`choice`,prompt:`Vas a comprar en una tienda que no conoces mucho. ¿Qué forma de pago te protege más?`,options:[`Depósito en efectivo a la cuenta del vendedor`,`Tarjeta digital que puedes apagar después`,`Transferencia a un número de celular que te mandaron por mensaje`],correct:1,explain:`La tarjeta digital te permite pedir aclaración y apagarla si algo sale mal. Depósitos y transferencias a desconocidos son casi imposibles de recuperar.`},{type:`intro`,title:`Garantías, devoluciones y tus derechos`,body:[`Antes de pagar, lee la política de devoluciones: cuántos días tienes, quién paga el envío de regreso y si te devuelven dinero o solo saldo en la tienda.`,`En México, la ley de protección al consumidor dice que los proveedores deben informarte el precio total, respetar lo que anuncian y cumplir con las garantías.`,`Guarda tu comprobante, capturas del anuncio y los mensajes con la tienda. Si no te responden, puedes presentar una queja ante la PROFECO, incluso en línea.`],callout:{tone:`dato`,text:`La PROFECO atiende quejas contra tiendas, incluidas las de internet, y puede ayudarte a llegar a un acuerdo con el proveedor sin costo.`}},{type:`choice`,prompt:`Compraste una chamarra en línea y llegó de otra talla. ¿Qué haces primero?`,options:[`Contacto a la tienda con fotos y mi comprobante, según su política de devolución`,`Publico una mala reseña y me olvido`,`Me quedo con ella; en línea no hay devoluciones`],correct:0,explain:`Primero reclama a la tienda con evidencia. Si no te resuelven, puedes acudir a la PROFECO con esa misma evidencia.`},{type:`truefalse`,statement:`Las compras en internet también están protegidas por las leyes de protección al consumidor.`,answer:!0,explain:`Realidad. Las tiendas en línea que te venden en México deben respetar tus derechos como consumidor, y la PROFECO puede atender tu queja.`},{type:`choice`,prompt:`¿Qué conviene guardar después de una compra en línea?`,options:[`Nada, la tienda guarda todo`,`Solo la caja del producto`,`Comprobante de pago, captura del anuncio y mensajes con la tienda`],correct:2,explain:`Esa evidencia demuestra qué te prometieron y qué pagaste. Sin ella es más difícil reclamar una garantía o devolución.`}],keyPoints:[`Revisa quién vende, sus datos de contacto y sus políticas antes de pagar.`,`Una tarjeta digital o con poco saldo limita lo que puedes perder.`,`Evita transferir o depositar a cuentas personales de desconocidos.`,`Guarda evidencia: si la tienda no responde, acude a la PROFECO.`]},{id:`m8-l3`,title:`Suscripciones y pagos recurrentes`,summary:`Pruebas gratis que se cobran, el costo anual real y cómo cancelar a tiempo.`,minutes:6,xp:60,objectives:[`Calcular cuánto cuestan tus suscripciones al año`,`Reconocer cómo las pruebas gratis se vuelven cargos`,`Revisar tu estado de cuenta y cancelar lo que no usas`],steps:[{type:`intro`,title:`Pagos chiquitos que suman mucho`,body:[`Una suscripción es un pago que se cobra solo, cada mes o cada año: video, música, almacenamiento, apps, juegos o gimnasio.`,`Cada una parece barata, pero juntas pueden ser un gasto fijo importante. Y como no las pagas "a mano", es fácil olvidarlas.`,`Tener suscripciones no está mal. La idea es que pagues solo por las que sí usas y disfrutas.`],example:{who:`Luis, 21 años, uni y trabajo de medio tiempo`,text:`Revisó su estado de cuenta y encontró estos cargos mensuales (montos ilustrativos):`,rows:[{label:`Plataforma de video`,amount:139,tag:`Fijo`},{label:`Música (plan estudiante)`,amount
